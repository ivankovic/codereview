# cargo-audit. CI runs `cargo audit --deny warnings`, so an unmaintained dependency has to
# be looked at rather than ignored by default.

[advisories]
# bincode 1.3 is unmaintained. It reaches the build only through syntect's `dump-load`
# feature, where it deserialises syntect's own bundled syntax dumps, which ship with the
# binary: never a file from a repository, never anything from a request. Reviewed
# 2026-09-16; it goes away if `dump-load` ever does.
ignore = ["RUSTSEC-2025-0141"]
