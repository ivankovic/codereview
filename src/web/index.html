<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- `interactive-widget=resizes-content` shrinks the layout when the soft keyboard opens,
     so what is being typed into (the agent's compose box, a comment) stays in view. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="themecolor" content="#1b1e24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="codereview">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<title>codereview</title>
<style>
:root {
  --bg: #15171c; --panel: #1b1e24; --code-bg: #15171c; --fg: #d6d8de; --dim: #8a8f9a;
  --border: #2b2f38; --accent: #5ec8e5; --cursor: #2c3242;
  --ins: rgba(46,160,67,.28); --ins-strong: rgba(46,160,67,.55);
  --del: rgba(248,81,73,.28); --del-strong: rgba(248,81,73,.55);
  --upd: rgba(210,153,34,.28); --upd-strong: rgba(210,153,34,.55);
  --mov: rgba(150,157,170,.28); --mov-strong: rgba(150,157,170,.55);
  --exact: #5ec8e5; --moved: #e3b341; --stale: #f85149; --search: rgba(255,200,0,.45); --visual: #2b3a4a;
  --ins-fg: #3fb950; --del-fg: #f85149; --upd-fg: #e3b341; --mov-fg: #9aa0ab;
}
* { box-sizing: border-box; }
/* Elements with their own `display` (the popover, the drawer) must still honour `hidden`. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
/* The dynamic viewport unit follows a phone browser's collapsing toolbars; plain 100% does not. */
@supports (height: 100dvh) { body { height: 100dvh; } }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
/* Shown on a phone only; see the narrow-screen rules at the end. */
.phone { display: none; }
a { color: var(--accent); }
button { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
button:hover { border-color: var(--accent); }
button.primary { border-color: var(--accent); color: var(--accent); }
button.small { padding: 1px 6px; font-size: 11px; }
input, textarea, select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font: inherit; }
textarea { width: 100%; min-height: 3.2em; font-family: ui-monospace, Menlo, Consolas, monospace; }
header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; position: relative; z-index: 6; }
/* On a wide screen the tools sit in the header row as if the wrapper were not there. */
header .tools { display: contents; }
header .brand { font-weight: 700; color: var(--accent); }
header #branch { max-width: 28vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .tabs button { border-radius: 0; border: none; border-bottom: 2px solid transparent; background: none; }
header .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); }
.spacer { flex: 1; }
.dim { color: var(--dim); }
main { flex: 1; display: flex; min-height: 0; }
aside#tree { width: 280px; min-width: 180px; max-width: 50vw; overflow: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 6px 0; resize: horizontal; }
body:not([data-view=explore]) #tree { display: none; }
aside#tree .row { padding: 1px 8px; cursor: pointer; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
aside#tree .row:hover { background: var(--cursor); }
aside#tree .row.selected { background: var(--visual); }
aside#tree .row .st { width: 1em; text-align: center; font-family: ui-monospace, monospace; }
aside#tree .row .st.M, aside#tree .name.M { color: var(--upd-fg); }
aside#tree .row .st.A, aside#tree .name.A { color: var(--ins-fg); }
aside#tree .row .st.D { color: var(--del-fg); }
aside#tree .row .st.q, aside#tree .name.q { color: var(--dim); }
aside#tree .dir { font-weight: 600; }
aside#tree .cnt { color: var(--exact); font-size: 11px; margin-left: auto; }
aside#tree .add { visibility: hidden; margin-left: 6px; padding: 0 4px; color: var(--dim); }
aside#tree .row.dir:hover .add { visibility: visible; }
aside#tree .add:hover { color: var(--fg); }
aside#tree input { width: calc(100% - 16px); margin: 0 8px 6px; }
section#content { flex: 1; overflow: auto; min-width: 0; }
.panelhead { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panelhead .path { font-weight: 600; font-family: ui-monospace, monospace; }
.badge { padding: 0 6px; border-radius: 8px; font-size: 11px; border: 1px solid var(--border); }
.badge.M { color: var(--upd-fg); } .badge.A, .badge.q { color: var(--ins-fg); } .badge.D { color: var(--del-fg); }
table.code { border-collapse: collapse; width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--code-bg); }
table.code td { padding: 0 6px; vertical-align: top; white-space: pre; }
table.code td.n { text-align: right; color: var(--dim); user-select: none; cursor: pointer; width: 1%; border-right: 1px solid var(--border); }
table.code td.n:hover { color: var(--fg); background: var(--cursor); }
table.code td.m { width: 1%; text-align: center; user-select: none; padding: 0 2px; }
table.code td.b { color: var(--dim); font-size: 11px; white-space: nowrap; user-select: none; }
table.code tr.op-insert td.c { background: var(--ins); }
table.code tr.op-delete td.c { background: var(--del); }
table.code tr.op-update td.c { background: var(--upd); }
table.code tr.op-move td.c { background: var(--mov); }
table.code tr.op-insert td.m { color: var(--ins-fg); } table.code tr.op-delete td.m { color: var(--del-fg); }
table.code tr.op-update td.m { color: var(--upd-fg); } table.code tr.op-move td.m { color: var(--mov-fg); }
table.code tr.sel td.c { background: var(--visual); }
table.code tr.cur td { background: var(--cursor); }
table.code tr.empty td.c { background: var(--panel); }
span.s-insert { background: var(--ins-strong); } span.s-delete { background: var(--del-strong); }
span.s-update { background: var(--upd-strong); } span.s-move { background: var(--mov-strong); }
mark { background: var(--search); color: inherit; }
tr.comment td { background: var(--panel); padding: 4px 12px; white-space: normal; font-family: -apple-system, "Segoe UI", sans-serif; border-bottom: 1px solid var(--border); }
/* A comment row spans the table, which is as wide as the longest line of code. The comment
   itself stays as wide as the panel and sticks to its left edge, so the text and the buttons
   are in view however far the code has been scrolled sideways. `--panel-w` is measured. */
.cmt, tr.form .form { position: sticky; left: 12px; width: var(--panel-w, 100%); box-sizing: border-box; }
.cmt { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cmt .who { font-weight: 600; }
.cmt.exact .who { color: var(--exact); } .cmt.moved .who { color: var(--moved); } .cmt.stale .who { color: var(--stale); }
.cmt.done { opacity: .6; }
.cmt .text { flex: 1; white-space: pre-wrap; }
.cmt .actions { display: flex; gap: 4px; }
.cmt .st { font-size: 11px; color: var(--dim); }
tr.form td { background: var(--panel); padding: 6px 12px; white-space: normal; }
.form .row { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
.list { padding: 8px 12px; }
.list .item { padding: 4px 8px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.list .item:hover, .list .item.selected { background: var(--cursor); }
.list .item .mono { font-family: ui-monospace, monospace; }
.list .item .grow { flex: 1; }
.split { display: flex; height: 100%; min-height: 0; }
.split > div { flex: 1; overflow: auto; min-width: 0; }
.split > div:first-child { border-right: 1px solid var(--border); max-width: 50%; }
.details { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-family: ui-monospace, monospace; white-space: pre-wrap; }
.status-letter { display: inline-block; width: 1.2em; font-family: ui-monospace, monospace; }
.status-letter.A { color: var(--ins-fg); } .status-letter.D { color: var(--del-fg); } .status-letter.M { color: var(--upd-fg); } .status-letter.R { color: var(--mov-fg); } .status-letter.q { color: var(--dim); }
.sbs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.sbs table.code { width: 100%; }
.sbs > div { overflow-x: auto; min-width: 0; }
.sbs > div:first-child { border-right: 2px solid var(--border); }
footer { padding: 4px 12px; border-top: 1px solid var(--border); background: var(--panel); color: var(--dim); font-size: 12px; display: flex; gap: 16px; }
footer .msg.error { color: var(--del-fg); }
.center { padding: 40px; color: var(--dim); text-align: center; }
#help { position: fixed; inset: 10% 20%; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 16px 24px; overflow: auto; z-index: 10; }
#help h3 { margin: 8px 0 4px; color: var(--accent); }
#help table td { padding: 1px 12px 1px 0; }
#help kbd { font-family: ui-monospace, monospace; background: var(--bg); padding: 0 4px; border-radius: 3px; border: 1px solid var(--border); }
/* The text editor: what used to be the browser's prompt(). A sheet on a phone. */
#editor { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
#editor .sheet { background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 16px; width: min(560px, calc(100vw - 32px)); }
#editor .title { font-weight: 600; margin-bottom: 6px; }
#editor textarea { min-height: 5em; }
.hunknav { display: contents; }
#popover { position: fixed; z-index: 20; max-width: 90vw; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
#popover .word { font-family: ui-monospace, monospace; font-weight: 600; margin-right: 4px; }
#drawer { width: 380px; min-width: 200px; max-width: 60vw; border-left: 1px solid var(--border); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
#drawer .panelhead { position: static; }
/* The list scrolls, not the drawer, so the close button in its header stays put. */
#drawer .list { flex: 1; overflow: auto; }
#drawer .list .item { flex-direction: column; align-items: stretch; gap: 2px; }
#drawer .list .item .loc { color: var(--accent); font-family: ui-monospace, monospace; font-size: 12px; }
#drawer .list .item .label { font-weight: 600; }
#drawer .list .item .text { font-family: ui-monospace, monospace; font-size: 12px; color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#agent { display: flex; flex-direction: column; height: 100%; }
#agent .transcript { flex: 1; overflow: auto; padding: 12px 16px; }
#agent .entry { display: flex; gap: 10px; margin-bottom: 10px; }
#agent .entry .who { width: 56px; flex: none; font-weight: 600; color: var(--dim); font-size: 12px; padding-top: 2px; }
#agent .entry.user .who { color: var(--accent); }
#agent .entry .body { flex: 1; white-space: pre-wrap; word-break: break-word; }
#agent .entry.thought .body, #agent .entry.system .body { color: var(--dim); font-style: italic; }
#agent .entry.tool .body { color: var(--upd-fg); font-family: ui-monospace, monospace; font-size: 12px; }
#agent .entry.log { margin-bottom: 2px; }
#agent .entry.log .body { color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px; }
#agent .progress { color: var(--accent); font-size: 12px; }
#agent .permission pre.perm { margin: 6px 0 0; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; max-height: 12em; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
/* A server started with --no-agent offers no way to one. */
body.no-agent [data-view=agent], body.no-agent [data-act=ask], body.no-agent [data-act=askall],
body.no-agent [data-act=review] { display: none !important; }
#agent .usage { color: var(--dim); font-size: 12px; }
#agent .compose { border-top: 1px solid var(--border); padding: 8px 12px; background: var(--panel); }
#agent .compose textarea { min-height: 2.6em; }
#agent .permission { padding: 8px 12px; background: var(--upd); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 800px) {
  #help { inset: 4%; padding: 12px; }
}
/* Touch: no hover, and a finger needs more room than a pointer. */
@media (hover: none) {
  aside#tree .add { visibility: visible; }
  input, textarea, select { font-size: 16px; }  /* below 16px iOS zooms the page into a focused field */
  button { padding: 8px 12px; }
  button.small { padding: 6px 10px; font-size: 13px; }
  header .tabs button { min-height: 44px; }
  aside#tree .row { min-height: 40px; }
  .list .item { min-height: 44px; }
  table.code { font-size: 13px; line-height: 1.7; }
  table.code td.n { min-width: 44px; padding: 0 8px; }
  #drawer .list .item { min-height: 48px; }
  aside#tree { resize: none; }
}
/* A phone, upright or on its side: one header row, the tabs along the bottom edge, and one
   pane at a time. */
@media (max-width: 700px), (max-height: 500px) {
  .phone { display: revert; }
  body { padding-bottom: calc(46px + env(safe-area-inset-bottom)); }
  header { padding: 6px 10px; gap: 8px; }
  header #branch { max-width: 40vw; }
  header #more { padding: 4px 10px; font-size: 16px; line-height: 1; }
  header .tools { display: none; }
  header.open .tools { display: flex; flex-direction: column; gap: 8px; position: absolute; top: 100%; left: 0; right: 0; padding: 10px 12px 12px; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  header.open .tools input, header.open .tools select, header.open .tools button { width: 100%; }
  header .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--panel); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  header .tabs button { flex: 1; min-width: 0; padding: 6px 2px; font-size: 12px; border-bottom: none; border-top: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tabs button.active { border-top-color: var(--accent); }
  header .tabs .badge { padding: 0 4px; }
  /* Explore is the tree, or the file, never both. */
  aside#tree { width: auto; min-width: 0; max-width: none; flex: 1; border-right: none; }
  body[data-view=explore]:not(.showfile) #content { display: none; }
  body[data-view=explore].showfile #tree { display: none; }
  /* Log: the commits, or one commit. */
  .split > div:first-child { max-width: none; border-right: none; }
  .split:not(.detail) > div:last-child { display: none; }
  .split.detail > div:first-child { display: none; }
  /* Lists become cards: the text on its own line, the buttons under it. */
  .list .item { flex-wrap: wrap; row-gap: 4px; }
  .list .item .grow:not(.mono) { flex-basis: 100%; order: 2; }
  .list .item .actions { flex-basis: 100%; order: 3; }
  .cmt .text { flex-basis: 100%; }
  #drawer { position: fixed; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom)); height: 50vh; width: auto; min-width: 0; max-width: none; border-left: none; border-top: 1px solid var(--accent); z-index: 4; box-shadow: 0 -8px 24px rgba(0,0,0,.3); }
  .sbs { grid-template-columns: 1fr; }
  [data-act=layout] { display: none; }
  .hunknav { display: flex; flex-direction: column; gap: 6px; position: fixed; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 4; }
  .hunknav button { min-width: 44px; min-height: 44px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  footer { gap: 8px; }
  footer span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #editor { align-items: flex-end; }
  #editor .sheet { width: 100%; border-radius: 10px 10px 0 0; border-bottom: none; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #popover { max-width: calc(100vw - 16px); }
  #agent .transcript { padding: 10px 12px; }
  #agent .entry .who { width: 44px; }
}
</style>
</head>
<body data-view="explore">
<header>
  <span class="brand">codereview</span>
  <select id="repo" title="which repository the page shows" hidden></select>
  <span id="branch" class="dim"></span>
  <nav class="tabs">
    <button data-view="explore" class="active">Explore</button>
    <button data-view="changes">Changes</button>
    <button data-view="log">Log</button>
    <button data-view="review">Review <span id="pending" class="badge"></span></button>
    <button data-view="notes">Notes</button>
    <button data-view="agent">Agent <span id="agentdot" class="badge" hidden></span></button>
  </nav>
  <span class="spacer"></span>
  <button id="more" class="phone" title="search, colour scheme, and more">⋯</button>
  <div class="tools">
    <input id="symbol" placeholder="find symbol (#)" size="16" title="definitions whose name contains this">
    <input id="search" placeholder="search in file (/)" size="20">
    <select id="theme" title="colour scheme, saved to the config file"></select>
    <button id="refresh" title="re-read the repository and both Markdown files">Refresh</button>
    <button id="signout" title="end this session in this browser">Sign out</button>
    <button id="helpbtn">?</button>
  </div>
</header>
<main>
  <aside id="tree"></aside>
  <section id="content"><div class="center">Pick a file from the tree.</div></section>
  <aside id="drawer" hidden></aside>
</main>
<div id="popover" hidden></div>
<div id="editor" hidden><div class="sheet"><div class="title"></div><textarea></textarea>
  <div class="form"><div class="row"><button class="primary" data-act="ok">Save</button><button data-act="cancel">Cancel</button></div></div></div></div>
<footer><span id="hint" class="dim"></span><span id="msg" class="msg"></span></footer>
<div id="help" hidden></div>
<script>
'use strict';
const TOKEN = __TOKEN__;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = {
  repo: 0, repos: [], agentEnabled: true,
  view: 'explore', files: [],
  // path -> the one-letter change mark, which is not the same shape as a ChangedFile's
  // `status`, a word.
  statusLetters: {}, pending: 0, hasCommits: true,
  tree: { collapsed: new Set(), filter: '' },
  file: null,      // { path, lines, text, comments, notes, line_ops, blame }
  diff: null,      // { params, data, unified, siblings, index, back }
  log: null,       // { path, commits, selected, files, exhausted }
  review: { showCompleted: false },
  search: '',
};

// Wires a panel button, named by `data-act`. Optional by design: several panels show a
// button only when it applies.
function on(root, act, fn) {
  root.querySelector(`[data-act=${act}]`)?.addEventListener('click', fn);
}

// The one-letter mark for a changed file: `?` for untracked, otherwise its status.
// `q` is the CSS class for `?`, which is not a name a class may have.
function statusClass(letter) {
  return letter === '?' ? 'q' : letter;
}

function statusLetter(f) {
  return f.status === 'untracked' ? '?' : f.status[0].toUpperCase();
}

// A query string from an object, leaving out what is not set.
function qs(params) {
  return Object.entries(params)
    .filter(([, v]) => v !== undefined && v !== null && v !== '')
    .map(([k, v]) => k + '=' + encodeURIComponent(v))
    .join('&');
}

async function api(path, opts = {}) {
  const init = { headers: { 'Authorization': 'Bearer ' + TOKEN } };
  if (opts.body !== undefined) {
    init.method = 'POST';
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  } else if (opts.post) {
    init.method = 'POST';
  }
  // Every call names the repository the page is on; the server defaults to the first.
  const res = await fetch('/api' + path + (path.includes('?') ? '&' : '?') + 'repo=' + state.repo, init);
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

function msg(text, isError = false) {
  const el = $('#msg');
  el.textContent = text || '';
  el.className = 'msg' + (isError ? ' error' : '');
  // Clear it later, unless something newer has been said in the meantime.
  if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 6000);
}
function fail(e) { console.error(e); msg(e.message || String(e), true); }

// A pointer that cannot hover is a finger: hints then say "tap", and never mention a key.
const TOUCH = window.matchMedia && window.matchMedia('(hover: none)').matches;
// A narrow or a short screen shows one pane at a time; the stylesheet draws the same line.
const phone = () => window.matchMedia && window.matchMedia('(max-width: 700px), (max-height: 500px)').matches;
function hint(mouse, touch) { $('#hint').textContent = TOUCH ? (touch === undefined ? mouse : touch) : mouse; }

// Asks for a piece of text in a sheet of the page's own, with a real textarea: the
// browser's prompt() is one line and looks foreign on a phone. Resolves to null on cancel.
function askText(title, initial = '', okLabel = 'Save') {
  return new Promise(resolve => {
    const ed = $('#editor');
    const ta = ed.querySelector('textarea');
    ed.querySelector('.title').textContent = title;
    ed.querySelector('[data-act=ok]').textContent = okLabel;
    ta.value = initial;
    ed.hidden = false;
    const done = value => { ed.hidden = true; ed.onclick = null; resolve(value); };
    ed.querySelector('[data-act=ok]').onclick = () => done(ta.value.trim() ? ta.value : null);
    ed.querySelector('[data-act=cancel]').onclick = () => done(null);
    ed.onclick = e => { if (e.target === ed) done(null); };
    ta.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); done(ta.value.trim() ? ta.value : null); }
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
    };
    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
  });
}

// The header's tools live behind one button on a phone.
$('#more').onclick = e => { e.stopPropagation(); document.querySelector('header').classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('header') || e.target.closest('header .tools button')) document.querySelector('header').classList.remove('open'); });

// Comment rows are as wide as the panel that scrolls the code, not as wide as the code; the
// width is measured, since the tree and the drawer change it.
const panelWatcher = window.ResizeObserver && new ResizeObserver(entries => {
  for (const en of entries) en.target.style.setProperty('--panel-w', Math.max(0, en.target.clientWidth - 24) + 'px');
});
function watchPanel(el) { if (panelWatcher) panelWatcher.observe(el); }
watchPanel($('#content'));

// ----- state ----------------------------------------------------------------------------------

function applyTheme(t) {
  // A terminal-palette scheme has no browser colours: follow the browser's preference.
  if (!t || t.terminal) {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    t = state.themesByName && state.themesByName[dark ? 'Dark' : 'Light'];
    if (!t) return;
  }
  const r = document.documentElement.style;
  const alpha = (hex, a) => hex.startsWith('#') && hex.length === 7 ? `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})` : hex;
  r.setProperty('--bg', t.bg); r.setProperty('--code-bg', t.bg); r.setProperty('--fg', t.fg);
  r.setProperty('--panel', t.panel); r.setProperty('--border', t.border); r.setProperty('--dim', t.dim);
  r.setProperty('--accent', t.accent); r.setProperty('--cursor', t.cursor_bg);
  r.setProperty('--ins', t.insert_line); r.setProperty('--ins-strong', t.insert_span);
  r.setProperty('--del', t.delete_line); r.setProperty('--del-strong', t.delete_span);
  r.setProperty('--upd', t.update_line); r.setProperty('--upd-strong', t.update_span);
  r.setProperty('--mov', t.move_line); r.setProperty('--mov-strong', t.move_span);
  r.setProperty('--exact', t.exact); r.setProperty('--moved', t.moved); r.setProperty('--stale', t.stale);
  r.setProperty('--search', alpha(t.search_bg, .6)); r.setProperty('--visual', t.visual_bg);
  r.setProperty('--ins-fg', t.insert_fg); r.setProperty('--del-fg', t.delete_fg);
  r.setProperty('--upd-fg', t.update_fg); r.setProperty('--mov-fg', t.move_fg);
  document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
  // The browser's own chrome around a home-screen app follows the scheme too.
  $('#themecolor').setAttribute('content', t.panel);
}

async function loadState() {
  const s = await api('/state');
  state.agentEnabled = s.agent !== false;
  document.body.classList.toggle('no-agent', !state.agentEnabled);
  state.files = s.files;
  state.theme = s.theme;
  const sel = $('#theme');
  // Only when the list itself changed: rebuilding it would close an open dropdown.
  if (sel.options.length !== s.themes.length + (s.theme.terminal ? 1 : 0)) {
    sel.innerHTML = (s.theme.terminal ? '<option value="Terminal">Terminal (browser default)</option>' : '') + s.themes.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  }
  sel.value = s.theme.name;
  applyTheme(s.theme);
  state.statusLetters = Object.fromEntries(s.status);
  state.pending = s.pending;
  state.hasCommits = s.has_commits;
  $('#branch').textContent = s.branch + ' · ' + s.root;
  $('#pending').textContent = s.pending;
  renderTree();
}

// ----- repositories ---------------------------------------------------------------------------

async function loadRepos() {
  state.repos = await api('/repos');
  const sel = $('#repo');
  sel.hidden = state.repos.length < 2;
  sel.innerHTML = state.repos.map(r => `<option value="${r.index}">${esc(r.name)}${r.pending ? ' · ' + r.pending : ''}</option>`).join('');
  sel.value = String(state.repo);
}

/// Moves the page to another served repository: everything shown belongs to one, so the
/// per-repository state starts over and the agent transcript is rebuilt from that
/// repository's events.
async function switchRepo(index) {
  state.repo = index;
  state.file = null; state.diff = null; state.log = null; state.allComments = undefined;
  state.tree.collapsed = new Set(); state.tree.filter = '';
  Object.assign(agent, { version: 0, entries: [], permission: null, running: false, name: '', status: 'not started',
    progress: '', usage: '', pollFailures: 0, startedAt: null });
  state.allComments = await api('/comments');
  await loadState();
  setTabs('explore');
  document.body.classList.remove('showfile');
  $('#content').innerHTML = '<div class="center">Pick a file from the tree.</div>';
  $('#agentdot').hidden = true;
  agentPoll();
  msg('repository ' + (state.repos[index] ? state.repos[index].name : index));
}

$('#repo').onchange = e => switchRepo(Number(e.target.value)).then(() => navigate(routes.tree())).catch(fail);

// ----- tree -----------------------------------------------------------------------------------

function buildTree() {
  const root = { dirs: new Map(), files: [] };
  for (const f of state.files) {
    if (state.tree.filter && !f.toLowerCase().includes(state.tree.filter.toLowerCase())) continue;
    const parts = f.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node.dirs.has(parts[i])) node.dirs.set(parts[i], { dirs: new Map(), files: [], path: parts.slice(0, i + 1).join('/') });
      node = node.dirs.get(parts[i]);
    }
    node.files.push({ name: parts[parts.length - 1], path: f });
  }
  return root;
}

function renderTree() {
  const counts = Object.create(null);
  for (const c of (state.allComments || [])) if (c.comment.section === 'Pending') counts[c.comment.path] = (counts[c.comment.path] || 0) + 1;
  const parts = [`<input id="filter" placeholder="filter files" value="${esc(state.tree.filter)}">`];
  const walk = (node, depth) => {
    const dirs = [...node.dirs.keys()].sort();
    for (const name of dirs) {
      const d = node.dirs.get(name);
      const collapsed = state.tree.collapsed.has(d.path) && !state.tree.filter;
      const dcnt = counts[d.path] ? `<span class="cnt">●${esc(counts[d.path])}</span>` : '';
      parts.push(`<div class="row dir" data-dir="${esc(d.path)}" style="padding-left:${8 + depth * 14}px"><span class="st"></span>${collapsed ? '▸' : '▾'} ${esc(name)}/${dcnt}<span class="add" title="comment on this directory">+</span></div>`);
      if (!collapsed) walk(d, depth + 1);
    }
    for (const f of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
      const st = state.statusLetters[f.path] || '';
      const cls = st === '?' ? 'q' : st;
      const sel = state.file && state.file.path === f.path ? ' selected' : '';
      const cnt = counts[f.path] ? `<span class="cnt">●${esc(counts[f.path])}</span>` : '';
      parts.push(`<div class="row${sel}" data-file="${esc(f.path)}" style="padding-left:${8 + depth * 14}px"><span class="st ${esc(cls)}">${esc(st)}</span><span class="name ${esc(cls)}">${esc(f.name)}</span>${cnt}</div>`);
    }
  };
  walk(buildTree(), 0);
  const tree = $('#tree');
  tree.innerHTML = parts.join('');
  $('#filter').oninput = e => { state.tree.filter = e.target.value; renderTree(); $('#filter').focus(); $('#filter').setSelectionRange(1e9, 1e9); };
  tree.querySelectorAll('[data-dir]').forEach(el => {
    el.onclick = () => {
      const p = el.dataset.dir;
      if (state.tree.collapsed.has(p)) state.tree.collapsed.delete(p); else state.tree.collapsed.add(p);
      renderTree();
    };
    el.querySelector('.add').onclick = e => { e.stopPropagation(); addPathComment(el.dataset.dir); };
  });
  tree.querySelectorAll('[data-file]').forEach(el => el.onclick = () => openFile(el.dataset.file));
}

// ----- code rendering -------------------------------------------------------------------------

function segStyle(seg) {
  let s = '';
  if (seg.fg) s += `color:rgb(${seg.fg[0]},${seg.fg[1]},${seg.fg[2]});`;
  if (seg.bold) s += 'font-weight:bold;';
  if (seg.italic) s += 'font-style:italic;';
  return s;
}

// Where the character containing byte `i` starts. A UTF-8 continuation byte is 10xxxxxx.
function charStart(bytes, i) {
  while (i > 0 && (bytes[i] & 0xc0) === 0x80) i--;
  return i;
}

// One line of code as spans. The server gives colours per segment and changes per byte
// range, and the two do not line up, so each segment is cut where a change or a search match
// begins or ends. Everything is done in bytes, because that is what the server counts in and
// what `data-off` has to carry for a click to name the right column.
function renderSegments(segs, spans, searchRanges) {
  const cuts = new Set();
  for (const s of spans || []) { cuts.add(s.start); cuts.add(s.end); }
  for (const r of searchRanges || []) { cuts.add(r[0]); cuts.add(r[1]); }
  const out = [];
  let byte = 0;
  const enc = new TextEncoder();
  for (const seg of segs) {
    const bytes = enc.encode(seg.text);
    const segStart = byte, segEnd = byte + bytes.length;
    // A cut may land inside a multi-byte character, which would decode to a replacement
    // character and misplace every byte offset after it. Move each one back to the start
    // of the character it falls in.
    const inner = [...new Set([...cuts]
      .filter(c => c > segStart && c < segEnd)
      .map(c => segStart + charStart(bytes, c - segStart))
      .filter(c => c > segStart && c < segEnd))].sort((a, b) => a - b);
    let prev = segStart;
    const pieces = [];
    for (const c of inner.concat([segEnd])) {
      // Slice by bytes, decode back to text.
      const text = new TextDecoder().decode(bytes.slice(prev - segStart, c - segStart));
      pieces.push([prev, text]);
      prev = c;
    }
    for (const [off, text] of pieces) {
      if (!text) continue;
      let cls = '';
      const inSearch = (searchRanges || []).some(r => r[0] <= off && off < r[1]);
      const span = (spans || []).find(s => s.start <= off && off < s.end);
      if (span) cls = 's-' + span.op;
      let html = `<span class="${cls}" style="${segStyle(seg)}" data-off="${off}">${esc(text)}</span>`;
      if (inSearch) html = `<mark>${html}</mark>`;
      out.push(html);
    }
    byte = segEnd;
  }
  return out.join('') || ' ';
}

function searchRangesFor(text) {
  if (!state.search) return [];
  const smart = /[A-Z]/.test(state.search);
  const hay = smart ? text : text.toLowerCase();
  const needle = smart ? state.search : state.search.toLowerCase();
  const enc = new TextEncoder();
  const out = [];
  let from = 0;
  while (needle && (from = hay.indexOf(needle, from)) >= 0) {
    const start = enc.encode(text.slice(0, from)).length;
    out.push([start, start + enc.encode(text.slice(from, from + needle.length)).length]);
    from += needle.length;
  }
  return out;
}

function commentRow(c, colspan, onChange) {
  const st = c.state;
  const done = c.comment.section !== 'Pending';
  const who = esc(c.comment.author || 'comment');
  let note = '';
  if (st === 'moved') note = `moved from line ${c.comment.line}`;
  if (st === 'stale') note = `stale, was line ${c.comment.line}`;
  const tr = document.createElement('tr');
  tr.className = 'comment';
  tr.innerHTML = `<td colspan="${colspan}"><div class="cmt ${st}${done ? ' done' : ''}">
    <span class="who">${done ? '✓' : '◆'} ${who}</span>
    <span class="text">${esc(c.comment.text)}</span>
    <span class="st">${esc(note)}${c.comment.timestamp ? ' ' + esc(c.comment.timestamp) : ''}</span>
    <span class="actions">
      <button class="small" data-act="toggle">${done ? 'reopen' : 'done'}</button>
      <button class="small" data-act="edit">edit</button>
      <button class="small" data-act="delete">delete</button>
      <button class="small" data-act="ask" title="have the agent address this comment">ask agent</button>
    </span></div></td>`;
  on(tr, 'ask', () => askAgent({ preset: 'address_comment', comment: c.comment }));
  on(tr, 'toggle', () => api('/comments/toggle', { body: { comment: c.comment } }).then(onChange).catch(fail));
  on(tr, 'delete', () => api('/comments/delete', { body: { comment: c.comment } }).then(onChange).catch(fail));
  on(tr, 'edit', async () => {
    const text = await askText('Edit comment', c.comment.text);
    if (text) api('/comments/edit', { body: { comment: c.comment, text } }).then(onChange).catch(fail);
  });
  return tr;
}

// `line` of null comments on the whole file or directory, with no line range. `onExtend`,
// when given, puts an "extend" button on the form: the next line number tapped becomes the
// other end of the range, which is what shift-click does with a keyboard. `initial` keeps
// what was typed when the form is rebuilt for the new range.
function commentForm(path, line, endLine, sourceLine, colspan, onDone, onExtend, initial = '') {
  const tr = document.createElement('tr');
  tr.className = 'form';
  const label = line ? ':' + (endLine > line ? `${line}-${endLine}` : `${line}`) : '';
  tr.innerHTML = `<td colspan="${colspan}"><div class="form"><div class="dim">comment on ${esc(path)}${label}</div>
    <textarea placeholder="${TOUCH ? 'Your comment' : 'Enter saves, Esc cancels; Shift-Enter for a new line'}"></textarea>
    <div class="row"><button class="primary" data-act="save">Add to REVIEW.md</button><button data-act="ask" title="send the text as a question about these lines instead">Ask agent</button>${onExtend ? '<button data-act="extend" title="the next line number you tap ends the range">Extend range</button>' : ''}<button data-act="cancel">Cancel</button></div></div></td>`;
  const ta = tr.querySelector('textarea');
  ta.value = initial;
  on(tr, 'extend', () => onExtend(ta.value));
  const save = () => {
    const text = ta.value.trim();
    if (!text) return;
    api('/comments', { body: { path, line: line || null, end_line: line ? endLine : null, text, source_line: line ? sourceLine : null } }).then(() => onDone(true)).catch(fail);
  };
  on(tr, 'save', save);
  on(tr, 'ask', () => {
    const question = ta.value.trim() || 'Explain this.';
    onDone(false);
    askAgent({ preset: 'about_code', path, line: line || null, end_line: line ? endLine : null, text: question, context: line ? [{ uri: 'file://' + path, text: sourceLine }] : [] });
  });
  on(tr, 'cancel', () => onDone(false));
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') { e.preventDefault(); onDone(false); }
  };
  setTimeout(() => ta.focus(), 0);
  return tr;
}

// ----- explore --------------------------------------------------------------------------------

// The first line of the comment being written, and whether the next tap on a line number
// extends the range to that line rather than starting over.
let commentAnchorLine = null, extending = false;

async function openFile(path, line) {
  try {
    const f = await api('/file?path=' + encodeURIComponent(path));
    state.file = { ...f, blame: null };
    state.view = 'explore';
    navigate(routes.file(path, line));
    // On a phone the file replaces the tree.
    document.body.classList.add('showfile');
    renderFile();
    renderTree();
    if (line) scrollToLine(line);
  } catch (e) { fail(e); }
}

function fileHint() {
  hint('Click a line number to comment; shift-click extends the range.', 'Tap a line number to comment, or a name in the code for its definition.');
}

// Back to the tree, on a phone; on a wide screen the tree never left.
function showTree() {
  setTabs('explore');
  document.body.classList.remove('showfile');
  navigate(routes.tree());
}

async function refreshFileComments() {
  if (!state.file) return;
  const f = await api('/file?path=' + encodeURIComponent(state.file.path));
  state.file.comments = f.comments;
  state.file.notes = f.notes;
  state.allComments = await api('/comments');
  await loadState();
  renderFile();
}

function scrollToLine(line) {
  const row = $(`#content tr[data-line="${line}"]`);
  if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('cur'); setTimeout(() => row.classList.remove('cur'), 1500); }
}

function renderFile() {
  const f = state.file;
  const content = $('#content');
  content.innerHTML = '';
  if (!f) { content.innerHTML = '<div class="center">Pick a file from the tree.</div>'; return; }
  setTabs('explore');
  const st = state.statusLetters[f.path] || '';
  const head = document.createElement('div');
  head.className = 'panelhead';
  head.innerHTML = `<button class="phone" data-act="up" title="back to the file tree">‹ files</button><span class="path">${esc(f.path)}</span>
    ${st ? `<span class="badge ${esc(st === '?' ? 'q' : st)}">${esc(st === '?' ? 'untracked' : st)}</span>` : ''}
    <span class="dim">${f.lines.length} lines</span>
    <span class="spacer"></span>
    <button data-act="symbols" title="definitions in this file (@)">Symbols</button>
    <button data-act="comment" title="comment on the file as a whole">Comment</button>
    <button data-act="note">Note</button>
    <button data-act="history" ${state.hasCommits ? '' : 'disabled'}>History</button>
    <button data-act="diff" ${st && st !== '?' ? '' : 'disabled'}>Diff vs HEAD</button>
    <button data-act="blame" ${state.hasCommits && st !== '?' ? '' : 'disabled'}>${f.blame ? 'Hide blame' : 'Blame'}</button>`;
  content.appendChild(head);
  on(head, 'up', showTree);
  on(head, 'note', () => addNote(f.path));
  on(head, 'comment', () => addPathComment(f.path));
  on(head, 'symbols', () => showFileSymbols(f.path));
  on(head, 'history', () => showLog(f.path));
  on(head, 'diff', () => showDiff({ kind: 'working', path: f.path, status: st }, [{ path: f.path, status: st, old_path: null }], 0));
  on(head, 'blame', async () => {
    if (f.blame) { f.blame = null; renderFile(); return; }
    try { f.blame = await api('/blame?path=' + encodeURIComponent(f.path)); renderFile(); } catch (e) { fail(e); }
  });

  if (f.notes && f.notes.length) {
    const n = document.createElement('div');
    n.className = 'details';
    n.innerHTML = f.notes.map(x => '• ' + esc(x.text)).join('\n');
    content.appendChild(n);
  }
  if (f.binary) { content.insertAdjacentHTML('beforeend', '<div class="center">binary file</div>'); return; }

  const table = document.createElement('table');
  table.className = 'code';
  const lines = f.text.split('\n');
  // Splitting text that ends in a newline leaves an empty last piece that is not a line of
  // the file. The server counted the real lines, so trust that count over the split.
  if (lines.length && lines[lines.length - 1] === '' && f.lines.length < lines.length) lines.pop();
  const cols = 3 + (f.blame ? 1 : 0);
  const byLine = {};
  for (const c of f.comments) if (c.line) (byLine[c.end_line] = byLine[c.end_line] || []).push(c);
  const onChange = () => refreshFileComments().catch(fail);
  // Opens the comment form under line `n`, or under the far end of the range when the
  // click extends one (shift held, or the form's own extend button pressed first).
  const beginComment = (n, extend, text = '') => {
    const open = $('#content .form textarea');
    if (open) { text = text || open.value; open.closest('tr').remove(); }
    extending = false;
    fileHint();
    let start = n, end = n;
    if (extend && commentAnchorLine) { start = Math.min(commentAnchorLine, n); end = Math.max(commentAnchorLine, n); }
    else commentAnchorLine = n;
    table.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
    for (let k = start; k <= end; k++) table.querySelector(`tr[data-line="${k}"]`)?.classList.add('sel');
    const anchorRow = table.querySelector(`tr[data-line="${end}"]`);
    const form = commentForm(f.path, start, end, lines[start - 1] || '', cols, saved => {
      form.remove();
      table.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
      commentAnchorLine = null;
      if (saved) onChange();
    }, () => { extending = true; hint('Now click the last line of the range.', 'Now tap the last line of the range.'); }, text);
    anchorRow.after(form);
  };
  // Comments on the file as a whole have no line; they head the file.
  for (const c of f.comments) if (!c.line) table.appendChild(commentRow(c, cols, onChange));
  let firstMatch = null;
  f.lines.forEach((segs, i) => {
    const n = i + 1;
    const op = f.line_ops ? f.line_ops[i] : 'none';
    const tr = document.createElement('tr');
    tr.dataset.line = n;
    tr.className = 'op-' + op;
    const marker = f.comments.find(c => c.line && c.line <= n && n <= c.end_line);
    const mk = marker ? `<span style="color:var(--${marker.state})">●</span>` : (op !== 'none' ? {insert:'+',delete:'-',update:'~',move:'>'}[op] : '');
    const ranges = searchRangesFor(lines[i] || '');
    if (ranges.length && firstMatch === null) firstMatch = n;
    let blame = '';
    if (f.blame) {
      const b = f.blame[i];
      blame = `<td class="b" title="${b ? esc(b.summary) : ''}">${b ? esc(b.hash.slice(0, 7) + ' ' + b.author.slice(0, 12).padEnd(12) + ' ' + b.date) : ''}</td>`;
    }
    tr.innerHTML = `<td class="m">${mk}</td>${blame}<td class="n" title="click to comment, shift-click to extend">${n}</td><td class="c">${renderSegments(segs, [], ranges)}</td>`;
    tr.querySelector('td.c').onclick = e => codeClick(e, f.path, i, lines[i] || '');
    tr.querySelector('td.n').onclick = e => beginComment(n, e.shiftKey || extending);
    table.appendChild(tr);
    for (const c of byLine[n] || []) table.appendChild(commentRow(c, cols, onChange));
  });
  // Comments past the end of the file.
  for (const c of f.comments) if (c.line && c.end_line > f.lines.length) table.appendChild(commentRow(c, cols, onChange));
  content.appendChild(table);
  fileHint();
  if (state.search && firstMatch) scrollToLine(firstMatch);
}

// ----- symbols --------------------------------------------------------------------------------

// The byte column of a click inside a code cell: the clicked span's byte offset plus the
// UTF-8 length of the text before the caret within it.
function byteColumnOfClick(e) {
  let span = e.target.closest('span[data-off]');
  if (!span) return null;
  const base = +span.dataset.off;
  let within = 0;
  const pos = document.caretPositionFromPoint ? document.caretPositionFromPoint(e.clientX, e.clientY)
    : (document.caretRangeFromPoint ? (r => r && { offsetNode: r.startContainer, offset: r.startOffset })(document.caretRangeFromPoint(e.clientX, e.clientY)) : null);
  if (pos && span.contains(pos.offsetNode)) {
    const text = pos.offsetNode.textContent || '';
    within = new TextEncoder().encode(text.slice(0, pos.offset)).length;
  }
  return base + within;
}

async function codeClick(e, path, row, lineText) {
  const col = byteColumnOfClick(e);
  hidePopover();
  if (col === null) return;
  try {
    const r = await api(`/identifier?path=${encodeURIComponent(path)}&line=${row}&col=${col}`);
    if (!r.name) return;
    showPopover(e.clientX, e.clientY, r.name);
  } catch (err) { fail(err); }
}

function showPopover(x, y, name) {
  const p = $('#popover');
  p.innerHTML = `<span class="word">${esc(name)}</span><button class="small" data-act="def">Definition</button><button class="small" data-act="refs">Usages</button>`;
  p.hidden = false;
  // Keep it on screen: 260 is about as wide as the popover gets with a long name in it.
  p.style.left = Math.min(x + 4, window.innerWidth - 260) + 'px';
  p.style.top = (y + 8) + 'px';
  on(p, 'def', () => { hidePopover(); gotoDefinition(name); });
  on(p, 'refs', () => { hidePopover(); showReferences(name); });
}
function hidePopover() { $('#popover').hidden = true; }
document.addEventListener('click', e => { if (!e.target.closest('#popover') && !e.target.closest('table.code td.c')) hidePopover(); });

async function gotoDefinition(name) {
  try {
    const defs = await api('/definitions?name=' + encodeURIComponent(name));
    if (!defs.length) { msg('no definition of ' + name + ' in the repository'); return; }
    if (defs.length === 1) { await openFile(defs[0].path, defs[0].line); return; }
    showDrawer(defs.length + ' definitions of ' + name, defs.map(symbolHit));
  } catch (err) { fail(err); }
}

async function showReferences(name) {
  try {
    const refs = await api('/references?name=' + encodeURIComponent(name));
    if (!refs.length) { msg('no occurrence of ' + name); return; }
    showDrawer(refs.length + ' occurrences of ' + name, refs.map(r => ({ path: r.path, line: r.line, label: '', text: r.text })));
  } catch (err) { fail(err); }
}

async function showFileSymbols(path) {
  try {
    const syms = await api('/symbols?path=' + encodeURIComponent(path));
    if (!syms.length) { msg('no symbols found in ' + path); return; }
    showDrawer('symbols in ' + path, syms.map(symbolHit));
  } catch (err) { fail(err); }
}

async function searchSymbols(q) {
  if (!q.trim()) return;
  try {
    const syms = await api('/symbol_search?q=' + encodeURIComponent(q.trim()));
    if (!syms.length) { msg('no symbol matches ' + q); return; }
    showDrawer(syms.length + ' symbols matching ' + q, syms.map(symbolHit));
  } catch (err) { fail(err); }
}

function symbolHit(s) {
  return { path: s.path, line: s.line, label: s.kind + ' ' + s.name + (s.container ? ' in ' + s.container : ''), text: s.text };
}

function showDrawer(title, hits) {
  const d = $('#drawer');
  d.hidden = false;
  d.innerHTML = `<div class="panelhead"><span class="path">${esc(title)}</span><span class="spacer"></span><button class="small" data-act="close">✕</button></div><div class="list"></div>`;
  on(d, 'close', () => { d.hidden = true; });
  const list = d.querySelector('.list');
  for (const h of hits) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="loc">${esc(h.path)}:${h.line}</span>${h.label ? `<span class="label">${esc(h.label)}</span>` : ''}<span class="text">${esc(h.text)}</span>`;
    el.onclick = () => openFile(h.path, h.line);
    list.appendChild(el);
  }
}

$('#symbol').onkeydown = e => { if (e.key === 'Enter') { searchSymbols(e.target.value); e.target.blur(); } if (e.key === 'Escape') e.target.blur(); };

// ----- agent ----------------------------------------------------------------------------------

const agent = { version: 0, entries: [], status: 'not started', running: false, name: '', permission: null, timer: null,
  showThoughts: false, showLog: true, pollFailures: 0, progress: '', usage: '', startedAt: null };

async function agentPoll() {
  try {
    const r = await api('/agent/events?since=' + agent.version);
    agent.running = r.running; agent.status = r.status; agent.name = r.name; agent.permission = r.permission; agent.command = r.command;
    agent.progress = r.progress || ''; agent.usage = r.usage || '';
    // The server writes the transcript; this only puts each line where it says. Entries are
    // not append-only, because a tool call is filled in as it runs.
    for (const [index, entry] of r.entries) agent.entries[index] = entry;
    if (agent.entries.length > r.count) agent.entries.length = r.count;
    agent.version = r.version;
    if (r.entries.length || state.view === 'agent') renderAgent();
    else renderAgentHead();
    $('#agentdot').hidden = !(agent.permission || agent.status === 'working');
    $('#agentdot').textContent = agent.permission ? '?' : '…';
    if (agent.pollFailures) { agent.pollFailures = 0; renderAgentHead(); }
  } catch (err) {
    // A poll that keeps failing means the server is gone or the session has ended, and
    // saying nothing leaves a panel that looks merely quiet.
    console.error(err);
    agent.pollFailures = (agent.pollFailures || 0) + 1;
    if (agent.pollFailures === 3) {
      agent.entries.push({ kind: 'system', text: 'lost contact with the server: ' + err.message });
      renderAgent();
    }
    if (agent.pollFailures >= 3) renderAgentHead();
  }
}

function startAgentPolling() {
  if (agent.timer || !state.agentEnabled) return;
  // A page in a background tab, or a phone in a pocket, does not poll; it catches up when
  // it is looked at again.
  agent.timer = setInterval(() => { if (state.agentEnabled && !document.hidden && (state.view === 'agent' || agent.running)) agentPoll(); }, 500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state.agentEnabled && (state.view === 'agent' || agent.running)) agentPoll(); });
}

async function agentStart() {
  agent.entries.push({ kind: 'system', text: 'starting ' + (agent.command || 'the agent') + ' …' });
  agent.startedAt = Date.now();
  renderAgent();
  try {
    const r = await api('/agent/start', { post: true });
    agent.running = r.running; agent.status = r.status; agent.name = r.name;
    agent.entries.push({ kind: 'system', text: 'connected to ' + r.name + ' after ' + ((Date.now() - agent.startedAt) / 1000).toFixed(1) + 's' });
  } catch (err) { agent.entries.push({ kind: 'system', text: 'could not start the agent: ' + err.message }); }
  agent.startedAt = null;
  renderAgent();
}

// The header line: status, what the backend is doing, elapsed time, tokens and cost.
function renderAgentHead() {
  const root = $('#agent');
  if (!root) return;
  $('#agentname').textContent = agent.running ? agent.name : (agent.command || '');
  $('#agentstatus').textContent = agent.status;
  let progress = agent.progress;
  if (agent.pollFailures >= 3) progress = 'not answering (' + agent.pollFailures + ' tries)';
  else if (agent.startedAt && !progress) progress = 'starting · ' + Math.round((Date.now() - agent.startedAt) / 1000) + 's';
  $('#agentprogress').textContent = progress;
  $('#agentusage').textContent = agent.usage;
}

async function agentSend(body) {
  try {
    if (!agent.running) await agentStart();
    if (!agent.running) return;
    await api('/agent/prompt', { body });
    agent.status = 'working';
    await agentPoll();
  } catch (err) { fail(err); }
}

function askAgent(body) {
  if (!state.agentEnabled) { msg('this server runs without an agent', true); return; }
  showAgent();
  agentSend(body);
}

function showAgent() {
  if (!state.agentEnabled) { msg('this server runs without an agent', true); return; }
  setTabs('agent');
  navigate(routes.view('agent'));
  startAgentPolling();
  const content = $('#content');
  content.innerHTML = `<div id="agent"><div class="panelhead"><span class="path">agent</span><span id="agentname" class="dim"></span><span id="agentstatus" class="badge"></span><span id="agentprogress" class="progress"></span><span id="agentusage" class="usage"></span><span class="spacer"></span>
      <label class="dim"><input type="checkbox" id="thoughts"> thoughts</label>
      <label class="dim"><input type="checkbox" id="showlog"> log</label>
      <button data-act="all" title="work through every pending comment in REVIEW.md">Address all pending</button>
      <button data-act="cancel">Cancel turn</button><button data-act="restart">Restart</button><button data-act="clear">Clear</button></div>
    <div class="transcript"></div><div class="permission" hidden></div>
    <div class="compose"><textarea id="ask" placeholder="Ask the agent (Enter sends, Shift-Enter for a new line)"></textarea>
    <div class="row" style="margin-top:6px"><button class="primary" data-act="send">Send</button><span class="dim">Comments and lines have their own “ask” buttons; the agent runs in the repository root.</span></div></div></div>`;
  $('#agent [data-act=send]').onclick = () => { const ta = $('#ask'); const t = ta.value.trim(); if (!t) return; ta.value = ''; agentSend({ text: t }); };
  $('#ask').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#agent [data-act=send]').click(); } };
  $('#agent [data-act=all]').onclick = () => agentSend({ preset: 'address_all' });
  $('#agent [data-act=cancel]').onclick = () => api('/agent/cancel', { post: true }).catch(fail);
  $('#agent [data-act=restart]').onclick = async () => { await api('/agent/stop', { post: true }).catch(fail); agent.running = false; agentStart(); };
  $('#agent [data-act=clear]').onclick = () => api('/agent/clear', { post: true })
    .then(() => { agent.entries = []; agent.version = 0; renderAgent(); agentPoll(); })
    .catch(fail);
  $('#thoughts').checked = agent.showThoughts;
  $('#thoughts').onchange = e => { agent.showThoughts = e.target.checked; renderAgent(); };
  $('#showlog').checked = agent.showLog;
  $('#showlog').onchange = e => { agent.showLog = e.target.checked; renderAgent(); };
  renderAgent();
  agentPoll();
  hint('Enter sends. The agent asks before doing anything that needs permission.', 'The agent asks before doing anything that needs permission.');
}

function renderAgent() {
  const root = $('#agent');
  if (!root) return;
  renderAgentHead();
  const t = root.querySelector('.transcript');
  // Within a line or so of the end counts as being at the end: a reader who has scrolled
  // up to read something should not be yanked back down by the next line of output.
  const atBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 20;
  t.innerHTML = agent.entries.filter(e => (e.kind !== 'thought' || agent.showThoughts) && (e.kind !== 'log' || agent.showLog)).map(e => {
    const who = { user: 'you', agent: agent.name || 'agent', thought: 'thinking', tool: 'tool', system: '', log: 'log' }[e.kind];
    return `<div class="entry ${e.kind}"><span class="who">${esc(who)}</span><span class="body">${esc(e.text)}</span></div>`;
  }).join('') || '<div class="center">Nothing yet. Ask something below, or use “Address all pending”.</div>';
  if (atBottom) t.scrollTop = t.scrollHeight;
  const p = root.querySelector('.permission');
  if (agent.permission) {
    p.hidden = false;
    const details = agent.permission.details && agent.permission.details.trim() !== agent.permission.title.trim()
      ? `<pre class="perm">${esc(agent.permission.details)}</pre>` : '';
    p.innerHTML = `<div class="grow"><b>agent asks:</b> ${esc(agent.permission.title)}${details}</div>` + agent.permission.options.map(o => `<button class="small" data-opt="${esc(o.option_id)}">${esc(o.name)}</button>`).join('') + `<button class="small" data-opt="">Cancel</button>`;
    const asked = agent.permission.request_id;
    p.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => api('/agent/permission', { body: { option_id: b.dataset.opt || null, request_id: asked } }).then(agentPoll).catch(fail));
  } else {
    p.hidden = true;
  }
}

async function showChanges(staged = false) {
