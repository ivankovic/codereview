// ----- tree -----------------------------------------------------------------------------------

// How many files a directory shows before the rest fold behind "… N more".
const TREE_FOLD = 10;

function buildTree() {
  const root = { dirs: new Map(), files: [] };
  for (const f of state.files) {
    if (state.tree.filter && !f.toLowerCase().includes(state.tree.filter.toLowerCase())) continue;
    const parts = f.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node.dirs.has(parts[i])) node.dirs.set(parts[i], { dirs: new Map(), files: [], path: parts.slice(0, i + 1).join('/') });
      node = node.dirs.get(parts[i]);
    }
    node.files.push({ name: parts[parts.length - 1], path: f });
  }
  return root;
}

function renderTree() {
  const counts = Object.create(null);
  for (const c of (state.allComments || [])) if (c.comment.section === 'Pending') counts[c.comment.path] = (counts[c.comment.path] || 0) + 1;
  const parts = [`<input id="filter" placeholder="filter files" value="${esc(state.tree.filter)}">`];
  const walk = (node, depth) => {
    const dirs = [...node.dirs.keys()].sort();
    for (const name of dirs) {
      const d = node.dirs.get(name);
      const collapsed = state.tree.collapsed.has(d.path) && !state.tree.filter;
      const dcnt = counts[d.path] ? `<span class="cnt">●${esc(counts[d.path])}</span>` : '';
      parts.push(`<div class="row dir" data-dir="${esc(d.path)}" style="padding-left:${8 + depth * 14}px"><span class="st"></span>${collapsed ? '▸' : '▾'} ${esc(name)}/${dcnt}<span class="add" title="comment on this directory">+</span></div>`);
      if (!collapsed) walk(d, depth + 1);
    }
    // A directory of hundreds of files is a wall, and the next directory is somewhere below
    // it. Past the tenth, files are folded behind a "… N more" row, except those the tree
    // has something to say about: changed, commented on, or the one open. A filter is a
    // request to see everything it matches, so nothing folds while one is typed.
    const files = node.files.sort((a, b) => a.name.localeCompare(b.name));
    const dirPath = node.path || '';
    const speaks = f => !!state.statusLetters[f.path] || !!counts[f.path] || (state.file && state.file.path === f.path);
    const foldable = !state.tree.filter && files.length > TREE_FOLD + 1;
    const shown = foldable && state.tree.shown.has(dirPath);
    let hidden = 0;
    files.forEach((f, i) => {
      if (foldable && !shown && i >= TREE_FOLD && !speaks(f)) { hidden++; return; }
      const st = state.statusLetters[f.path] || '';
      const cls = st === '?' ? 'q' : st;
      const sel = state.file && state.file.path === f.path ? ' selected' : '';
      const cnt = counts[f.path] ? `<span class="cnt">●${esc(counts[f.path])}</span>` : '';
      parts.push(`<div class="row${sel}" data-file="${esc(f.path)}" style="padding-left:${8 + depth * 14}px"><span class="st ${esc(cls)}">${esc(st)}</span><span class="name ${esc(cls)}">${esc(f.name)}</span>${cnt}</div>`);
    });
    if (hidden) parts.push(`<div class="row more" data-more="${esc(dirPath)}" style="padding-left:${8 + depth * 14}px"><span class="st"></span>… ${hidden} more</div>`);
    else if (shown) parts.push(`<div class="row more" data-fewer="${esc(dirPath)}" style="padding-left:${8 + depth * 14}px"><span class="st"></span>… fewer</div>`);
  };
  walk(buildTree(), 0);
  const tree = $('#tree');
  tree.innerHTML = parts.join('');
  $('#filter').oninput = e => { state.tree.filter = e.target.value; renderTree(); $('#filter').focus(); $('#filter').setSelectionRange(1e9, 1e9); };
  tree.querySelectorAll('[data-dir]').forEach(el => {
    el.onclick = () => {
      const p = el.dataset.dir;
      if (state.tree.collapsed.has(p)) state.tree.collapsed.delete(p); else state.tree.collapsed.add(p);
      renderTree();
    };
    el.querySelector('.add').onclick = e => { e.stopPropagation(); addPathComment(el.dataset.dir); };
  });
  tree.querySelectorAll('[data-file]').forEach(el => el.onclick = () => openFile(el.dataset.file));
  tree.querySelectorAll('[data-more]').forEach(el => el.onclick = () => { state.tree.shown.add(el.dataset.more); renderTree(); });
  tree.querySelectorAll('[data-fewer]').forEach(el => el.onclick = () => { state.tree.shown.delete(el.dataset.fewer); renderTree(); });
}

// ----- code rendering -------------------------------------------------------------------------

// Highlighted lines arrive packed: a table of styles once, and per line [style, text] pairs
// with runs of one style already joined. Back into one object per segment here, on arrival,
// so that everything that draws a line reads as it always did.
function inflate(lines, styles) {
  return (lines || []).map(line => line.map(([s, text]) => ({ ...styles[s], text })));
}
function inflateDiff(d) {
  d.before_lines = inflate(d.before_lines, d.styles);
  d.after_lines = inflate(d.after_lines, d.styles);
  return d;
}

function segStyle(seg) {
  let s = '';
  if (seg.fg) s += `color:rgb(${seg.fg[0]},${seg.fg[1]},${seg.fg[2]});`;
  if (seg.bold) s += 'font-weight:bold;';
  if (seg.italic) s += 'font-style:italic;';
  return s;
}

// Where the character containing byte `i` starts. A UTF-8 continuation byte is 10xxxxxx.
function charStart(bytes, i) {
  while (i > 0 && (bytes[i] & 0xc0) === 0x80) i--;
  return i;
}

// One line of code as spans. The server gives colours per segment and changes per byte
// range, and the two do not line up, so each segment is cut where a change or a search match
// begins or ends. Everything is done in bytes, because that is what the server counts in and
// what `data-off` has to carry for a click to name the right column.
function renderSegments(segs, spans, searchRanges) {
  const cuts = new Set();
  for (const s of spans || []) { cuts.add(s.start); cuts.add(s.end); }
  for (const r of searchRanges || []) { cuts.add(r[0]); cuts.add(r[1]); }
  const out = [];
  let byte = 0;
  const enc = new TextEncoder();
  for (const seg of segs) {
    const bytes = enc.encode(seg.text);
    const segStart = byte, segEnd = byte + bytes.length;
    // A cut may land inside a multi-byte character, which would decode to a replacement
    // character and misplace every byte offset after it. Move each one back to the start
    // of the character it falls in.
    const inner = [...new Set([...cuts]
      .filter(c => c > segStart && c < segEnd)
      .map(c => segStart + charStart(bytes, c - segStart))
      .filter(c => c > segStart && c < segEnd))].sort((a, b) => a - b);
    let prev = segStart;
    const pieces = [];
    for (const c of inner.concat([segEnd])) {
      // Slice by bytes, decode back to text.
      const text = new TextDecoder().decode(bytes.slice(prev - segStart, c - segStart));
      pieces.push([prev, text]);
      prev = c;
    }
    for (const [off, text] of pieces) {
      if (!text) continue;
      let cls = '';
      const inSearch = (searchRanges || []).some(r => r[0] <= off && off < r[1]);
      const span = (spans || []).find(s => s.start <= off && off < s.end);
      if (span) cls = 's-' + span.op;
      let html = `<span class="${cls}" style="${segStyle(seg)}" data-off="${off}">${esc(text)}</span>`;
      if (inSearch) html = `<mark>${html}</mark>`;
      out.push(html);
    }
    byte = segEnd;
  }
  return out.join('') || ' ';
}

function searchRangesFor(text) {
  if (!state.search) return [];
  const smart = /[A-Z]/.test(state.search);
  const hay = smart ? text : text.toLowerCase();
  const needle = smart ? state.search : state.search.toLowerCase();
  const enc = new TextEncoder();
  const out = [];
  let from = 0;
  while (needle && (from = hay.indexOf(needle, from)) >= 0) {
    const start = enc.encode(text.slice(0, from)).length;
    out.push([start, start + enc.encode(text.slice(from, from + needle.length)).length]);
    from += needle.length;
  }
  return out;
}

function commentRow(c, colspan, onChange) {
  const st = c.state;
  const done = c.comment.section !== 'Pending';
  const who = esc(c.comment.author || 'comment');
  let note = '';
  // A comment that names a commit counts its line there, and was followed from it.
  const at = c.comment.commit ? ` in ${c.comment.commit}` : '';
  if (st === 'moved') note = `moved from line ${c.comment.line}${at}`;
  if (st === 'stale') note = `stale, was line ${c.comment.line}${at}`;
  const tr = document.createElement('tr');
  tr.className = 'comment';
  tr.innerHTML = `<td colspan="${colspan}"><div class="cmt ${st}${done ? ' done' : ''}">
    <span class="who">${done ? '✓' : '◆'} ${who}</span>
    <span class="text">${esc(c.comment.text)}</span>
    <span class="st">${esc(note)}${c.comment.timestamp ? ' ' + esc(c.comment.timestamp) : ''}</span>
    <span class="actions">
      <button class="small" data-act="toggle">${done ? 'reopen' : 'done'}</button>
      <button class="small" data-act="edit">edit</button>
      <button class="small" data-act="delete">delete</button>
      <button class="small" data-act="ask" title="have the agent address this comment">ask agent</button>
    </span></div></td>`;
  on(tr, 'ask', () => askAgent({ preset: 'address_comment', comment: c.comment }));
  on(tr, 'toggle', () => api('/comments/toggle', { body: { comment: c.comment } }).then(onChange).catch(fail));
  on(tr, 'delete', () => api('/comments/delete', { body: { comment: c.comment } }).then(onChange).catch(fail));
  on(tr, 'edit', async () => {
    const text = await askText('Edit comment', c.comment.text);
    if (text) api('/comments/edit', { body: { comment: c.comment, text } }).then(onChange).catch(fail);
  });
  return tr;
}

// `line` of null comments on the whole file or directory, with no line range. `onExtend`,
// when given, puts an "extend" button on the form: the next line number tapped becomes the
// other end of the range, which is what shift-click does with a keyboard. `initial` keeps
// what was typed when the form is rebuilt for the new range.
// The commit a diff's after side is, when it is one: a line number read off it counts there.
// The working tree and the index are not commits.
function afterRevision(p) {
  if (p.kind === 'commit') return p.hash || null;
  if (p.kind === 'revisions') return p.to || null;
  return null;
}

// `at` is the commit the line numbers count in, when they were read off a commit's diff.
function commentForm(path, line, endLine, sourceLine, colspan, onDone, onExtend, initial = '', at = null) {
  const tr = document.createElement('tr');
  tr.className = 'form';
  const label = line ? ':' + (endLine > line ? `${line}-${endLine}` : `${line}`) : '';
  tr.innerHTML = `<td colspan="${colspan}"><div class="form"><div class="dim where">comment on ${esc(path)}${label}</div>
    <textarea placeholder="${TOUCH ? 'Your comment' : 'Enter saves, Esc cancels; Shift-Enter for a new line'}"></textarea>
    <div class="row"><button class="primary" data-act="save">Add to REVIEW.md</button><button data-act="ask" title="send the text as a question about these lines instead">Ask agent</button>${onExtend ? '<button data-act="extend" title="the next line number you tap ends the range">Extend range</button>' : ''}<button data-act="cancel">Cancel</button></div></div></td>`;
  const ta = tr.querySelector('textarea');
  ta.value = initial;
  // On a phone the form covers the code, so it steps aside until the second line is tapped.
  on(tr, 'extend', () => { tr.classList.add('picking'); onExtend(ta.value); });
  const save = () => {
    const text = ta.value.trim();
    if (!text) return;
    api('/comments', { body: { path, line: line || null, end_line: line ? endLine : null, text, source_line: line ? sourceLine : null, at: line ? at : null } }).then(() => onDone(true)).catch(fail);
  };
  on(tr, 'save', save);
  on(tr, 'ask', () => {
    const question = ta.value.trim() || 'Explain this.';
    onDone(false);
    askAgent({ preset: 'about_code', path, line: line || null, end_line: line ? endLine : null, text: question, context: line ? [{ uri: 'file://' + path, text: sourceLine }] : [] });
  });
  on(tr, 'cancel', () => onDone(false));
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') { e.preventDefault(); onDone(false); }
  };
  setTimeout(() => ta.focus(), 0);
  return tr;
}

// ----- explore --------------------------------------------------------------------------------

// The first line of the comment being written, and whether the next tap on a line number
// extends the range to that line rather than starting over.
let commentAnchorLine = null, extending = false;

async function openFile(path, line) {
  try {
    // A big file is a moment to fetch and draw; a tap that shows nothing meanwhile reads as
    // a tap that did nothing. A refresh of the file already open keeps it on screen.
    if (!state.file || state.file.path !== path) $('#content').innerHTML = '<div class="center">reading the file…</div>';
    // The lines a test ran are marked in the file it was opened on from that test, and only
    // there: another file is another question.
    if (state.ran && state.ran.path !== path) state.ran = null;
    const f = await api('/file?path=' + encodeURIComponent(path));
    f.lines = inflate(f.lines, f.styles);
    // The fingerprint stamps the open file, so another file is another baseline.
    watch.version = null;
    state.file = { ...f, blame: null };
    state.view = 'explore';
    navigate(routes.file(path, line));
    // On a phone the file replaces the tree.
    document.body.classList.add('showfile');
    renderFile.upToLine = line || 0;
    renderFile();
    renderTree();
    if (line) scrollToLine(line);
  } catch (e) { fail(e); }
}

function fileHint() {
  hint('Click a line number to comment; shift-click extends the range.', 'Tap a line number to comment, or a name in the code for its definition.');
}

// Long lines, wrapped where the screen ends instead of running off it, with the continuation
// indented so a wrapped line still reads as one. Where you are looking from is the browser's
// business, so the choice is kept in its own storage and never reaches the server.
function setWrap(on) {
  state.wrap = on;
  document.body.classList.toggle('wrap', on);
  try { localStorage.setItem('wrap', on ? '1' : ''); } catch (e) { /* private window */ }
  if (state.view === 'explore' && state.file) renderFile();
  else if (state.view === 'diff' && state.diff && state.diff.data) renderDiff();
}

// Zen: the file, its line numbers and its comments, with the header, the tabs, the tree, the
// file's own toolbar and the footer out of the way. It is a way of reading rather than a view,
// so it has no address of its own, and anything that leaves the file leaves it as well.
// On a phone the explorer shows the tree or the file, and zen over the tree would leave an
// empty screen, so the key only works where the Zen button itself would be.
const fileOnScreen = () => state.view === 'explore' && !!state.file
  && (!phone() || document.body.classList.contains('showfile'));

function setZen(on) {
  state.zen = on;
  document.body.classList.toggle('zen', on);
  $('#zen').hidden = !on;
}

// Back to the tree, on a phone; on a wide screen the tree never left.
function showTree() {
  setZen(false);
  setTabs('explore');
  document.body.classList.remove('showfile');
  // With nothing open, whatever view was up would sit beside the tree under the wrong tab.
  if (!state.file) $('#content').innerHTML = '<div class="center">Pick a file from the tree.</div>';
  navigate(routes.tree());
}

async function refreshFileComments() {
  if (!state.file) return;
  const f = await api('/file?path=' + encodeURIComponent(state.file.path));
  state.file.comments = f.comments;
  state.file.notes = f.notes;
  state.allComments = await api('/comments');
  await loadState();
  renderFile();
}

function scrollToLine(line) {
  const row = $(`#content tr[data-line="${line}"]`);
  if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('cur'); setTimeout(() => row.classList.remove('cur'), 1500); }
}

function renderFile() {
  const f = state.file;
  const content = $('#content');
  content.innerHTML = '';
  if (!f) { content.innerHTML = '<div class="center">Pick a file from the tree.</div>'; return; }
  setTabs('explore');
  const st = state.statusLetters[f.path] || '';
  const head = document.createElement('div');
  head.className = 'panelhead file';
  head.innerHTML = `<button class="phone" data-act="up" title="back to the file tree">‹ files</button><span class="path">${esc(f.path)}</span>
    ${st ? `<span class="badge ${esc(st === '?' ? 'q' : st)}">${esc(st === '?' ? 'untracked' : st)}</span>` : ''}
    <span class="dim lines">${f.total_lines > f.lines.length ? 'first ' + f.lines.length + ' of ' + f.total_lines : f.lines.length} lines</span>
    <span class="spacer"></span>
    <button class="wide" data-act="tests" title="the tests that name something this file defines">Tests</button>
    <button data-act="comment" title="comment on the file as a whole">Comment</button>
    <button class="phone" data-act="menu" title="everything else this file can do">⋯</button>
    <span class="acts">
      <button class="phone" data-act="tests" title="the tests that name something this file defines">Tests</button>
      <button data-act="symbols" title="definitions in this file (@)">Symbols</button>
      <button data-act="note">Note</button>
      <button data-act="history" ${state.hasCommits ? '' : 'disabled'}>History</button>
      <button data-act="diff" ${st && st !== '?' ? '' : 'disabled'}>Diff vs HEAD</button>
      <button data-act="blame" ${state.hasCommits && st !== '?' ? '' : 'disabled'}>${f.blame ? 'Hide blame' : 'Blame'}</button>
      <button data-act="wrap" title="${TOUCH ? 'wrap long lines instead of scrolling sideways' : 'wrap long lines instead of scrolling sideways (w)'}">${state.wrap ? 'No wrap' : 'Wrap lines'}</button>
      <button data-act="zen" title="${TOUCH ? 'the file and nothing else' : 'the file and nothing else (z)'}">Zen</button>
    </span>`;
  content.appendChild(head);
  if (state.ran && state.ran.path === f.path) {
    const ran = state.ran;
    const banner = document.createElement('div');
    banner.className = 'ranbanner';
    const lines = ran.ranges.reduce((n, [a, b]) => n + b - a + 1, 0);
    banner.innerHTML = `<span class="grow">The ${lines} lines marked are what <a data-act="test">${esc(ran.label)}</a> ran.</span><button data-act="unran" title="stop marking them">✕</button>`;
    on(banner, 'test', () => showTestView(ran.file, ran.name));
    on(banner, 'unran', () => { state.ran = null; renderFile(); });
    content.appendChild(banner);
  }
  on(head, 'up', showTree);
  head.querySelectorAll('[data-act=tests]').forEach(b => b.onclick = () => showTestsOf(f.path));
  on(head, 'note', () => addNote(f.path));
  on(head, 'comment', () => addPathComment(f.path));
  on(head, 'symbols', () => showFileSymbols(f.path));
  on(head, 'history', () => showLog(f.path));
  on(head, 'diff', () => showDiff({ kind: 'working', path: f.path, status: st }, [{ path: f.path, status: st, old_path: null }], 0));
  on(head, 'zen', () => setZen(true));
  on(head, 'wrap', () => setWrap(!state.wrap));
  // The menu stays open for one choice only; every button in it closes it by acting.
  on(head, 'menu', e => { e.stopPropagation(); head.querySelector('.acts').classList.toggle('open'); });
  head.querySelector('.acts').addEventListener('click', () => head.querySelector('.acts').classList.remove('open'));
  on(head, 'blame', async () => {
    if (f.blame) { f.blame = null; renderFile(); return; }
    try { f.blame = await api('/blame?path=' + encodeURIComponent(f.path)); renderFile(); } catch (e) { fail(e); }
  });

  if (f.notes && f.notes.length) {
    const n = document.createElement('div');
    n.className = 'details';
    n.innerHTML = f.notes.map(x => '• ' + esc(x.text)).join('\n');
    content.appendChild(n);
  }
  // A picture is shown as one; an SVG, which is text, has its source under it as well.
  if (isImage(f.path)) showPicture(content, f.path);
  if (f.binary) {
    if (!isImage(f.path)) content.insertAdjacentHTML('beforeend', '<div class="center">binary file</div>');
    return;
  }

  const table = document.createElement('table');
  table.className = 'code';
  const lines = f.text.split('\n');
  // Splitting text that ends in a newline leaves an empty last piece that is not a line of
  // the file. The server counted the real lines, so trust that count over the split.
  if (lines.length && lines[lines.length - 1] === '' && f.lines.length < lines.length) lines.pop();
  const cols = 3 + (f.blame ? 1 : 0);
  const byLine = {};
  for (const c of f.comments) if (c.line) (byLine[c.end_line] = byLine[c.end_line] || []).push(c);
  const onChange = () => refreshFileComments().catch(fail);
  // Opens the comment form under line `n`, or under the far end of the range when the
  // click extends one (shift held, or the form's own extend button pressed first).
  const beginComment = (n, extend, text = '') => {
    const open = $('#content .form textarea');
    if (open) { text = text || open.value; open.closest('tr').remove(); }
    extending = false;
    fileHint();
    let start = n, end = n;
    if (extend && commentAnchorLine) { start = Math.min(commentAnchorLine, n); end = Math.max(commentAnchorLine, n); }
    else commentAnchorLine = n;
    table.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
    for (let k = start; k <= end; k++) table.querySelector(`tr[data-line="${k}"]`)?.classList.add('sel');
    const anchorRow = table.querySelector(`tr[data-line="${end}"]`);
    const form = commentForm(f.path, start, end, lines[start - 1] || '', cols, saved => {
      form.remove();
      table.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
      commentAnchorLine = null;
      if (saved) onChange();
    }, () => { extending = true; hint('Now click the last line of the range.', 'Now tap the last line of the range.'); }, text);
    anchorRow.after(form);
  };
  // Comments on the file as a whole have no line; they head the file.
  for (const c of f.comments) if (!c.line) table.appendChild(commentRow(c, cols, onChange));
  let firstMatch = null;
  // Rows are drawn in batches, the first at once and the rest a frame at a time, so that a
  // long file shows its head while the rest of it is still being built and the page stays
  // able to scroll and take a tap meanwhile. A later render, or leaving the file, stops a
  // batch run that is still going. Whatever is asked for up front — a line to scroll to —
  // is drawn in the first batch.
  const generation = ++renderFile.generation;
  const upTo = Math.max(ROWS_AT_ONCE, (renderFile.upToLine || 0) + ROWS_AT_ONCE / 4);
  renderFile.upToLine = 0;
  const ran = state.ran && state.ran.path === f.path ? state.ran.ranges : null;
  const row = (segs, i) => {
    const n = i + 1;
    const op = f.line_ops ? f.line_ops[i] : 'none';
    const tr = document.createElement('tr');
    tr.dataset.line = n;
    tr.className = 'op-' + op + (ran && ran.some(([a, b]) => a <= n && n <= b) ? ' ran' : '');
    const marker = f.comments.find(c => c.line && c.line <= n && n <= c.end_line);
    const mk = marker ? `<span style="color:var(--${marker.state})">●</span>` : (op !== 'none' ? {insert:'+',delete:'-',update:'~',move:'>'}[op] : '');
    const ranges = searchRangesFor(lines[i] || '');
    if (ranges.length && firstMatch === null) firstMatch = n;
    let blame = '';
    if (f.blame) {
      const b = f.blame[i];
      blame = `<td class="b" title="${b ? esc(b.summary) : ''}">${b ? esc(b.hash.slice(0, 7) + ' ' + b.author.slice(0, 12).padEnd(12) + ' ' + b.date) : ''}</td>`;
    }
    tr.innerHTML = `<td class="m">${mk}</td>${blame}<td class="n" title="click to comment, shift-click to extend">${n}</td><td class="c">${renderSegments(segs, [], ranges)}</td>`;
    tr.querySelector('td.c').onclick = e => codeClick(e, f.path, i, lines[i] || '');
    tr.querySelector('td.n').onclick = e => beginComment(n, e.shiftKey || extending);
    table.appendChild(tr);
    for (const c of byLine[n] || []) table.appendChild(commentRow(c, cols, onChange));
  };
  const finish = () => {
    // Comments past the end of the file.
    for (const c of f.comments) if (c.line && c.end_line > f.lines.length) table.appendChild(commentRow(c, cols, onChange));
    if (state.search && firstMatch) scrollToLine(firstMatch);
  };
  let next = 0;
  const batch = (count) => {
    const end = Math.min(f.lines.length, next + count);
    for (; next < end; next++) row(f.lines[next], next);
    if (next < f.lines.length) requestAnimationFrame(() => { if (renderFile.generation === generation && table.isConnected) batch(ROWS_AT_ONCE); });
    else finish();
  };
  batch(upTo);
  content.appendChild(table);
  fileHint();
}
// How many rows a file draws before yielding to the browser.
const ROWS_AT_ONCE = 1500;
renderFile.generation = 0;

// ----- symbols --------------------------------------------------------------------------------

// The byte column of a click inside a code cell: the clicked span's byte offset plus the
// UTF-8 length of the text before the caret within it.
function byteColumnOfClick(e) {
  let span = e.target.closest('span[data-off]');
  if (!span) return null;
  const base = +span.dataset.off;
  let within = 0;
  const pos = document.caretPositionFromPoint ? document.caretPositionFromPoint(e.clientX, e.clientY)
    : (document.caretRangeFromPoint ? (r => r && { offsetNode: r.startContainer, offset: r.startOffset })(document.caretRangeFromPoint(e.clientX, e.clientY)) : null);
  if (pos && span.contains(pos.offsetNode)) {
    const text = pos.offsetNode.textContent || '';
    within = new TextEncoder().encode(text.slice(0, pos.offset)).length;
  }
  return base + within;
}

async function codeClick(e, path, row, lineText) {
  const col = byteColumnOfClick(e);
  hidePopover();
  if (col === null) return;
  try {
    const r = await api(`/identifier?path=${encodeURIComponent(path)}&line=${row}&col=${col}`);
    if (!r.name) return;
    showPopover(e.clientX, e.clientY, r.name);
  } catch (err) { fail(err); }
}

function showPopover(x, y, name) {
  const p = $('#popover');
  p.innerHTML = `<span class="word">${esc(name)}</span><button class="small" data-act="def">Definition</button><button class="small" data-act="refs">Usages</button>`;
  p.hidden = false;
  // Keep it on screen: 260 is about as wide as the popover gets with a long name in it.
  p.style.left = Math.min(x + 4, window.innerWidth - 260) + 'px';
  p.style.top = (y + 8) + 'px';
  on(p, 'def', () => { hidePopover(); gotoDefinition(name); });
  on(p, 'refs', () => { hidePopover(); showReferences(name); });
}
function hidePopover() { $('#popover').hidden = true; }
document.addEventListener('click', e => { if (!e.target.closest('#popover') && !e.target.closest('table.code td.c')) hidePopover(); });

async function gotoDefinition(name) {
  try {
    const defs = await api('/definitions?name=' + encodeURIComponent(name));
    if (!defs.length) { msg('no definition of ' + name + ' in the repository'); return; }
    if (defs.length === 1) { await openFile(defs[0].path, defs[0].line); return; }
    showDrawer(defs.length + ' definitions of ' + name, defs.map(symbolHit));
  } catch (err) { fail(err); }
}

async function showReferences(name) {
  try {
    const refs = await api('/references?name=' + encodeURIComponent(name));
    if (!refs.length) { msg('no occurrence of ' + name); return; }
    showDrawer(refs.length + ' occurrences of ' + name, refs.map(r => ({ path: r.path, line: r.line, label: '', text: r.text })));
  } catch (err) { fail(err); }
}

async function showFileSymbols(path) {
  try {
    const syms = await api('/symbols?path=' + encodeURIComponent(path));
    if (!syms.length) { msg('no symbols found in ' + path); return; }
    showDrawer('symbols in ' + path, syms.map(symbolHit));
  } catch (err) { fail(err); }
}

async function searchSymbols(q) {
  if (!q.trim()) return;
  try {
    const syms = await api('/symbol_search?q=' + encodeURIComponent(q.trim()));
    if (!syms.length) { msg('no symbol matches ' + q); return; }
    showDrawer(syms.length + ' symbols matching ' + q, syms.map(symbolHit));
  } catch (err) { fail(err); }
}

function symbolHit(s) {
  return { path: s.path, line: s.line, label: s.kind + ' ' + s.name + (s.container ? ' in ' + s.container : ''), text: s.text };
}

function showDrawer(title, hits) {
  const d = $('#drawer');
  d.hidden = false;
  d.innerHTML = `<div class="panelhead"><span class="path">${esc(title)}</span><span class="spacer"></span><button class="small" data-act="close">✕</button></div><div class="list"></div>`;
  on(d, 'close', () => { d.hidden = true; });
  const list = d.querySelector('.list');
  if (!hits.length) list.innerHTML = '<div class="center">Nothing to show.</div>';
  for (const h of hits) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="loc">${esc(h.path)}:${h.line}</span>${h.label ? `<span class="label">${esc(h.label)}</span>` : ''}<span class="text">${esc(h.text)}</span>`;
    el.onclick = () => openFile(h.path, h.line);
    list.appendChild(el);
  }
}

// The tests that name something in `path`, in the drawer: the way from a file to what checks
// it, as a test's card is the way back.
async function showTestsOf(path) {
  try {
    const tests = await api('/tests_of?path=' + encodeURIComponent(path));
    const name = path.split('/').pop();
    showDrawer(tests.length ? `${tests.length} ${tests.length === 1 ? 'test names' : 'tests name'} ${name}` : `No test names ${name}`,
      tests.map(t => ({ path: t.path, line: t.line, label: t.label, text: `${LEVEL_NAMES[t.level]}${t.ignored ? ', skipped' : ''}` })));
  } catch (e) { fail(e); }
}

$('#symbol').onkeydown = e => { if (e.key === 'Enter') { searchSymbols(e.target.value); e.target.blur(); } if (e.key === 'Escape') e.target.blur(); };

// ----- agent ----------------------------------------------------------------------------------

const agent = { version: 0, entries: [], status: 'not started', running: false, name: '', permission: null, timer: null,
  showThoughts: false, showLog: true, pollFailures: 0, progress: '', usage: '', startedAt: null };

async function agentPoll() {
  try {
    const r = await api('/agent/events?since=' + agent.version);
    agent.running = r.running; agent.status = r.status; agent.name = r.name; agent.permission = r.permission; agent.command = r.command;
    agent.progress = r.progress || ''; agent.usage = r.usage || '';
    // The server writes the transcript; this only puts each line where it says. Entries are
    // not append-only, because a tool call is filled in as it runs.
    for (const [index, entry] of r.entries) agent.entries[index] = entry;
    if (agent.entries.length > r.count) agent.entries.length = r.count;
    agent.version = r.version;
    if (r.entries.length || state.view === 'agent') renderAgent();
    else renderAgentHead();
    $('#agentdot').hidden = !(agent.permission || agent.status === 'working');
    $('#agentdot').textContent = agent.permission ? '?' : '…';
    if (agent.pollFailures) { agent.pollFailures = 0; renderAgentHead(); }
  } catch (err) {
    // A poll that keeps failing means the server is gone or the session has ended, and
    // saying nothing leaves a panel that looks merely quiet.
    console.error(err);
    agent.pollFailures = (agent.pollFailures || 0) + 1;
    if (agent.pollFailures === 3) {
      agent.entries.push({ kind: 'system', text: 'lost contact with the server: ' + err.message });
      renderAgent();
    }
    if (agent.pollFailures >= 3) renderAgentHead();
  }
}

function startAgentPolling() {
  if (agent.timer) return;
  // A page in a background tab, or a phone in a pocket, does not poll; it catches up when
  // it is looked at again.
  agent.timer = setInterval(() => { if (!document.hidden && (state.view === 'agent' || agent.running)) agentPoll(); }, 500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (state.view === 'agent' || agent.running)) agentPoll(); });
}

async function agentStart() {
  agent.entries.push({ kind: 'system', text: 'starting ' + (agent.command || 'the agent') + ' …' });
  agent.startedAt = Date.now();
  renderAgent();
  try {
    const r = await api('/agent/start', { post: true });
    agent.running = r.running; agent.status = r.status; agent.name = r.name;
    agent.entries.push({ kind: 'system', text: 'connected to ' + r.name + ' after ' + ((Date.now() - agent.startedAt) / 1000).toFixed(1) + 's' });
  } catch (err) { agent.entries.push({ kind: 'system', text: 'could not start the agent: ' + err.message }); }
  agent.startedAt = null;
  renderAgent();
}

// The header line: status, what the backend is doing, elapsed time, tokens and cost.
function renderAgentHead() {
  const root = $('#agent');
  if (!root) return;
  $('#agentname').textContent = agent.running ? agent.name : (agent.command || '');
  $('#agentstatus').textContent = agent.status;
  let progress = agent.progress;
  if (agent.pollFailures >= 3) progress = 'not answering (' + agent.pollFailures + ' tries)';
  else if (agent.startedAt && !progress) progress = 'starting · ' + Math.round((Date.now() - agent.startedAt) / 1000) + 's';
  $('#agentprogress').textContent = progress;
  $('#agentusage').textContent = agent.usage;
}

async function agentSend(body) {
  try {
    if (!agent.running) await agentStart();
    if (!agent.running) return;
    await api('/agent/prompt', { body });
    agent.status = 'working';
    await agentPoll();
  } catch (err) { fail(err); }
}

function askAgent(body) {
  showAgent();
  agentSend(body);
}

function showAgent() {
  setTabs('agent');
  navigate(routes.view('agent'));
  startAgentPolling();
  const content = $('#content');
  content.innerHTML = `<div id="agent"><div class="panelhead"><span class="path">agent</span><span id="agentname" class="dim"></span><span id="agentstatus" class="badge"></span><span id="agentprogress" class="progress"></span><span id="agentusage" class="usage"></span><span class="spacer"></span>
      <label class="dim"><input type="checkbox" id="thoughts"> thoughts</label>
      <label class="dim"><input type="checkbox" id="showlog"> log</label>
      <button data-act="all" title="work through every pending comment in REVIEW.md">Address all pending</button>
      <button data-act="cancel">Cancel turn</button><button data-act="restart">Restart</button><button data-act="clear">Clear</button></div>
    <div class="transcript"></div><div class="permission" hidden></div>
    <div class="compose"><textarea id="ask" placeholder="Ask the agent (Enter sends, Shift-Enter for a new line)"></textarea>
    <div class="row" style="margin-top:6px"><button class="primary" data-act="send">Send</button><span class="dim">Comments and lines have their own “ask” buttons; the agent runs in the repository root.</span></div></div></div>`;
  $('#agent [data-act=send]').onclick = () => { const ta = $('#ask'); const t = ta.value.trim(); if (!t) return; ta.value = ''; agentSend({ text: t }); };
  $('#ask').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#agent [data-act=send]').click(); } };
  $('#agent [data-act=all]').onclick = () => agentSend({ preset: 'address_all' });
  $('#agent [data-act=cancel]').onclick = () => api('/agent/cancel', { post: true }).catch(fail);
  $('#agent [data-act=restart]').onclick = async () => { await api('/agent/stop', { post: true }).catch(fail); agent.running = false; agentStart(); };
  $('#agent [data-act=clear]').onclick = () => api('/agent/clear', { post: true })
    .then(() => { agent.entries = []; agent.version = 0; renderAgent(); agentPoll(); })
    .catch(fail);
  $('#thoughts').checked = agent.showThoughts;
  $('#thoughts').onchange = e => { agent.showThoughts = e.target.checked; renderAgent(); };
  $('#showlog').checked = agent.showLog;
  $('#showlog').onchange = e => { agent.showLog = e.target.checked; renderAgent(); };
  renderAgent();
  agentPoll();
  hint('Enter sends. The agent asks before doing anything that needs permission.', 'The agent asks before doing anything that needs permission.');
}

function renderAgent() {
  const root = $('#agent');
  if (!root) return;
  renderAgentHead();
  const t = root.querySelector('.transcript');
  // Within a line or so of the end counts as being at the end: a reader who has scrolled
  // up to read something should not be yanked back down by the next line of output.
  const atBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 20;
  t.innerHTML = agent.entries.filter(e => (e.kind !== 'thought' || agent.showThoughts) && (e.kind !== 'log' || agent.showLog)).map(e => {
    const who = { user: 'you', agent: agent.name || 'agent', thought: 'thinking', tool: 'tool', system: '', log: 'log' }[e.kind];
    return `<div class="entry ${e.kind}"><span class="who">${esc(who)}</span><span class="body">${esc(e.text)}</span></div>`;
  }).join('') || '<div class="center">Nothing yet. Ask something below, or use “Address all pending”.</div>';
  if (atBottom) t.scrollTop = t.scrollHeight;
  const p = root.querySelector('.permission');
  if (agent.permission) {
    p.hidden = false;
    const details = agent.permission.details && agent.permission.details.trim() !== agent.permission.title.trim()
      ? `<pre class="perm">${esc(agent.permission.details)}</pre>` : '';
    p.innerHTML = `<div class="grow"><b>agent asks:</b> ${esc(agent.permission.title)}${details}</div>` + agent.permission.options.map(o => `<button class="small" data-opt="${esc(o.option_id)}">${esc(o.name)}</button>`).join('') + `<button class="small" data-opt="">Cancel</button>`;
    const asked = agent.permission.request_id;
    p.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => api('/agent/permission', { body: { option_id: b.dataset.opt || null, request_id: asked } }).then(agentPoll).catch(fail));
  } else {
    p.hidden = true;
  }
}

// ----- changes --------------------------------------------------------------------------------

async function showChanges(staged = false) {
  setTabs('changes');
  // Which side the view is on, so a redraw — a refresh, or the watcher — stays on it.
  state.changesStaged = staged;
  navigate(routes.changes(staged));
  try {
    const files = await api('/changes?staged=' + staged);
    const content = $('#content');
    content.innerHTML = `<div class="panelhead"><span class="path">${staged ? 'staged' : 'working tree'}</span><span class="dim">${files.length} files</span>
      <span class="spacer"></span><button data-act="switch">${staged ? 'Show working tree' : 'Show staged'}</button>
      <button data-act="log" title="the repository's history">Log</button>
      <button class="primary" data-act="commit" ${files.length ? '' : 'disabled'} title="${staged ? 'commit what is staged' : 'stage everything below and commit it'}">Commit ${files.length} ${files.length === 1 ? 'file' : 'files'}</button></div><div class="list"></div>`;
    on(content, 'switch', () => showChanges(!staged));
    on(content, 'log', () => showLog());
    on(content, 'commit', () => commitChanges(staged, files));
    const list = content.querySelector('.list');
    if (!files.length) list.innerHTML = '<div class="center">nothing here</div>';
    files.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      const letter = statusLetter(f);
      el.innerHTML = `<span class="status-letter ${letter === '?' ? 'q' : letter}">${letter}</span><span class="mono grow">${esc(f.old_path ? f.old_path + ' → ' + f.path : f.path)}</span>`;
      el.onclick = () => showDiff({ kind: staged ? 'staged' : 'working', path: f.path, old_path: f.old_path || '', status: letter }, files, i);
      list.appendChild(el);
    });
    hint('Click a file to see its diff; Commit records what is listed.', 'Tap a file to see its diff; Commit records what is listed.');
  } catch (e) { fail(e); }
}

// A review that ends in "this is good" ends in a commit. What is about to go in is spelled
// out above the message box, files and all, together with anything still pending on those
// files in REVIEW.md: an unanswered comment on a change is the one thing not to commit by
// accident. The working-tree view stages everything it lists first; the staged view commits
// the index as it stands.
async function commitChanges(staged, files) {
  const paths = files.map(f => f.path);
  const pending = (state.allComments || []).filter(a => a.comment.section === 'Pending'
    && paths.some(p => p === a.comment.path || p.startsWith(a.comment.path + '/')));
  const shown = files.slice(0, 12).map(f => '  ' + statusLetter(f) + ' ' + (f.old_path ? f.old_path + ' → ' + f.path : f.path));
  if (files.length > shown.length) shown.push(`  … and ${files.length - shown.length} more`);
  const note = shown.join('\n')
    + (pending.length ? `\n\n${pending.length} comment${pending.length === 1 ? '' : 's'} still pending on ${pending.length === 1 ? 'one of these files' : 'these files'}.` : '');
  const title = staged ? `Commit ${files.length} staged ${files.length === 1 ? 'file' : 'files'}` : `Commit ${files.length} ${files.length === 1 ? 'file' : 'files'} from the working tree`;
  // A hook that refuses says why over several lines, where the footer holds one, so what it
  // said heads the sheet that comes back — with the message kept, since it is usually the
  // repository that needs fixing and not the wording.
  let message = '', trouble = '';
  for (;;) {
    message = await askText(title, message, trouble ? 'Try again' : 'Commit', trouble ? trouble + '\n\n' + note : note);
    if (!message) return;
    try {
      const commit = await api('/commit', { body: { message, all: !staged } });
      msg(`committed ${commit.short} ${commit.subject}`);
      await doRefresh({ quiet: true });
      return;
    } catch (e) {
      console.error(e);
      trouble = e.message;
    }
  }
}

// What a repository opens on: how it is doing, what it says it is, where to start reading and

// what they say the system does, and what they leave alone. Several requests, because what it

    content.innerHTML = `<div class="panelhead"><span class="path">${esc(repo ? repo.name : 'repository')}</span>
      <span class="dim mono">${esc(st.branch)}</span>
      <span class="spacer"></span>
      <button data-act="files">Files</button>
      <button data-act="explain" title="have the agent write an orientation into OVERVIEW.md, under About">Explain this repository</button></div>
      <div class="overview">
        <section class="summary">
          <div class="card" data-card="changes"><h3>Tests this week</h3><div class="dim">reading the history…</div></div>
          <div class="card" data-card="run"><h3>Last test run</h3><div class="dim">reading the checks…</div></div>
          <div class="card" data-card="areas"><h3>Tests by area</h3><div class="dim">reading the tests…</div></div>
        </section>
        <section class="state">

            <span class="fig"><b>${st.files}</b> files</span>
            <span class="fig ${st.changed ? 'live' : ''}" data-act="changed"><b>${st.changed}</b> changed</span>
            <span class="fig ${st.pending ? 'live' : ''}" data-act="pending"><b>${st.pending}</b> pending</span>
            ${st.stale || st.moved ? `<span class="fig warn" data-act="pending" title="comments whose lines have moved or gone">${st.stale ? num(st.stale, 'stale') : ''}${st.stale && st.moved ? ', ' : ''}${st.moved ? num(st.moved, 'moved') : ''}</span>` : ''}
            <span class="fig"><b>${st.commits}</b> commits this week</span>
            ${st.todos ? `<span class="fig"><b>${st.todos}</b> TODO/FIXME</span>` : ''}
          </div>
          ${st.authors.length ? `<div class="dim">this week: ${esc(st.authors.join(', '))}</div>` : ''}
          ${st.last ? `<div class="dim">last commit ${esc(st.last.subject)} · ${esc(st.last.author)} · ${ago(st.last.date)}</div>` : '<div class="dim">no commits yet</div>'}
        </section>
        ${o.readme ? `<section><h3>${esc(o.readme.path)}</h3><pre class="readme">${esc(o.readme.opening)}</pre></section>` : ''}
        <section><h3>Start here</h3><div class="entries"></div></section>
        <section><h3>What the rest of it leans on</h3><div class="leaning dim">reading the symbols…</div></section>
        <section class="testing"><h3>Tests</h3>
          <div class="checks dim">reading the checks…</div>
          <div class="suite dim">reading the tests…</div>
        </section>
        ${o.docs.length ? '<section><h3>Also written down</h3><div class="docs"></div></section>' : ''}
        ${st.biggest.length ? '<section><h3>Biggest files</h3><div class="biggest"></div></section>' : ''}
      </div>`;
    on(content, 'files', showTree);
    on(content, 'explain', explainRepository);
    loadSummary(content);
    on(content, 'changed', () => showChanges());
    on(content, 'pending', showReview);

    const link = (into, path, why) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<span class="mono grow">${esc(path)}</span><span class="dim why">${esc(why)}</span>`;
      el.onclick = () => openFile(path);
      into.appendChild(el);
    };
    const entries = content.querySelector('.entries');
    if (!o.entries.length) entries.innerHTML = '<div class="dim">Nothing this page knows the conventions for. The tree is a tap away.</div>';
    for (const e of o.entries) link(entries, e.path, e.why);
    const docs = content.querySelector('.docs');
    if (docs) for (const d of o.docs) link(docs, d, '');
    const big = content.querySelector('.biggest');
    if (big) for (const b of st.biggest) link(big, b.path, (b.bytes / 1024).toFixed(0) + ' KiB');

    // The slow parts, once the rest is on screen. The checks are not waited for: they fail,
    // and redraw themselves while one runs, on their own.
    renderChecks(content.querySelector('.overview .checks'));
    await loadSymbolParts(content, link);
  } catch (e) { fail(e); }
}

// What needs the symbol index: what the tree leans on, and the tests. While the server is
// still building that index for a repository just opened, it answers from OVERVIEW.md, as of
// the commit that file names; that is drawn, said, and asked about again in two seconds,
// until the fresh answer comes.
async function loadSymbolParts(content, link) {
  let fromFile = null;
  try {
    const { leaning, as_of } = await api('/leans_on');
    fromFile = as_of;
    const into = content.querySelector('.leaning');
    if (!into) return;
    into.className = 'leaning';
    into.innerHTML = '';
    if (!leaning.length) {
      into.className = 'leaning dim';
      into.textContent = as_of ? 'Nothing written down yet.' : 'Nothing here defines names the rest of the tree uses.';
    }
    for (const l of leaning) link(into, l.path, l.names.join(', '));
    if (as_of) into.appendChild(asOfNote(as_of));
  } catch (e) {
    const into = content.querySelector('.leaning');
    if (into) into.textContent = 'could not read the symbols: ' + e.message;
  }
  const suite = content.querySelector('.suite');
  try {
    const inventory = await api('/tests');
    renderSuite(suite, inventory, link);
    if (inventory.as_of && suite) suite.appendChild(asOfNote(inventory.as_of));
    fromFile = fromFile || inventory.as_of;
  } catch (e) {
    if (suite) suite.textContent = 'could not read the tests: ' + e.message;
  }
  if (fromFile) setTimeout(() => { if (content.isConnected) loadSymbolParts(content, link); }, 2000);
}

// The cards the overview opens on. Each answers one question and leads to the view that says
// more: what the week did to the tests, how the last run went, and what each area has.
async function loadSummary(content) {
  const card = name => content.querySelector(`[data-card=${name}]`);
  api('/analysis').then(checks => { if (card('run')) renderRunCard(card('run'), checks); })
    .catch(e => { if (card('run')) card('run').innerHTML = '<h3>Last test run</h3><div class="dim">could not read the checks: ' + esc(e.message) + '</div>'; });
  try {
    const spec = await api('/spec');
    if (!card('changes')) return;
    renderChangesCard(card('changes'), spec);
    renderAreasCard(card('areas'), spec);
    // Areas come from OVERVIEW.md while the index is built, by where tests are rather than
    // what they name; ask again until they come from the index.
    if (spec.as_of) setTimeout(() => { if (card('areas')) loadSummaryAgain(content); }, 2000);
  } catch (e) {
    if (card('changes')) card('changes').innerHTML = '<h3>Tests this week</h3><div class="dim">could not read them: ' + esc(e.message) + '</div>';
  }
}

async function loadSummaryAgain(content) {
  try {
    const spec = await api('/spec');
    const areas = content.querySelector('[data-card=areas]');
    if (!areas) return;
    renderAreasCard(areas, spec);
    if (spec.as_of) setTimeout(() => loadSummaryAgain(content), 2000);
  } catch (e) { console.error(e); }
}

const ALARMING = ['removed', 'skipped', 'weakened'];

function renderChangesCard(card, spec) {
  const alarming = spec.changes.filter(c => ALARMING.includes(c.what));
  const counts = {};
  for (const c of spec.changes) if (!ALARMING.includes(c.what)) counts[c.what] = (counts[c.what] || 0) + 1;
  const said = Object.entries(counts).map(([w, n]) => `${n} ${w}`).join(', ');
  if (alarming.length) {
    card.className = 'card bad';
    card.innerHTML = `<h3>${alarming.length} ${alarming.length === 1 ? 'test checks' : 'tests check'} less than a week ago</h3>`
      + alarming.slice(0, 3).map(c => `<div class="row"><span class="what ${c.what}">${c.what}</span><span>${esc(c.label)}${c.checks && c.checks[0] !== c.checks[1] ? ` <span class="dim">${c.checks[0]} → ${c.checks[1]} assertions</span>` : ''}</span></div>`).join('')
      + (alarming.length > 3 ? `<div class="dim">and ${alarming.length - 3} more</div>` : '')
      + `<div class="more">${said ? 'Also ' + esc(said) + '. ' : ''}See them in Tests ›</div>`;
  } else {
    card.className = 'card good';
    card.innerHTML = `<h3>No test lost ground this week</h3><div class="dim">${said ? esc(said) : 'No test was added, changed or removed.'}</div><div class="more">Tests ›</div>`;
  }
  card.onclick = () => showSpec({ stretch: 'week' });
}

// The check run most recently, or that left the newest result: what it said and whether the
// code has moved since.
function renderRunCard(card, checks) {
  const time = c => (c.last && c.last.started) || (c.figures && c.figures.as_of) || '';
  const ran = checks.filter(time).sort((a, b) => Date.parse(time(b)) - Date.parse(time(a)));
  if (!ran.length) {
    const first = checks[0];
    card.className = 'card warn';
    const how = first ? (first.name === first.run ? '' : ' runs ' + first.run) : '';
    card.innerHTML = `<h3>No test run yet</h3><div class="dim">${first ? '<span class="mono">' + esc(first.name) + '</span>' + esc(how) + (first.suggested ? ', found in the repository' : '') : 'Nothing here says how to run the tests.'}</div>${first ? `<div class="more"><a data-act="run">Run ${esc(first.name)} ›</a></div>` : ''}`;
    // Only the link runs it: a run executes the repository's own code, and a card is too easy
    // a thing to brush on a phone.
    card.onclick = () => document.querySelector('#content .testing')?.scrollIntoView({ behavior: 'smooth' });
    on(card, 'run', e => {
      e.stopPropagation();
      api('/analysis/run', { body: { name: first.name } })
        .then(() => { msg(first.name + ' started'); card.querySelector('h3').textContent = first.name + ': running'; })
        .catch(fail);
    });
    return;
  }
  const c = ran[0], last = c.last, f = c.figures;
  const running = last && last.running;
  const failed = last && !running ? last.exit !== 0 : !!(f && f.failed);
  card.className = 'card ' + (running ? '' : failed ? 'bad' : 'good');
  const bits = [];
  if (f && f.tests !== null && f.tests !== undefined) {
    if (f.failed) bits.push(`${f.failed} failed`);
    if (f.skipped) bits.push(`${f.skipped} skipped`);
  }
  if (f && f.coverage !== null && f.coverage !== undefined) bits.push(f.coverage.toFixed(1) + '% of lines covered');
  bits.push(ago(time(c)));
  const tests = f && f.tests !== null && f.tests !== undefined ? `<div class="big">${f.tests} ${f.tests === 1 ? 'test' : 'tests'}</div>` : '';
  card.innerHTML = `<h3>${esc(c.name)}: ${running ? 'running' : failed ? 'failed' : 'passed'}</h3>${tests}<div class="dim">${esc(bits.join(' · '))}</div>${staleness(c.stale)}<div class="more">All checks ›</div>`;
  card.onclick = () => document.querySelector('#content .testing')?.scrollIntoView({ behavior: 'smooth' });
}

const LEVEL_NAMES = { security: 'security', end_to_end: 'end to end', integration: 'integration', unit: 'unit' };

// One row per part of the code: how many tests of each level count towards it, and how many
// of its files no test names. A row opens the tests narrowed to that part.
function renderAreasCard(card, spec) {
  card.className = 'card';
  const rows = spec.areas.map(a => `<tr class="area" data-area="${esc(a.name)}"><td>${esc(a.name)}</td>`
    + a.levels.map(n => `<td class="${n ? '' : 'zero'}">${n}</td>`).join('')
    + `<td class="${a.unreached ? 'gap' : 'zero'}">${a.files ? a.unreached + ' of ' + a.files : ''}</td></tr>`).join('');
  card.innerHTML = `<h3>Tests by area</h3><table class="areas"><tr><th>area</th><th title="security">sec</th><th title="end to end">e2e</th><th title="integration">int</th><th>unit</th><th title="files of code that no test names">untested</th></tr>${rows}</table>`
    + (spec.as_of ? '<div class="dim asof">From OVERVIEW.md, by where the tests are; reading the repository…</div>' : '');
  card.onclick = e => {
    const tr = e.target.closest('tr.area');
    showSpec({ stretch: state.specStretch || 'week', area: tr ? tr.dataset.area : undefined });
  };
}

// Where a list from OVERVIEW.md stands: the commit it was written at, how far behind that
// is, and that the fresh one is on its way.
function asOfNote(as_of) {
  const el = document.createElement('div');
  el.className = 'dim asof';
  const behind = as_of.commits_since ? `, ${as_of.commits_since} ${as_of.commits_since === 1 ? 'commit' : 'commits'} ago` : '';
  el.textContent = as_of.commit ? `From OVERVIEW.md as of ${as_of.commit}${behind}; reading the repository…` : 'Reading the repository…';
  el.title = 'the symbol index is being built; this is what was last written down';
  return el;
}

// What the tests say the system does, file by file, each file folded until it is opened: a
// list someone who did not write them can read as a specification, since tests are named for
// what they check. Then what they leave alone: the files the rest of the tree leans on most
// that no test code names, which is where a change breaks the most with nothing to say so.
function renderSuite(into, inv, link) {
  if (!into || !into.isConnected) return;
  into.className = 'suite';
  if (!inv.total) {
    into.innerHTML = `<div class="dim">No tests found. What counts as one: a <code>#[test]</code> function in Rust, a <code>test_</code> function where pytest looks, a <code>TestXxx</code> in a Go <code>_test.go</code> file, an <code>it()</code> or <code>test()</code> in a <code>.test</code> or <code>.spec</code> file.</div>`;
  } else {
    const files = inv.files.length;
    into.innerHTML = '';
    const all = document.createElement('div');
    all.className = 'item';
    all.innerHTML = `<span class="grow">${inv.total} ${inv.total === 1 ? 'test' : 'tests'} in ${files} ${files === 1 ? 'file' : 'files'}${inv.ignored ? ', ' + inv.ignored + ' marked to skip' : ''}: what they say, by level and area</span><span class="dim">Tests ›</span>`;
    all.onclick = () => showSpec();
    into.appendChild(all);
  }
  if (inv.untested.length) {
    const head = document.createElement('h4');
    head.textContent = 'Leaned on, and named by no test';
    into.appendChild(head);
    const caveat = document.createElement('div');
    caveat.className = 'dim caveat';
    caveat.textContent = 'Named, not run: a test that reaches a file through a URL or a command line never names what it reaches, so look before believing one of these.';
    into.appendChild(caveat);
    const list = document.createElement('div');
    for (const u of inv.untested) link(list, u.path, u.names.join(', '));
    into.appendChild(list);
  }
}

// ----- specification --------------------------------------------------------------------------

// What the tests say the system does, by level, and what a stretch of history did to them.
// The repository is what is reviewed: the stretch is only what is marked in it, the last week
// unless another is picked, or one commit when the log sent us here.
const STRETCHES = [['week', 'last 7 days'], ['last', 'last commit'], ['uncommitted', 'uncommitted']];
const LEVEL_SAYS = {
  security: ['Tests whose name or path is about signing in, secrets, permissions or attacks.',
    'No test is named for security: nothing here says what an attacker cannot do.'],
  end_to_end: ['Tests that drive the whole system the way a person would: through a browser, or a real server.',
    'No test drives the whole system: nothing here shows it working the way someone would use it.'],
  integration: ['Tests that reach the system through its public interface.', 'None found.'],
  unit: ['Everything else: one piece at a time.', 'None found.'],
};

// ----- end to end ---------------------------------------------------------------------------

// What a repository opens on: its end-to-end tests, the ones that drive it the way a person
// does, each with the recording its last run left. Everything else is reached from here.
async function showEndToEnd() {
  setZen(false);
  setTabs('e2e');
  state.testView = null;
  const route = routes.e2e();
  navigate(route);
  document.body.classList.remove('showfile');
  const content = $('#content');
  if (!content.querySelector('.e2e')) content.innerHTML = '<div class="center">reading the tests…</div>';
  try {
    const o = await api('/e2e');
    if (state.view !== 'e2e' || currentRoute !== route) return;
    renderEndToEnd(content, o);
    // The tests came from OVERVIEW.md while the index is built; ask again until they have not.
    if (o.as_of) setTimeout(() => { if (state.view === 'e2e' && currentRoute === route) showEndToEnd(); }, 2000);
  } catch (e) {
    content.innerHTML = '';
    fail(e);
  }
}

// What an end-to-end test of each kind of software does, for a repository that has none.
const E2E_LOOKS_LIKE = {
  'a web page': 'For a web page, that is a real browser opening it, tapping and typing, and checking what is on the screen, recorded as a video.',
  'a terminal program': 'For a terminal program, that is the built program run in a pseudo-terminal, keys pressed, and the screen checked, recorded as an asciicast.',
  'a command': 'For a command, that is the built program run with the arguments and input a person would give it, checking what it prints and what it leaves behind.',
};

function renderEndToEnd(content, o) {
  const repo = state.repos[state.repo];
  const num = (n, one, many) => `${n} ${n === 1 ? one : many || one + 's'}`;
  const keep = content.querySelector('.e2e') ? content.querySelector('.e2e').scrollTop : 0;
  const bits = [];
  if (o.failed) bits.push(`<span class="bad">${o.failed} failed</span>`);
  if (o.unrecorded) bits.push(`${o.unrecorded} without a recording`);
  content.innerHTML = `<div class="panelhead"><span class="path">${esc(repo ? repo.name : 'repository')}</span>
      <span class="spacer"></span>
      <button data-act="summary">Summary</button>
      <button data-act="files">Files</button></div>
    <div class="e2e"></div>`;
  on(content, 'summary', showOverview);
  on(content, 'files', showTree);
  const root = content.querySelector('.e2e');
  if (!o.tests.length) {
    const looks = E2E_LOOKS_LIKE[o.kind] || 'That is the software driven from outside, the way the person or program using it would, and what comes back checked.';
    root.innerHTML = `<section class="finding">
        <h2>No end-to-end tests</h2>
        <p>Nothing here drives ${esc(o.kind || 'the software')} the way a person does and checks what comes back, so nothing shows that it works. That comes before reading any of its code.</p>
        <p class="dim">${esc(looks)}</p>
        <div class="row"><button class="primary" data-act="ask">Ask the agent to write the first ones</button>
        ${o.total ? `<button data-act="spec">The ${num(o.total, 'test')} it has</button>` : ''}</div>
      </section>`;
    on(root, 'ask', () => askAgent(o.ask));
    on(root, 'spec', () => showSpec({}));
  } else {
    root.innerHTML = `<div class="e2e-head"><b>${num(o.tests.length, 'end-to-end test')}</b>
        <span class="dim">of ${num(o.total, 'test')}</span>${bits.length ? ' · ' + bits.join(' · ') : ''}
        <a href="${routes.spec({})}" class="more">all tests ›</a></div>`;
    if (o.as_of) root.appendChild(asOfNote(o.as_of));
    for (const [path, tests] of groupBy(o.tests, t => t.path)) {
      const h = document.createElement('h3');
      h.className = 'mono';
      h.textContent = path;
      root.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'e2e-grid';
      for (const t of tests) grid.appendChild(e2eCard(t, t.recording));
      root.appendChild(grid);
    }
  }
  if (o.orphans.length) {
    const h = document.createElement('h3');
    h.textContent = 'Recordings of tests no longer here';
    root.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'e2e-grid';
    for (const r of o.orphans) grid.appendChild(e2eCard(null, r));
    root.appendChild(grid);
  }
  root.scrollTop = keep;
}

// One end-to-end test on a page of its own: where a reviewer goes into the code from. Its
// recording with the steps beside it, each with the line of the test that took it; then the
// code its run executed, what only it ran first; the documentation it demonstrates; and the
// smaller tests that reach the same code.
async function showTestView(file, name) {
  setZen(false);
  setTabs('e2e');
  state.testView = { file, name };
  const route = routes.test(file, name);
  navigate(route);
  document.body.classList.remove('showfile');
  const content = $('#content');
  content.innerHTML = '<div class="center">reading the test…</div>';
  let d;
  try {
    d = await api('/e2e/test?' + qs({ file, name }));
  } catch (e) {
    if (/still reading/.test(e.message)) {
      setTimeout(() => { if (currentRoute === route) showTestView(file, name); }, 2000);
      return;
    }
    content.innerHTML = '';
    return fail(e);
  }
  if (currentRoute !== route) return;
  const r = d.recording;
  const status = !r ? 'norec' : r.passed ? 'passed' : 'failed';
  content.innerHTML = `<div class="panelhead"><span class="path">${esc(d.label)}</span><span class="spacer"></span>
      <button data-act="source">Test source</button></div>
    <div class="e2e testview ${status}">
      <div class="meta dim"><span class="mark">${{ passed: '✓', failed: '✗', norec: '○' }[status]}</span>
        <a data-act="source" class="mono">${esc(d.path)}:${d.line}</a> · ${esc(d.why)}${r ? ' · ' + recordingAge(d, r) : ''}${r && r.commit ? ` · at <span class="mono">${esc(r.commit.slice(0, 7))}</span>${r.dirty ? ' with uncommitted changes' : ''}` : ''}</div>
      <div class="watch"><div class="media"></div><div class="side"><div class="failures"></div><h3>Steps</h3><ol class="steps"></ol></div></div>
      <section><h3>Code it ran</h3><div class="ran"></div></section>
      <section><h3>Documentation</h3><div class="docs"></div></section>
      <section><h3>Smaller tests that reach the same code</h3><div class="smaller"></div></section>
    </div>`;
  content.querySelectorAll('[data-act=source]').forEach(b => b.onclick = () => openFile(d.path, d.line || undefined));
  const view = content.querySelector('.testview');
  const media = view.querySelector('.media');
  const steps = view.querySelector('ol.steps');
  let player = null;
  if (!r) media.innerHTML = '<div class="none dim">No recording yet: this test has not left one where the tool looks.</div>';
  else {
    player = r.kind === 'terminal' ? castPlayer(media, r) : r.kind === 'video' ? videoPlayer(media, r) : null;
    if (!player) media.innerHTML = '<div class="none dim">The test ran, but left no recording this page can play.</div>';
    for (const s of r.steps.filter(s => s.kind === 'check' && s.passed === false)) {
      view.querySelector('.failures').insertAdjacentHTML('beforeend',
        `<div class="fail"><b>✗ ${esc(s.text)}</b>${s.detail ? `<pre>${esc(s.detail)}</pre>` : ''}</div>`);
    }
    r.steps.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = s.kind + (s.passed === false ? ' failed' : '');
      li.innerHTML = `<div><span class="at mono">${clock(s.at_ms)}</span> ${s.kind === 'check' ? (s.passed === false ? '✗' : '✓') + ' ' : ''}${esc(s.text)}</div>
        ${d.sources[i] ? `<a class="src mono" title="line ${s.line} of the test">${s.line}: ${esc(d.sources[i])}</a>` : ''}`;
      li.onclick = e => {
        if (e.target.closest('.src')) return openFile(d.path, s.line);
        if (player) player.seek(s.at_ms);
      };
      steps.appendChild(li);
    });
    if (player) player.onTime = ms => {
      let current = -1;
      r.steps.forEach((s, i) => { if (s.at_ms <= ms) current = i; });
      steps.querySelectorAll('li').forEach((li, i) => li.classList.toggle('now', i === current));
    };
  }
  if (!r || !r.steps.length) steps.innerHTML = '<li class="dim">The run listed no steps.</li>';

  const ran = view.querySelector('.ran');
  if (!d.ran) {
    ran.innerHTML = `<div class="dim">${r ? 'The run left no coverage, so what it ran is not known. A <span class="mono">coverage.lcov</span> beside its <span class="mono">test.json</span> says.' : 'It has not run.'}</div>`;
  } else if (!d.ran.length) {
    ran.innerHTML = '<div class="dim">Its coverage names no file of this repository.</div>';
  } else {
    const most = Math.max(...d.ran.map(f => f.lines));
    for (const f of d.ran) {
      const row = document.createElement('div');
      row.className = 'item ranfile';
      row.innerHTML = `<span class="mono grow">${esc(f.path)}</span>
        <span class="bar" title="${f.lines} lines ran, ${f.only_here} of them in no other end-to-end test"><span class="all" style="width:${(100 * f.lines / most).toFixed(1)}%"></span><span class="only" style="width:${(100 * f.only_here / most).toFixed(1)}%"></span></span>
        <span class="dim count">${f.lines}${f.only_here ? ` · <b>${f.only_here} only here</b>` : ''}</span>`;
      row.onclick = () => {
        state.ran = { path: f.path, ranges: f.ranges, label: d.label, file: d.path, name: d.name };
        openFile(f.path, f.ranges.length ? f.ranges[0][0] : undefined);
      };
      ran.appendChild(row);
    }
  }

  const docs = view.querySelector('.docs');
  if (!d.docs.length) docs.innerHTML = `<div class="dim">${r && r.docs && r.docs.length ? 'The sections it names are not there.' : 'Nothing written down shares enough of its words.'}</div>`;
  for (const doc of d.docs) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span class="grow">${esc(doc.heading)}</span><span class="mono dim">${esc(doc.path)}:${doc.line}</span>
      <span class="badge ${doc.declared ? '' : 'guess'}" title="${doc.declared ? 'the test names it' : 'a guess, from the words they share: ' + esc(doc.shared.join(', '))}">${doc.declared ? 'named by the test' : 'a guess'}</span>`;
    row.onclick = () => openFile(doc.path, doc.line);
    docs.appendChild(row);
  }

  const smaller = view.querySelector('.smaller');
  if (!d.smaller.length) smaller.innerHTML = `<div class="dim">${d.ran ? 'No smaller test names the code it ran.' : 'Known once its coverage is.'}</div>`;
  for (const t of d.smaller) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span class="grow">${esc(t.label)} <span class="dim">${esc(LEVEL_NAMES[t.level] || t.level)}</span></span>
      <span class="mono dim" title="${esc(t.shared.join(', '))}">${esc(t.path)}:${t.line}</span>`;
    row.onclick = () => openFile(t.path, t.line || undefined);
    smaller.appendChild(row);
  }
}

// How long ago a recording was made, and how far the code has moved on since.
function recordingAge(t, r) {
  if (!r) return '';
  const when = r.started ? 'ran ' + ago(r.started) : 'ran';
  const s = t && t.stale;
  if (!s) return when;
  if (!s.commits && !s.files) return when + ' · <span class="fresh">matches the tree</span>';
  const parts = [];
  if (s.commits) parts.push(`${s.commits} commit${s.commits === 1 ? '' : 's'}`);
  if (s.files) parts.push(`${s.files} changed file${s.files === 1 ? '' : 's'}`);
  return when + ` · <span class="stale">${parts.join(' and ')} since</span>`;
}

// One test as a card: what it says it shows, how its last run went, and the recording of it.
// `t` is the test, `r` its recording; an orphaned recording has no test.
function e2eCard(t, r) {
  const card = document.createElement('div');
  const status = !r ? 'norec' : r.passed ? 'passed' : 'failed';
  card.className = 'e2e-test ' + status;
  const label = t ? t.label : r.test;
  const mark = { passed: '✓', failed: '✗', norec: '○' }[status];
  const file = t ? t.path : r.file;
  const line = t ? t.line : r.line;
  card.innerHTML = `<div class="head"><span class="mark">${mark}</span><a class="label" data-act="detail" title="the test on its own: what it ran, what documents it, the tests below it">${esc(label)}</a>
      ${t && t.security ? '<span class="badge sec" title="its name or path is about security">security</span>' : ''}
      ${t && t.ignored ? '<span class="badge">skipped</span>' : ''}</div>
    <div class="meta dim">${t ? `<a data-act="source" class="mono">${esc(file)}${line ? ':' + line : ''}</a> · ${esc(t.why)}` : esc(file) + ' · its test is not there any more'}${r ? ' · ' + recordingAge(t, r) : ''}</div>
    <div class="media"></div>
    <div class="failures"></div>
    <details class="steps" hidden><summary></summary><ol></ol></details>`;
  if (t) on(card, 'source', () => openFile(t.path, t.line || undefined));
  if (t) on(card, 'detail', () => showTestView(t.path, t.name));
  const media = card.querySelector('.media');
  if (!r) {
    media.innerHTML = '<div class="none dim">No recording yet: this test has not left one where the tool looks.</div>';
    return card;
  }
  const fails = card.querySelector('.failures');
  for (const s of r.steps.filter(s => s.kind === 'check' && s.passed === false)) {
    const div = document.createElement('div');
    div.className = 'fail';
    div.innerHTML = `<b>✗ ${esc(s.text)}</b>${s.detail ? `<pre>${esc(s.detail)}</pre>` : ''}`;
    fails.appendChild(div);
  }
  const player = r.kind === 'terminal' ? castPlayer(media, r) : r.kind === 'video' ? videoPlayer(media, r) : null;
  if (!player) media.innerHTML = '<div class="none dim">The test ran, but left no recording this page can play.</div>';
  if (r.steps.length) {
    const details = card.querySelector('.steps');
    details.hidden = false;
    details.querySelector('summary').textContent = `${r.steps.length} step${r.steps.length === 1 ? '' : 's'}`;
    const list = details.querySelector('ol');
    r.steps.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = s.kind + (s.passed === false ? ' failed' : '');
      li.innerHTML = `<span class="at mono">${clock(s.at_ms)}</span> ${s.kind === 'check' ? (s.passed === false ? '✗' : '✓') + ' ' : ''}${esc(s.text)}`;
      li.onclick = () => { if (player) player.seek(s.at_ms); };
      list.appendChild(li);
    });
    if (player) player.onTime = ms => {
      let current = -1;
      r.steps.forEach((s, i) => { if (s.at_ms <= ms) current = i; });
      list.querySelectorAll('li').forEach((li, i) => li.classList.toggle('now', i === current));
    };
  }
  return card;
}

const clock = ms => { const s = ms / 1000; return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`; };

// Calls `load` once `el` first comes near the screen: a page of twenty videos fetches the
// ones someone scrolls to.
function whenVisible(el, load) {
  if (!('IntersectionObserver' in window)) return load();
  const seen = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) { seen.disconnect(); load(); }
  }, { rootMargin: '200px' });
  seen.observe(el);
}

// A recording's bytes, fetched with the API token like every request: a <video> pointing at
// the API could not send it, so it plays from memory.
async function recordingBlob(path) {
  const res = await fetch('/api/recording?path=' + encodeURIComponent(path) + '&repo=' + state.repo,
    { headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.blob();
}

// A browser test's video. The player is the browser's own; `seek` and `onTime` tie it to
// the steps.
function videoPlayer(into, r) {
  const video = document.createElement('video');
  video.controls = true;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'metadata';
  into.appendChild(video);
  const player = { onTime: null, seek: ms => { video.currentTime = ms / 1000; } };
  video.ontimeupdate = () => player.onTime && player.onTime(video.currentTime * 1000);
  whenVisible(into, async () => {
    try {
      video.src = URL.createObjectURL(await recordingBlob(r.dir + '/' + r.recording));
    } catch (e) {
      into.innerHTML = `<div class="none dim">could not load the video: ${esc(e.message)}</div>`;
    }
  });
  return player;
}

// The 256 colours of a terminal's palette, the first sixteen as a dark terminal draws them.
const ANSI16 = ['#1d1f21', '#cc6666', '#8abe7a', '#e0c56e', '#6f9fd1', '#b294bb', '#73c0c0', '#c5c8c6',
  '#666a70', '#e57e7e', '#a8d68f', '#f0d98a', '#89b4e6', '#c9a9d1', '#8fd6d6', '#ffffff'];
function xterm(i) {
  if (i < 16) return ANSI16[i];
  if (i < 232) {
    const c = [0, 95, 135, 175, 215, 255], n = i - 16;
    return `rgb(${c[Math.floor(n / 36)]},${c[Math.floor(n / 6) % 6]},${c[n % 6]})`;
  }
  const g = 8 + (i - 232) * 10;
  return `rgb(${g},${g},${g})`;
}
const termColour = c => Array.isArray(c) ? `rgb(${c[0]},${c[1]},${c[2]})` : xterm(c);

// One row of a terminal recording, as the server played it: runs of text of one look.
function termRow(runs) {
  return runs.map(r => {
    let fg = r.fg !== undefined ? termColour(r.fg) : null, bg = r.bg !== undefined ? termColour(r.bg) : null;
    if (r.inverse) [fg, bg] = [bg || 'var(--term-bg)', fg || 'var(--term-fg)'];
    let style = '';
    if (fg) style += `color:${fg};`;
    if (bg) style += `background:${bg};`;
    if (r.bold) style += 'font-weight:bold;';
    if (r.italic) style += 'font-style:italic;';
    if (r.underline) style += 'text-decoration:underline;';
    return style ? `<span style="${style}">${esc(r.text)}</span>` : esc(r.text);
  }).join('');
}

// A terminal test's recording, played as text: the server has run it through a terminal
// emulator into frames, each the rows that changed. A play button, a scrubber, and the time.
function castPlayer(into, r) {
  into.innerHTML = '<div class="cast"><pre class="term"></pre><div class="controls"><button data-act="play" title="play or pause">▶</button><input type="range" min="0" value="0" step="10"><span class="time mono dim">0:00.0</span></div></div>';
  const pre = into.querySelector('pre.term'), button = into.querySelector('[data-act=play]');
  const slider = into.querySelector('input'), time = into.querySelector('.time');
  let cast = null, at = 0, playing = false, started = 0, from = 0;
  const player = { onTime: null, seek: ms => { at = ms; if (playing) { started = performance.now(); from = ms; } draw(); } };
  const draw = () => {
    if (!cast) return;
    const rows = new Array(cast.height).fill(null).map(() => []);
    for (const f of cast.frames) {
      if (f.at_ms > at) break;
      for (const [row, runs] of f.rows) rows[row] = runs;
    }
    pre.innerHTML = rows.map(termRow).join('\n');
    slider.value = at;
    time.textContent = `${clock(at)} / ${clock(cast.duration_ms)}`;
    if (player.onTime) player.onTime(at);
  };
  // Sized so that the whole terminal fits the card: a recording with its right half cut
  // off is not a recording of the screen.
  const fit = () => {
    if (!cast || !pre.isConnected) return;
    const width = into.clientWidth - 2;
    pre.style.fontSize = Math.max(4, Math.min(13, width / (cast.width * 0.6))) + 'px';
  };
  const tick = () => {
    if (!playing || !pre.isConnected) return;
    at = Math.min(cast.duration_ms, from + (performance.now() - started));
    draw();
    if (at >= cast.duration_ms) { playing = false; button.textContent = '▶'; return; }
    requestAnimationFrame(tick);
  };
  button.onclick = () => {
    if (!cast) return;
    playing = !playing;
    button.textContent = playing ? '❚❚' : '▶';
    if (playing) {
      if (at >= cast.duration_ms) at = 0;
      started = performance.now();
      from = at;
      requestAnimationFrame(tick);
    }
  };
  slider.oninput = () => player.seek(Number(slider.value));
  whenVisible(into, async () => {
    try {
      cast = await api('/cast?' + qs({ path: r.dir + '/' + r.recording }));
      slider.max = cast.duration_ms;
      pre.style.width = cast.width + 'ch';
      // The first frame with something on it: a full-screen program starts by clearing it.
      const shown = cast.frames.find(f => f.rows.some(([, runs]) => runs.some(r => r.text.trim())));
      at = shown ? shown.at_ms : 0;
      fit();
      draw();
      new ResizeObserver(fit).observe(into);
    } catch (e) {
      into.innerHTML = `<div class="none dim">could not play the recording: ${esc(e.message)}</div>`;
    }
  });
  return player;
}

async function showSpec(params = {}) {
  setTabs('spec');
  const p = params.commit ? { commit: params.commit } : { stretch: params.stretch || state.specStretch || 'week' };
  if (!p.commit) state.specStretch = p.stretch;
  if (params.area) p.area = params.area;
  state.specParams = p;
  const route = routes.spec(p);
  navigate(route);
  const content = $('#content');
  if (!content.querySelector('.spec')) content.innerHTML = '<div class="center">reading the tests…</div>';
  try {
    const spec = await api('/spec?' + qs({ stretch: p.stretch, commit: p.commit }));
    if (state.view !== 'spec' || currentRoute !== route) return;
    renderSpec(content, spec, p);
    // The list came from OVERVIEW.md while the index is built; ask again until it has not.
    if (spec.as_of) setTimeout(() => { if (state.view === 'spec' && currentRoute === route) showSpec(p); }, 2000);
  } catch (e) {
    content.innerHTML = '';
    fail(e);
  }
}

function renderSpec(content, spec, p) {
  const top = content.scrollTop;
  const same = content.dataset.spec === JSON.stringify(p);
  content.dataset.spec = JSON.stringify(p);
  const choices = p.commit
    ? '<button data-act="log" title="back to the log, at this commit">‹ log</button>'
    : '<span class="stretches">' + STRETCHES.map(([k, name]) => `<button data-stretch="${k}" class="${p.stretch === k ? 'on' : ''}">${name}</button>`).join('') + '</span>';
  content.innerHTML = `<div class="panelhead"><span class="path">Tests</span><span class="dim lines">${spec.total}${spec.ignored ? ', ' + spec.ignored + ' skipped' : ''}</span><span class="spacer"></span>${choices}</div>
    <div class="overview spec"></div>`;
