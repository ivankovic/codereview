  content.querySelectorAll('[data-stretch]').forEach(b => b.onclick = () => showSpec({ stretch: b.dataset.stretch, area: p.area }));
  on(content, 'log', () => showLog(null, true, p.commit));
  const body = content.querySelector('.spec');
  body.appendChild(changesCard(spec));

  // The tests as they are: narrowed to an area by a chip, searched by their words, and
  // otherwise folded by level, area and file, so that the first screen is a dozen rows
  // however many thousand tests there are.
  const all = spec.groups.flatMap(g => g.files.flatMap(f => f.tests));
  const pool = all.filter(t => !p.area || (t.areas || []).includes(p.area));
  const count = {};
  for (const t of all) for (const a of t.areas || []) count[a] = (count[a] || 0) + 1;
  const names = spec.areas.length ? spec.areas.map(a => a.name) : Object.keys(count).sort();
  const tools = document.createElement('section');
  tools.innerHTML = `<h3>The tests as they are</h3>
    <input type="search" class="find" placeholder="search ${pool.length} ${pool.length === 1 ? 'test' : 'tests'} by their words" value="${esc(state.specQuery || '')}">
    <div class="chips"><button data-area="" class="${p.area ? '' : 'on'}">All ${all.length}</button>${names.map(a => `<button data-area="${esc(a)}" class="${p.area === a ? 'on' : ''}">${esc(a)} ${count[a] || 0}</button>`).join('')}</div>`;
  tools.querySelectorAll('[data-area]').forEach(b => b.onclick = () => showSpec({ ...p, area: b.dataset.area || undefined }));
  const found = document.createElement('div');
  const levels = document.createElement('div');
  tools.append(found, levels);
  body.appendChild(tools);

  for (const g of spec.groups) {
    const [what, none] = LEVEL_SAYS[g.level];
    const tests = pool.filter(t => t.level === g.level);
    if (!tests.length) {
      const finding = !p.area && (g.level === 'security' || g.level === 'end_to_end');
      levels.insertAdjacentHTML('beforeend', `<div class="fold-empty"><b>${esc(g.title)}</b><span class="empty ${finding ? 'finding' : 'dim'}">${esc(p.area ? 'None counts towards ' + p.area + '.' : none)}</span></div>`);
      continue;
    }
    levels.appendChild(fold('level:' + g.level, `<b>${esc(g.title)}</b>`, tests, d => {
      d.insertAdjacentHTML('beforeend', `<div class="dim caveat">${esc(what)}</div>`);
      if (p.area) byFile(d, tests, 'level:' + g.level); else byArea(d, tests, 'level:' + g.level);
    }, 'level'));
  }

  // Searching shows what matches instead of the folds, a level at a time; every word typed
  // must be in the test's sentence, its name or its file.
  const search = tools.querySelector('.find');
  const draw = () => {
    const words = (state.specQuery || '').toLowerCase().split(/\s+/).filter(Boolean);
    levels.hidden = words.length > 0;
    found.innerHTML = '';
    if (!words.length) return;
    const hits = pool.filter(t => {
      const text = (t.label + ' ' + t.name + ' ' + t.path).toLowerCase();
      return words.every(w => text.includes(w));
    });
    found.insertAdjacentHTML('beforeend', `<div class="dim caveat">${hits.length} ${hits.length === 1 ? 'test matches' : 'tests match'}</div>`);
    for (const g of spec.groups) {
      const these = hits.filter(t => t.level === g.level);
      if (these.length) found.appendChild(fold('found:' + g.level, `<b>${esc(g.title)}</b>`, these, d => paged(d, these, testCard), '', true));
    }
  };
  search.oninput = () => { state.specQuery = search.value; draw(); };
  draw();

  if (spec.as_of) body.prepend(asOfNote(spec.as_of));
  if (same) content.scrollTop = top;
  hint('Click a change to see its diff, a test to open it, a file it names to open that.', 'Tap a change to see its diff, a test to open it.');
}

// What the stretch did, as a card. The tests that now ask less are listed, since there are
// rarely many and each is worth a look; everything else is a count per kind of change, which
// opens to that kind, by file.
function changesCard(spec) {
  const section = document.createElement('section');
  section.className = 'state changes';
  section.innerHTML = `<h3>In ${esc(spec.span.label)}</h3>`;
  if (!spec.changes.length) {
    section.insertAdjacentHTML('beforeend', '<div class="dim empty">Nothing: no test was added, changed or removed.</div>');
    return section;
  }
  const alarming = spec.changes.filter(c => ALARMING.includes(c.what));
  if (alarming.length) {
    const box = document.createElement('div');
    box.className = 'alarm';
    box.innerHTML = `<h4>Asks less than before: ${alarming.length}</h4>`;
    paged(box, alarming, c => changeRow(c, spec.span));
    section.appendChild(box);
  }
  const rest = spec.changes.filter(c => !ALARMING.includes(c.what));
  if (!rest.length) return section;
  const kinds = groupBy(rest, c => c.what);
  const chips = document.createElement('div');
  chips.className = 'chips kinds';
  chips.innerHTML = kinds.map(([kind, cs]) => `<button data-kind="${kind}" class="${state.specKind === kind ? 'on' : ''}"><span class="what ${kind}">${cs.length} ${kind}</span></button>`).join('');
  const list = document.createElement('div');
  const show = () => {
    chips.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.kind === state.specKind));
    list.innerHTML = '';
    const open = kinds.find(([kind]) => kind === state.specKind);
    if (!open) return;
    const [kind, cs] = open;
    const files = groupBy(cs, c => c.path);
    if (files.length === 1) { paged(list, cs, c => changeRow(c, spec.span)); return; }
    paged(list, files, ([path, these]) => fold(`changes:${kind}:${path}`, `<span class="mono">${esc(path)}</span>`, these,
      d => paged(d, these, c => changeRow(c, spec.span)), '', false));
  };
  chips.querySelectorAll('button').forEach(b => b.onclick = () => {
    state.specKind = state.specKind === b.dataset.kind ? null : b.dataset.kind;
    show();
  });
  section.append(chips, list);
  show();
  return section;
}

// A group small enough to be read at a glance is opened rather than folded.
const SMALL = 12;
// How many rows any one list shows before it offers more.
const PAGE = 50;

function groupBy(items, key) {
  const groups = new Map();
  for (const it of items) {
    const k = key(it);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  return [...groups.entries()];
}

// Appends `items` to `into` a page at a time: the first PAGE of them, then a button for the
// next. A phone draws a thousand cards slowly and nobody reads past the first screen of them.
function paged(into, items, make, page = PAGE) {
  let shown = 0;
  const more = document.createElement('button');
  more.className = 'more-rows';
  const next = () => {
    const frag = document.createDocumentFragment();
    for (const it of items.slice(shown, shown + page)) frag.appendChild(make(it));
    into.insertBefore(frag, more);
    shown = Math.min(items.length, shown + page);
    more.hidden = shown >= items.length;
    more.textContent = `Show ${Math.min(page, items.length - shown)} more, of ${items.length - shown} left`;
  };
  more.onclick = e => { e.stopPropagation(); next(); };
  into.appendChild(more);
  next();
}

// A fold that builds what is inside it the first time it is opened, so that a level of a
// thousand tests costs nothing until someone looks into it. Which folds are open is kept,
// by `key`, across the redraws the watcher makes when the repository moves.
function fold(key, title, items, build, cls = '', openByDefault = items.length <= SMALL) {
  state.specOpen = state.specOpen || {};
  const d = document.createElement('details');
  d.className = 'fold ' + cls;
  const skipped = items.filter(t => t.ignored).length;
  d.innerHTML = `<summary><span class="grow">${title}</span><span class="dim count">${items.length}${skipped ? ', ' + skipped + ' skipped' : ''}</span></summary>`;
  let built = false;
  const fill = () => { if (d.open && !built) { built = true; build(d); } };
  d.addEventListener('toggle', () => { state.specOpen[key] = d.open; fill(); });
  d.open = key in state.specOpen ? state.specOpen[key] : openByDefault;
  fill();
  return d;
}

// The tests of one level by the area each is filed in, then by file; a step with one group
// in it is skipped. These folds start closed: they are only there because the level was too
// long to show whole, and opening it should show a short list, not every small file open.
function byArea(into, tests, key) {
  // Few enough to read whole: the cards say their files, and folds would only hide them.
  if (tests.length <= SMALL) { paged(into, tests, testCard); return; }
  const areas = groupBy(tests, t => t.home || 'top level').sort((a, b) => a[0].localeCompare(b[0]));
  if (areas.length === 1) { byFile(into, tests, key); return; }
  paged(into, areas, ([area, these]) => fold(`${key}:${area}`, esc(area), these, d => byFile(d, these, `${key}:${area}`), '', false));
}

function byFile(into, tests, key) {
  if (tests.length <= SMALL) { paged(into, tests, testCard); return; }
  const files = groupBy(tests, t => t.path).sort((a, b) => a[0].localeCompare(b[0]));
  if (files.length === 1) { paged(into, tests, testCard); return; }
  paged(into, files, ([path, these]) => fold(`${key}:${path}`, `<span class="mono">${esc(path)}</span>`, these,
    d => paged(d, these, testCard), '', false));
}

// A test as a card: what it says, where it is, and the files of code it names, each of which
// opens. A test that names none drives the system from outside, or checks nothing of it.
function testCard(t) {
  const el = document.createElement('div');
  el.className = 'card-test' + (t.ignored ? ' ignored' : '');
  const base = path => path.split('/').pop();
  const reaches = t.reaches || [];
  const names = reaches.length
    ? 'names ' + reaches.slice(0, 3).map(r => `<a data-path="${esc(r)}">${esc(base(r))}</a>`).join(', ') + (reaches.length > 3 ? ` and ${reaches.length - 3} more` : '')
    : t.line ? 'names no code directly' : '';
  el.innerHTML = `<div class="grow"><div class="label">${esc(t.label)}</div><div class="sub dim"><span class="mono">${esc(t.path)}${t.line ? ':' + t.line : ''}</span>${names ? ' · ' + names : ''}</div></div>${t.ignored ? '<span class="dim">skipped</span>' : ''}`;
  el.title = `${t.name}. ${LEVEL_NAMES[t.level] || ''}: ${t.why}.`;
  // From OVERVIEW.md a test has no line; the file opens at the top.
  el.onclick = () => t.line ? openFile(t.path, t.line) : openFile(t.path);
  el.querySelectorAll('a[data-path]').forEach(a => a.onclick = e => { e.stopPropagation(); openFile(a.dataset.path); });
  return el;
}

// One test a stretch did something to. It opens on the diff of its file across the stretch,
// which is where what happened to it is shown.
function changeRow(c, span) {
  const el = document.createElement('div');
  el.className = 'item';
  const checks = c.checks && c.checks[0] !== c.checks[1] ? `${c.checks[0]} → ${c.checks[1]} assertions` : '';
  const was = c.was ? `was ${c.was}` : '';
  const levelName = { security: 'security', end_to_end: 'end to end', integration: 'integration', unit: 'unit' }[c.level];
  el.innerHTML = `<span class="what ${c.what}">${c.what}</span><span class="grow">${esc(c.label)}${was || checks ? `<div class="dim was">${esc([was, checks].filter(Boolean).join(' · '))}</div>` : ''}</span>
    <span class="dim where">${levelName} · <span class="mono">${esc(c.path)}${c.line ? ':' + c.line : ''}</span></span>`;
  el.title = 'the diff of ' + c.path + ' across ' + span.label;
  el.onclick = () => showDiff({ kind: 'revisions', from: span.base, to: span.to || '', path: c.path, status: 'M' }, [], 0);
  return el;
}

// Prose beats any ranking, and the agent can write it. It goes into OVERVIEW.md under About,
// with the facts it explains, where the tool keeps it and the next reader finds it.
function explainRepository() {
  askAgent({
    preset: 'about_code',
    text: 'Orient someone who has never seen this repository. In a few short paragraphs: what it is for, '
      + 'which files to read first and in what order, and anything about its shape that would surprise a newcomer. '
      + 'Then write what you said into OVERVIEW.md under the "## About" heading, replacing what is under that heading and touching nothing else in the file.',
  });
}

// Whether a result is about the code on disk: a result from before the last commit, or from
// before a file was saved, is a result about something else, however green it is.
function staleness(stale) {
  if (!stale) return '';
  const { commits, files } = stale;
  if (!commits && !files) return '<span class="stale fresh" title="nothing committed or saved since">matches the tree</span>';
  const bits = [];
  if (commits) bits.push(`${commits} ${commits === 1 ? 'commit' : 'commits'}`);
  if (files) bits.push(`${files} changed ${files === 1 ? 'file' : 'files'}`);
  return `<span class="stale old" title="committed or saved after this result">${bits.join(' and ')} since</span>`;
}

// The names `media::image_type` knows as pictures; the server refuses the rest.
function isImage(path) {
  return /\.(png|jpe?g|gif|webp|bmp|ico|avif|svg)$/i.test(path);
}

// The picture at `path`, fetched with the API token like any request and shown from memory,
// since an <img> pointing at the API could not send the token. Its size goes under it once it
// has loaded, so a picture shrunk to fit says how big it really is.
async function showPicture(into, path) {
  const box = document.createElement('div');
  box.className = 'picture';
  box.innerHTML = '<div class="dim">loading the picture…</div>';
  into.appendChild(box);
  try {
    const res = await fetch('/api/image?path=' + encodeURIComponent(path) + '&repo=' + state.repo,
      { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const img = document.createElement('img');
    img.alt = path;
    img.onload = () => {
      URL.revokeObjectURL(url);
      caption.textContent = `${img.naturalWidth} × ${img.naturalHeight} · ${(blob.size / 1024).toFixed(blob.size < 10240 ? 1 : 0)} KiB`;
    };
    img.onerror = () => { URL.revokeObjectURL(url); caption.textContent = 'the browser could not show this picture'; };
    const caption = document.createElement('div');
    caption.className = 'dim caption';
    img.src = url;
    box.replaceChildren(img, caption);
  } catch (e) {
    box.innerHTML = `<div class="dim">could not load the picture: ${esc(e.message)}</div>`;
  }
}

// How long ago, in the roughest terms that are still true. A review is not a stopwatch.
function ago(iso) {
  const then = Date.parse(iso);
  if (!then) return '';
  const secs = Math.max(0, (Date.now() - then) / 1000);
  for (const [limit, size, name] of [[90, 1, 'second'], [5400, 60, 'minute'], [172800, 3600, 'hour'], [Infinity, 86400, 'day']]) {
    if (secs < limit) {
      const n = Math.round(secs / size);
      return `${n} ${name}${n === 1 ? '' : 's'} ago`;
    }
  }
}

// The checks configured for this machine, as they stand in the repository the page is on: what
// the last run did, and what its artefact says, which are two different things — a figure can
// be there with no run behind it, left by the same command typed in a terminal. Drawn into
// `into`, and again every two seconds while one runs, for as long as `into` is on the page.
async function renderChecks(into) {
  let checks;
  try { checks = await api('/analysis'); } catch (e) {
    into.textContent = 'could not read the checks: ' + e.message;
    return;
  }
  if (!into.isConnected) return;
  into.className = 'checks';
  into.innerHTML = '';
  if (!checks.length) {
    into.innerHTML = `<div class="dim">Nothing here says how to run its tests: no Makefile <code>test</code> or <code>check</code> target, and no Cargo, npm, pytest or Go project at the top. <code>[[analysis]]</code> in the config file names a check by hand: a label, a command, and what it leaves behind.</div>`;
    return;
  }
  for (const c of checks) {
    const last = c.last;
    const figures = c.figures;
    const state_ = last && last.running ? 'running' : last ? (last.exit === 0 ? 'passed' : 'failed') : '';
    const bits = [];
    if (figures && figures.tests !== null && figures.tests !== undefined) {
      bits.push(`${figures.tests} ${figures.tests === 1 ? 'test' : 'tests'}`);
      if (figures.failed) bits.push(`${figures.failed} failed`);
      if (figures.skipped) bits.push(`${figures.skipped} skipped`);
    }
    if (figures && figures.coverage !== null && figures.coverage !== undefined) bits.push(figures.coverage.toFixed(1) + '% covered');
    if (figures && figures.as_of) bits.push('as of ' + ago(figures.as_of));
    const el = document.createElement('div');
    el.className = 'check ' + state_;
    el.innerHTML = `<span class="name">${esc(c.name)}</span>
      <span class="verdict">${last && last.running ? 'running, ' + ago(last.started).replace(' ago', '') : last ? (last.exit === 0 ? 'passed' : 'failed (' + last.exit + ')') + ' in ' + last.seconds.toFixed(1) + 's, ' + ago(last.started) : c.suggested ? 'found here, not run yet' : 'not run here yet'}</span>
      <span class="figures dim">${esc(bits.join(' · '))}</span>
      ${staleness(c.stale)}
      ${c.watched ? '<span class="badge" title="this check also runs on its own when the repository settles">watched</span>' : ''}
      ${c.suggested ? '<span class="badge" title="found in the repository rather than configured; running it saves it to the config file, for this repository">found</span>' : ''}
      <span class="spacer"></span>
      <button class="small" data-act="run" ${last && last.running ? 'disabled' : ''} title="${esc(c.run)}${c.suggested ? ' — and save it to the config file' : ''}">Run</button>
      ${last && last.output ? '<button class="small" data-act="output">Output</button>' : ''}`;
    on(el, 'run', () => api('/analysis/run', { body: { name: c.name } })
      .then(() => { msg(c.name + (c.suggested ? ' started, and saved to the config file for this repository' : ' started')); setTimeout(() => renderChecks(into), 400); })
      .catch(fail));
    on(el, 'output', () => askText(c.name, '', 'Close', last.output));
    into.appendChild(el);
  }
  // While something is running, keep the page honest about it without asking the user to.
  // Leaving the overview, or switching repository, takes `into` off the page and ends this.
  if (checks.some(c => c.last && c.last.running)) {
    clearTimeout(state.checkTimer);
    state.checkTimer = setTimeout(() => { if (into.isConnected) renderChecks(into); }, 2000);
  }
}

// ----- log and history ------------------------------------------------------------------------

// `commit` names one to open, as a page address does; without it the first is shown beside
// the list on a wide screen, and on a phone the list alone.
async function showLog(path = null, keep = false, commit = null) {
  setTabs('log');
  try {
    if (!keep || !state.log || state.log.path !== path) {
      const commits = await api('/log?limit=100' + (path ? '&path=' + encodeURIComponent(path) : ''));
      state.log = { path, commits, selected: 0, files: [], exhausted: commits.length < 100 };
    }
    const wanted = commit ? state.log.commits.findIndex(c => c.hash === commit) : -1;
    if (wanted >= 0) state.log.selected = wanted;
    navigate(routes.log(path, wanted >= 0 ? commit : null));
    renderLog();
    await selectCommit(state.log.selected, wanted >= 0);
  } catch (e) { fail(e); }
}

function renderLog() {
  const log = state.log;
  const content = $('#content');
  content.innerHTML = `<div class="split"><div id="commits"><div class="panelhead"><span class="path">${log.path ? 'history of ' + esc(log.path) : 'log'}</span><span class="dim">${log.commits.length} commits${log.exhausted ? '' : '+'}</span><span class="spacer"></span><button data-act="changes" title="what is changed but not committed">Changes</button></div><div class="list"></div></div>
    <div id="commit"><div class="panelhead phone"><button data-act="up">‹ commits</button></div><div class="details"></div><div class="list files"></div></div></div>`;
  on(content, 'up', () => { content.querySelector('.split').classList.remove('detail'); navigate(routes.log(log.path, null)); });
  on(content, 'changes', () => showChanges());
  const list = content.querySelector('#commits .list');
  if (!log.commits.length) list.innerHTML = '<div class="center">no commits</div>';
  log.commits.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'item' + (i === log.selected ? ' selected' : '');
    el.dataset.i = i;
    el.innerHTML = `<span class="mono dim">${esc(c.short)} ${esc(c.date.slice(0, 10))}</span><span class="grow">${esc(c.subject)}</span><span class="dim">${esc(c.author)}</span>`;
    el.onclick = () => selectCommit(i, true);
    list.appendChild(el);
  });
  if (!log.exhausted) {
    const more = document.createElement('button');
    more.textContent = 'Load more';
    more.style.margin = '8px';
    more.onclick = async () => {
      const next = await api('/log?limit=100&skip=' + log.commits.length + (log.path ? '&path=' + encodeURIComponent(log.path) : ''));
      log.commits.push(...next);
      if (next.length < 100) log.exhausted = true;
      renderLog();
    };
    list.after(more);
  }
  hint(log.path ? 'Click a commit, then the file to see what changed. "vs working tree" diffs that version against your checkout.' : 'Click a commit, then a file.',
    log.path ? 'Tap a commit, then the file to see what changed.' : 'Tap a commit, then a file.');
}

// `chosen` is a commit the reader picked, as opposed to the one shown by default: on a phone
// that opens the commit's own screen, and the page address names it.
async function selectCommit(i, chosen = false) {
  const log = state.log;
  if (!log.commits[i]) return;
  log.selected = i;
  if (chosen) {
    $('#content .split')?.classList.add('detail');
    navigate(routes.log(log.path, log.commits[i].hash));
  }
  $('#content #commits .list')?.querySelectorAll('.item').forEach(el => el.classList.toggle('selected', +el.dataset.i === i));
  const c = log.commits[i];
  const details = $('#content #commit .details');
  details.innerHTML = `<span style="color:var(--upd-fg)">${esc(c.hash)}</span>\n${esc(c.author)} &lt;${esc(c.email)}&gt;  ${esc(c.date)}\n\n<b>${esc(c.subject)}</b>${c.body ? '\n' + esc(c.body) : ''}`;
  const tests = document.createElement('div');
  tests.innerHTML = '<button class="small" title="what this commit did to the tests">Tests in this commit</button>';
  tests.style.marginTop = '6px';
  tests.querySelector('button').onclick = () => showSpec({ commit: c.hash });
  details.appendChild(tests);
  try {
    let files = await api('/commit_files?hash=' + c.hash);
    if (log.path) files.sort((a, b) => (a.path === log.path ? 0 : 1) - (b.path === log.path ? 0 : 1));
    log.files = files;
    const list = $('#content #commit .files');
    list.innerHTML = '';
    files.forEach((f, k) => {
      const el = document.createElement('div');
      el.className = 'item';
      const letter = statusLetter(f);
      el.innerHTML = `<span class="status-letter ${letter}">${letter}</span><span class="mono grow">${esc(f.old_path ? f.old_path + ' → ' + f.path : f.path)}</span>
        ${log.path && f.path === log.path ? '<button class="small" data-act="vs">vs working tree</button>' : ''}`;
      el.onclick = () => showDiff({ kind: 'commit', hash: c.hash, path: f.path, old_path: f.old_path || '', status: letter }, files, k);
      const vs = el.querySelector('[data-act=vs]');
      if (vs) vs.onclick = e => { e.stopPropagation(); showDiff({ kind: 'revisions', from: c.hash, to: '', path: f.path, status: 'M' }, [f], 0); };
      list.appendChild(el);
    });
  } catch (e) { fail(e); }
}

// ----- diff -----------------------------------------------------------------------------------

// `siblings` are the other files of the same change, for paging; a diff opened from its
// address alone has none. Paging replaces the address rather than adding one, so the
// browser's back goes to whatever opened the diff, not through every file paged past.
async function showDiff(params, siblings, index, { replace = false } = {}) {
  try {
    const data = inflateDiff(await api('/diff?' + qs(params)));
    // Side by side needs room for two columns of code; below that it is unreadable. The
    // choice then sticks, so paging through files with ] and [ does not keep flipping layout.
    const unified = state.diff ? state.diff.unified : window.innerWidth < 1100;
    state.diff = { params, data, unified, siblings, index };
    // A diff is a view of its own, whatever opened it. Without this a diff reached from the
    // explorer left the view as 'explore', where the keys below do nothing and typing in the
    // search box would put the file back.
    setTabs('diff');
    navigate(routes.diff(params), { replace });
    renderDiff();
  } catch (e) { fail(e); }
}

// Where the diff's back button goes: to the page before it when this page put it there,
// otherwise to the list the diff belongs to.
function leaveDiff() {
  if (navigated > 0) { history.back(); return; }
  const p = state.diff.params;
  if (p.kind === 'commit' || p.kind === 'revisions') showLog(null, true);
  else if (p.kind === 'staged') showChanges(true);
  else showChanges(false);
}

function renderDiff() {
  const diff = state.diff;
  const d = diff.data;
  const content = $('#content');
  content.innerHTML = '';
  const changes = d.before.line_ops.filter(o => o !== 'none').length + '/' + d.after.line_ops.filter(o => o !== 'none').length;
  const head = document.createElement('div');
  head.className = 'panelhead';
  head.innerHTML = `<button data-act="back">← back</button><span class="path">${esc(diff.params.old_path ? diff.params.old_path + ' → ' + diff.params.path : diff.params.path)}</span>
    <span class="badge">${esc(d.target)}</span><span class="dim">−${d.before.line_ops.filter(o => o !== 'none').length} +${d.after.line_ops.filter(o => o !== 'none').length}</span>
    <span class="dim">${d.structural ? 'structural diff' : 'line diff'}${d.large_residual ? ' · rewritten?' : ''}</span>
    <span class="spacer"></span>
    <span class="hunknav"><button data-act="prevh" title="previous hunk (p)">▲ hunk</button><button data-act="nexth" title="next hunk (n)">▼ hunk</button></span>
    <button data-act="layout">${diff.unified ? 'Side by side' : 'Unified'}</button>
    ${diff.siblings.length > 1 ? `<button data-act="prev" ${diff.index === 0 ? 'disabled' : ''}>◀ file</button><span class="dim">${diff.index + 1}/${diff.siblings.length}</span><button data-act="next" ${diff.index + 1 >= diff.siblings.length ? 'disabled' : ''}>file ▶</button>` : ''}
    <button data-act="review" title="have the agent review this change into REVIEW.md">Ask agent to review</button>
    <button data-act="open">Open in explorer</button>`;
  content.appendChild(head);
  on(head, 'back', leaveDiff);
  on(head, 'review', () => askAgent({ preset: 'review_diff', path: diff.params.path, target: d.target }));
  on(head, 'layout', () => { diff.unified = !diff.unified; renderDiff(); });
  on(head, 'open', () => openFile(diff.params.path));
  const sibling = k => {
    const f = diff.siblings[k];
    const letter = statusLetter(f);
    showDiff({ ...diff.params, path: f.path, old_path: f.old_path || '', status: letter }, diff.siblings, k, { replace: true });
  };
  on(head, 'prev', () => sibling(diff.index - 1));
  on(head, 'next', () => sibling(diff.index + 1));
  on(head, 'nexth', () => jumpHunk(1));
  on(head, 'prevh', () => jumpHunk(-1));

  const rows = d.rows;
  const bl = d.before.text.split('\n'), al = d.after.text.split('\n');
  const onChange = async () => {
    const q = qs(diff.params);
    diff.data = inflateDiff(await api('/diff?' + q));
    state.allComments = await api('/comments');
    await loadState();
    renderDiff();
  };
  const sideRow = (side, i, hunk) => {
    const s = side === 'after' ? d.after : d.before;
    const segs = side === 'after' ? d.after_lines[i] : d.before_lines[i];
    const tr = document.createElement('tr');
    if (i === undefined || i === null) { tr.className = 'empty'; tr.innerHTML = '<td class="m"></td><td class="n"></td><td class="c"> </td>'; return tr; }
    const op = s.line_ops[i];
    tr.className = 'op-' + op;
    if (hunk !== undefined) tr.dataset.hunk = hunk;
    const n = i + 1;
    let mk = op !== 'none' ? {insert:'+',delete:'-',update:'~',move:'>'}[op] : '';
    if (side === 'after') {
      tr.dataset.line = n;
      const c = d.comments.find(c => c.line && c.line <= n && n <= c.end_line);
      if (c) mk = `<span style="color:var(--${c.state})">●</span>`;
    }
    const ranges = side === 'after' ? searchRangesFor(al[i] || '') : [];
    tr.innerHTML = `<td class="m">${mk}</td><td class="n">${n}</td><td class="c">${renderSegments(segs || [], s.spans[i], ranges)}</td>`;
    if (side === 'after') tr.querySelector('td.n').onclick = () => {
      $('#content .form')?.closest('tr')?.remove();
      const form = commentForm(diff.params.path, n, n, al[i] || '', 3, saved => { form.remove(); if (saved) onChange().catch(fail); }, null, '', afterRevision(diff.params));
      tr.after(form);
    };
    return tr;
  };
  // Hunk numbering over aligned rows.
  let hunk = 0, inHunk = false;
  const hunkOf = rows.map(r => {
    const change = (r.before !== null && d.before.line_ops[r.before] !== 'none') || (r.after !== null && d.after.line_ops[r.after] !== 'none');
    if (change && !inHunk) hunk++;
    inHunk = change;
    return change ? hunk : undefined;
  });
  diff.hunks = hunk;
  const byLine = {};
  for (const c of d.comments) if (c.line) (byLine[c.end_line] = byLine[c.end_line] || []).push(c);
  if (!diff.unified) {
    const wrap = document.createElement('div');
    wrap.className = 'sbs';
    const lt = document.createElement('table'), rt = document.createElement('table');
    lt.className = rt.className = 'code';
    rows.forEach((r, k) => {
      lt.appendChild(sideRow('before', r.before, hunkOf[k]));
      rt.appendChild(sideRow('after', r.after, hunkOf[k]));
      if (r.after !== null) for (const c of byLine[r.after + 1] || []) { rt.appendChild(commentRow(c, 3, onChange)); lt.appendChild(sideRow('before', null)); }
    });
    const l = document.createElement('div'), rr = document.createElement('div');
    l.appendChild(lt); rr.appendChild(rt);
    wrap.appendChild(l); wrap.appendChild(rr);
    content.appendChild(wrap);
    // Each side scrolls on its own, so each is a panel for the sticky comment rows.
    watchPanel(l); watchPanel(rr);
  } else {
    const t = document.createElement('table');
    t.className = 'code';
    // Within a hunk, every before line first, then every after line, as diff -u reads.
    let k = 0;
    while (k < rows.length) {
      if (hunkOf[k] === undefined) {
        const r = rows[k];
        if (r.after !== null) t.appendChild(sideRow('after', r.after));
        else if (r.before !== null) t.appendChild(sideRow('before', r.before));
        if (r.after !== null) for (const c of byLine[r.after + 1] || []) t.appendChild(commentRow(c, 3, onChange));
        k++; continue;
      }
      const start = k;
      while (k < rows.length && hunkOf[k] !== undefined) k++;
      for (let m = start; m < k; m++) if (rows[m].before !== null) t.appendChild(sideRow('before', rows[m].before, hunkOf[m]));
      for (let m = start; m < k; m++) if (rows[m].after !== null) {
        t.appendChild(sideRow('after', rows[m].after, hunkOf[m]));
        for (const c of byLine[rows[m].after + 1] || []) t.appendChild(commentRow(c, 3, onChange));
      }
    }
    content.appendChild(t);
  }
  hint(`${diff.hunks} hunks · n/p jump between hunks · click an after-side line number to comment`, `${diff.hunks} hunks · tap an after-side line number to comment`);
  diff.currentHunk = 0;
  if (diff.hunks) jumpHunk(1);
}

function jumpHunk(delta) {
  const diff = state.diff;
  if (!diff || !diff.hunks) return;
  diff.currentHunk = ((diff.currentHunk - 1 + delta + diff.hunks) % diff.hunks) + 1;
  const row = $(`#content tr[data-hunk="${diff.currentHunk}"]`);
  if (row) row.scrollIntoView({ block: 'center' });
  hint(`hunk ${diff.currentHunk}/${diff.hunks} · n/p jump between hunks · click an after-side line number to comment`, `hunk ${diff.currentHunk}/${diff.hunks} · tap an after-side line number to comment`);
}

// ----- review ---------------------------------------------------------------------------------

async function showReview() {
  setTabs('review');
  navigate(routes.view('review'));
  try {
    const all = await api('/comments');
    state.allComments = all;
    const show = state.review.showCompleted;
    const items = all.filter(c => show || c.comment.section === 'Pending').sort((x, y) => x.comment.path.localeCompare(y.comment.path) || (x.line || 0) - (y.line || 0));
    const pending = all.filter(c => c.comment.section === 'Pending').length;
    const content = $('#content');
    content.innerHTML = `<div class="panelhead"><span class="path">REVIEW.md</span><span class="dim">${pending} pending, ${all.length - pending} completed</span><span class="spacer"></span>
      <button data-act="notes" title="NOTES.md, the things that are not tasks">Notes</button><button data-act="toggle">${show ? 'Hide completed' : 'Show completed'}</button><button data-act="reanchor" title="rewrite line numbers of moved comments">Re-anchor</button><button data-act="askall" title="have the agent work through every pending comment">Address all with agent</button></div><div class="list"></div>`;
    on(content, 'notes', showNotes);
    on(content, 'toggle', () => { state.review.showCompleted = !show; showReview(); });
    on(content, 'askall', () => askAgent({ preset: 'address_all' }));
    on(content, 'reanchor', () => api('/reanchor', { post: true }).then(r => { msg(r.moved + ' comment(s) re-anchored'); showReview(); }).catch(fail));
    const list = content.querySelector('.list');
    if (!items.length) list.innerHTML = '<div class="center">no comments</div>';
    for (const c of items) {
      const el = document.createElement('div');
      el.className = 'item';
      const done = c.comment.section !== 'Pending';
      const loc = c.comment.path + (c.line ? ':' + c.line + (c.end_line > c.line ? '-' + c.end_line : '') : '');
      el.innerHTML = `<span class="mono" style="color:var(--${c.state})">${done ? '✓' : '◆'} ${esc(loc)}${c.state !== 'exact' ? ' (' + c.state + ')' : ''}</span>
        <span class="grow" style="${done ? 'opacity:.6' : ''}">${esc(c.comment.text)}</span><span class="dim">${esc(c.comment.author || '')}</span>
        <span class="actions"><button class="small" data-act="toggle">${done ? 'reopen' : 'done'}</button><button class="small" data-act="edit">edit</button><button class="small" data-act="delete">delete</button><button class="small" data-act="ask">ask agent</button></span>`;
      el.onclick = () => { if (!c.line && !state.files.includes(c.comment.path)) return; openFile(c.comment.path, c.line); };
      on(el, 'ask', e => { e.stopPropagation(); askAgent({ preset: 'address_comment', comment: c.comment }); });
      on(el, 'toggle', e => { e.stopPropagation(); api('/comments/toggle', { body: { comment: c.comment } }).then(showReview).catch(fail); });
      on(el, 'delete', e => { e.stopPropagation(); api('/comments/delete', { body: { comment: c.comment } }).then(showReview).catch(fail); });
      on(el, 'edit', async e => { e.stopPropagation(); const t = await askText('Edit comment', c.comment.text); if (t) api('/comments/edit', { body: { comment: c.comment, text: t } }).then(showReview).catch(fail); });
      list.appendChild(el);
    }
    await loadState();
    hint('Click a comment to open the file at its line.', 'Tap a comment to open the file at its line.');
  } catch (e) { fail(e); }
}

// ----- notes ----------------------------------------------------------------------------------

// A comment on a whole file or directory, from the tree or the file header.
async function addPathComment(path) {
  const text = await askText('Comment on ' + path, '', 'Add to REVIEW.md');
  if (!text) return;
  try {
    await api('/comments', { body: { path, line: null, end_line: null, text } });
    msg('comment added to REVIEW.md');
    if (state.file && state.file.path === path) { await refreshFileComments(); return; }
    // The tree counts comments per path, so it needs the new one before it redraws.
    state.allComments = await api('/comments');
    await loadState();
    if (state.view === 'review') showReview();
  } catch (e) { fail(e); }
}

async function addNote(path) {
  const text = await askText(path ? 'Note on ' + path : 'General note', '', 'Add to NOTES.md');
  if (!text) return;
  api('/notes', { body: { path: path || null, text } }).then(() => { msg('note added to NOTES.md'); if (state.view === 'notes') showNotes(); else if (state.file && state.file.path === path) refreshFileComments(); }).catch(fail);
}

async function showNotes() {
  setTabs('notes');
  navigate(routes.view('notes'));
  try {
    const notes = await api('/notes');
    const content = $('#content');
    content.innerHTML = `<div class="panelhead"><span class="path">NOTES.md</span><span class="dim">${notes.length} notes</span><span class="spacer"></span><button data-act="review" title="REVIEW.md, the comments to act on">Review</button><button data-act="add">Add general note</button></div><div class="list"></div>`;
    on(content, 'review', showReview);
    on(content, 'add', () => addNote(null));
    const list = content.querySelector('.list');
    if (!notes.length) list.innerHTML = '<div class="center">no notes</div>';
    for (const n of notes) {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<span class="mono" style="color:var(--accent)">${esc(n.target)}</span><span class="grow" style="white-space:pre-wrap">${esc(n.text)}</span>
        <span class="actions"><button class="small" data-act="edit">edit</button><button class="small" data-act="delete">delete</button></span>`;
      if (n.target !== 'General') el.onclick = () => openFile(n.target);
      on(el, 'delete', e => { e.stopPropagation(); api('/notes/delete', { body: { note: n } }).then(showNotes).catch(fail); });
      on(el, 'edit', async e => { e.stopPropagation(); const t = await askText('Edit note', n.text); if (t) api('/notes/edit', { body: { note: n, text: t } }).then(showNotes).catch(fail); });
      list.appendChild(el);
    }
    $('#hint').textContent = '';
  } catch (e) { fail(e); }
}

// ----- chrome ---------------------------------------------------------------------------------

// Four tabs, one per question: how is it doing, what does it do, what is the code, and what
// is to be done about it. Two of them hold several views, picked from a row under the header;
// a tab remembers which of its views was last open and goes back to it.
const GROUPS = {
  tests: [['e2e', 'End to end'], ['spec', 'All tests']],
  code: [['explore', 'Files'], ['changes', 'Changes'], ['log', 'Log']],
  review: [['review', 'Comments'], ['notes', 'Notes'], ['agent', 'Agent']],
};
const GROUP_OF = { overview: 'overview', e2e: 'tests', spec: 'tests', explore: 'code', changes: 'code', log: 'code', diff: 'code',
  review: 'review', notes: 'review', agent: 'review' };
const lastInGroup = {};

function setTabs(view) {
  state.view = view;
  const group = GROUP_OF[view] || view;
  if (GROUPS[group] && GROUPS[group].some(([v]) => v === view)) lastInGroup[group] = view;
  document.querySelectorAll('header .tabs button').forEach(b => b.classList.toggle('active', b.dataset.group === group));
  renderSubnav(group, view);
  // The stylesheet shows the tree for the explorer only, and on a phone either it or the file.
  document.body.dataset.view = view;
  if (view !== 'explore') setZen(false);
  document.querySelector('header').classList.remove('open');
  hidePopover();
  if (view !== 'explore') $('#drawer').hidden = true;
}

// Draws whatever view is showing, again. Three places need this and they used to each
// have their own list, which drifted.
function rerenderCurrentView() {
  switch (state.view) {
    case 'e2e': return state.testView ? showTestView(state.testView.file, state.testView.name) : showEndToEnd();
    case 'overview': return showOverview();
    case 'spec': return showSpec(state.specParams || {});
    case 'changes': return showChanges(!!state.changesStaged);
    case 'log': return showLog(state.log && state.log.path, true);
    case 'review': return showReview();
    case 'notes': return showNotes();
    case 'agent': return showAgent();
    case 'diff': return state.diff && renderDiff();
    default:
      setTabs('explore');
      return renderFile();
  }
}

function renderSubnav(group, view) {
  const nav = $('#subnav');
  const items = GROUPS[group];
  nav.hidden = !items;
  if (!items) return;
  if (nav.dataset.group !== group) {
    nav.dataset.group = group;
    nav.innerHTML = items.map(([v, name]) => `<button data-sub="${v}">${name}</button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.onclick = () => openView(b.dataset.sub, true));
  }
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.sub === view));
}

document.querySelectorAll('header .tabs button').forEach(b => b.onclick = () => {
  const group = b.dataset.group;
  // Another tab: the view it was last on. The tab already lit: its first view, as a way home.
  const here = GROUP_OF[state.view] === group;
  const v = GROUPS[group] && !here ? (lastInGroup[group] || b.dataset.view) : b.dataset.view;
  openView(v, here);
});

// Opens one of the views a tab or a sub-tab names. `again` is a tap on what is already lit.
function openView(v, again = false) {
  // A tab always starts its view afresh, rather than redrawing what was there. Explore
  // goes back to the open file, or, tapped again on a phone while a file is up, to the tree.
  if (v === 'explore') {
    // Nothing open: the tree, since the overview has a tab of its own. A file open: that file.
    // On a phone, tapped again while the file is up: the tree, which is how you get to the next.
    if ((again || phone()) && state.view === 'explore' && document.body.classList.contains('showfile')) showTree();
    else if (!state.file) showTree();
    else { setTabs('explore'); navigate(routes.file(state.file.path)); renderFile(); }
  }
  if (v === 'e2e') showEndToEnd();
  if (v === 'overview') showOverview();
  if (v === 'spec') showSpec(again ? {} : (state.specParams || {}));
  if (v === 'changes') showChanges();
  if (v === 'log') showLog(null, true);
  if (v === 'review') showReview();
  if (v === 'notes') showNotes();
  if (v === 'agent') showAgent();
}
$('#signout').onclick = async () => {
  try { await api('/logout', { post: true }); } catch (e) { /* the session may already be gone */ }
  location.href = '/';
};

// The Refresh button, and what the watcher below runs on its own. A refresh nobody asked for
// keeps the scroll where the reader left it and says nothing; the agent's own view is left
// alone, since its poll is already drawing it.
async function doRefresh({ quiet = false } = {}) {
  const content = $('#content');
  const top = content.scrollTop, left = content.scrollLeft;
  await api('/refresh', { post: true });
  state.allComments = await api('/comments');
  await loadState();
  await loadRepos();
  if (state.view === 'explore' && state.file) await openFile(state.file.path);
  else if (!(quiet && state.view === 'agent')) rerenderCurrentView();
  if (!quiet) { msg('refreshed'); return; }
  content.scrollTop = top;
  content.scrollLeft = left;
}

$('#refresh').onclick = () => doRefresh().catch(fail);
// ----- watching the repository ----------------------------------------------------------------

// Whatever writes to the repository — the agent in its panel, an editor in another window, a
// git command in a terminal — shows up here without anyone pressing Refresh. The server keeps
// a fingerprint of what the page draws; this asks for it while the page is on screen and
// re-reads when it moves. `version` of null means "take whatever comes next as the baseline",
// which is also how a write of the page's own is kept from redrawing what it just drew.
// What must not be redrawn under the reader's hands: a comment being written, the text sheet,
// and the menu over a name in the code. Each holds something typed or pointed at.
function pageIsBusy() {
  return !!$('#content .form') || !$('#editor').hidden || !$('#popover').hidden
    || !!$('#content .acts.open') || document.querySelector('header').classList.contains('open');
}

async function watchPoll() {
  if (watch.busy || document.hidden || pageIsBusy()) return;
  watch.busy = true;
  try {
    const path = state.view === 'explore' && state.file ? state.file.path : '';
    const r = await api('/version' + (path ? '?path=' + encodeURIComponent(path) : ''));
    const first = watch.version === null;
    const moved = !first && r.version !== watch.version;
    watch.version = r.version;
    if (moved) await doRefresh({ quiet: true });
    // A repository that appeared in a directory of checkouts the server reads: only the list
    // is read again, since nothing the page shows has changed.
    else if (r.repos !== undefined && r.repos !== state.repos.length) await loadRepos();
  } catch (e) {
    // Nothing is said about a poll that fails: the agent's own poll already reports a server
    // that has gone away, and a review that cannot reach it is obvious soon enough.
    console.error(e);
  } finally {
    watch.busy = false;
  }
}

function startWatching() {
  setInterval(watchPoll, watch.every);
  // A page in a background tab, or a phone in a pocket, does not ask; it catches up at once
  // when it is looked at again.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) watchPoll(); });
}

$('#search').oninput = e => { state.search = e.target.value; if (state.view === 'explore' && state.file) renderFile(); else if (state.diff && document.querySelector('.sbs, table.code')) renderDiff(); };
$('#search').onkeydown = e => { if (e.key === 'Escape') { e.target.value = ''; state.search = ''; e.target.blur(); if (state.file) renderFile(); } };

const HELP = `

<tr><td><kbd>Wrap lines</kbd> or <kbd>w</kbd></td><td>wrap long lines instead of scrolling sideways, with the continuation indented; remembered in this browser</td></tr></table>

<h3>Diff</h3><table>
<tr><td><kbd>n</kbd> <kbd>p</kbd></td><td>next / previous hunk</td></tr>
<tr><td><kbd>]</kbd> <kbd>[</kbd></td><td>next / previous file of the same commit</td></tr>
<tr><td><kbd>u</kbd></td><td>toggle unified / side by side</td></tr></table>
<h3>Colours</h3><table>
<tr><td><span class="s-insert">green</span></td><td>inserted</td></tr>
<tr><td><span class="s-delete">red</span></td><td>deleted</td></tr>
<tr><td><span class="s-update">yellow</span></td><td>updated</td></tr>
<tr><td><span class="s-move">grey</span></td><td>moved</td></tr>
<tr><td><span style="color:var(--exact)">●</span> <span style="color:var(--moved)">●</span> <span style="color:var(--stale)">●</span></td><td>comment; yellow when its line moved, red when the line is gone</td></tr></table>
<p class="dim">Comments live in REVIEW.md, notes in NOTES.md, both at the repository root. Every view has an address, so the browser's back returns to the previous one and a file or a diff can be linked to. Esc closes this.</p>`;
$('#help').innerHTML = HELP;
$('#helpbtn').onclick = () => { $('#help').hidden = !$('#help').hidden; };
$('#zen').onclick = () => setZen(false);

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === 'Escape') {
    // Esc closes whatever is open, innermost first, and only then leaves zen.
    const help = !$('#help').hidden, form = $('#content .form')?.closest('tr');
    $('#help').hidden = true;
    form?.remove();
    if (!help && !form && state.zen) setZen(false);
    return;
  }
  if (e.key === '?') { $('#help').hidden = !$('#help').hidden; return; }
  if (e.key === 'z' && fileOnScreen()) { setZen(!state.zen); return; }
  if (e.key === 'w' && !e.ctrlKey && !e.metaKey) { setWrap(!state.wrap); return; }
  // Both fields live in the header, which zen hides, so reaching for one comes out of zen.
  if (e.key === '/') { e.preventDefault(); setZen(false); $('#search').focus(); $('#search').select(); return; }
  if (e.key === '#') { e.preventDefault(); setZen(false); $('#symbol').focus(); $('#symbol').select(); return; }
  if (e.key === '@' && state.file) { showFileSymbols(state.file.path); return; }
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey) { $('#refresh').click(); return; }
  if (state.diff && document.querySelector('#content table.code') && state.view !== 'explore') {
    if (e.key === 'n') jumpHunk(1);
    if (e.key === 'p') jumpHunk(-1);
    if (e.key === 'u') { state.diff.unified = !state.diff.unified; renderDiff(); }
    if (e.key === ']') $('#content [data-act=next]')?.click();
    if (e.key === '[') $('#content [data-act=prev]')?.click();
  }
});

$('#theme').onchange = async e => {
  try {
    await api('/config', { body: { theme: e.target.value } });
    await loadState();
    // The colours are baked into what the server sends for code, so a diff has to be asked
    // for again; everything else redraws from what is already here.
    if (state.view === 'diff' && state.diff) state.diff.data = inflateDiff(await api('/diff?' + qs(state.diff.params)));
    if (state.view === 'explore' && state.file) await openFile(state.file.path);
    else rerenderCurrentView();
    msg('theme saved to the config file');
  } catch (err) { fail(err); }
};

// ----- addresses ------------------------------------------------------------------------------

// Every view has an address in the fragment, so the browser's back goes to the previous
// view, a reload keeps the place, and a file or a comment can be linked to. The fragment
// never reaches the server. With several repositories, `/r<N>` leads.
const routes = {
  prefix: () => state.repo ? `#/r${state.repo}` : '#',
  e2e: () => routes.prefix() + '/',
  test: (file, name) => routes.prefix() + '/test?' + qs({ file, name }),
  overview: () => routes.prefix() + '/summary',
  tree: () => routes.prefix() + '/tree',
  file: (path, line) => routes.prefix() + '/file/' + encodeURIComponent(path).replace(/%2F/g, '/') + (line ? '?line=' + line : ''),
  changes: staged => routes.prefix() + '/changes' + (staged ? '?staged=1' : ''),
  log: (path, commit) => routes.prefix() + '/log' + (path || commit ? '?' + qs({ path, commit }) : ''),
  diff: params => routes.prefix() + '/diff?' + qs(params),
  view: name => routes.prefix() + '/' + name,
  spec: params => routes.prefix() + '/spec' + (qs(params) ? '?' + qs(params) : ''),
};
let currentRoute = null, navigated = 0;
// How many of this page's own steps the browser's history holds behind the current one: the
// back button in the header is there when there is one to go back to. A page put on a phone's
// home screen opens without the browser's own buttons, and this is then the only way back.
let depth = (history.state && history.state.depth) || 0;
function navigate(hash, { replace = false } = {}) {
  if (currentRoute === hash) return;
  currentRoute = hash;
  navigated++;
  if (location.hash === hash) return;
  if (replace) history.replaceState({ depth }, '', hash);
  else { depth++; history.pushState({ depth }, '', hash); }
  $('#back').hidden = depth === 0;
}
window.addEventListener('popstate', e => { depth = (e.state && e.state.depth) || 0; $('#back').hidden = depth === 0; });
$('#back').onclick = () => history.back();

// Shows the view the address names. Each view records its own address, which is the one
// being shown, so nothing here loops.
async function route() {
  const full = location.hash || '#/';
  currentRoute = full;
  // The first view gets an address too, so that back from the next one returns here and
  // not to the page that signed in.
  if (!location.hash) location.replace(full);
  let rest = full.slice(1);
  const repo = rest.match(/^\/r(\d+)(\/.*)?$/);
  if (repo) {
    rest = repo[2] || '/';
    const n = Number(repo[1]);
    if (n !== state.repo && state.repos[n]) { await switchRepo(n); currentRoute = full; }
  }
  const q = rest.indexOf('?');
  const params = Object.fromEntries(new URLSearchParams(q >= 0 ? rest.slice(q + 1) : ''));
  const path = q >= 0 ? rest.slice(0, q) : rest;
  if (path.startsWith('/file/')) return openFile(decodeURIComponent(path.slice(6)), params.line ? Number(params.line) : undefined);
  if (path === '/changes') return showChanges(params.staged === '1');
  if (path === '/log') return showLog(params.path || null, true, params.commit || null);
  if (path === '/diff' && params.path) return showDiff(params, [{ path: params.path, old_path: params.old_path || null, status: params.status || 'M' }], 0);
  if (path === '/tree') return showTree();
  if (path === '/review') return showReview();
  if (path === '/notes') return showNotes();
  if (path === '/agent') return showAgent();
  if (path === '/spec') return showSpec(params);
  if (path === '/summary') return showOverview();
  if (path === '/test' && params.file && params.name) return showTestView(params.file, params.name);
  // What is left is the repository itself, which opens on what it demonstrably does: its
  // end-to-end tests, each with the recording of its last run.
  return showEndToEnd();
}
window.addEventListener('hashchange', () => { if (location.hash !== currentRoute) route().catch(fail); });

try { setWrap(localStorage.getItem('wrap') === '1'); } catch (e) { /* private window */ }
startAgentPolling();
startWatching();
(async () => {
  try {
    state.themesByName = Object.fromEntries((await api('/themes')).map(t => [t.name, t]));
    await loadRepos();
    state.allComments = await api('/comments');
    await loadState();
    hint('Pick a file on the left. ? shows the keys.', 'Pick a file from the tree.');
    await route();
  } catch (e) { fail(e); }
})();
</script>
