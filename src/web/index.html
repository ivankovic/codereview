<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- `interactive-widget=resizes-content` shrinks the layout when the soft keyboard opens,
     so what is being typed into (the agent's compose box, a comment) stays in view. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="themecolor" content="#1b1e24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="codereview">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<title>codereview</title>
<style>
:root {
  --bg: #15171c; --panel: #1b1e24; --code-bg: #15171c; --fg: #d6d8de; --dim: #8a8f9a;
  --border: #2b2f38; --accent: #5ec8e5; --cursor: #2c3242;
  --ins: rgba(46,160,67,.28); --ins-strong: rgba(46,160,67,.55);
  --del: rgba(248,81,73,.28); --del-strong: rgba(248,81,73,.55);
  --upd: rgba(210,153,34,.28); --upd-strong: rgba(210,153,34,.55);
  --mov: rgba(150,157,170,.28); --mov-strong: rgba(150,157,170,.55);
  --exact: #5ec8e5; --moved: #e3b341; --stale: #f85149; --search: rgba(255,200,0,.45); --visual: #2b3a4a;
  --ins-fg: #3fb950; --del-fg: #f85149; --upd-fg: #e3b341; --mov-fg: #9aa0ab;
}
* { box-sizing: border-box; }
/* Elements with their own `display` (the popover, the drawer) must still honour `hidden`. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
/* The dynamic viewport unit follows a phone browser's collapsing toolbars; plain 100% does not. */
@supports (height: 100dvh) { body { height: 100dvh; } }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
/* Shown on a phone only; see the narrow-screen rules at the end. */
.phone { display: none; }
a { color: var(--accent); }
button { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
button:hover { border-color: var(--accent); }
button.primary { border-color: var(--accent); color: var(--accent); }
button.small { padding: 1px 6px; font-size: 11px; }
input, textarea, select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font: inherit; }
textarea { width: 100%; min-height: 3.2em; font-family: ui-monospace, Menlo, Consolas, monospace; }
header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; position: relative; z-index: 6; }
/* On a wide screen the tools sit in the header row as if the wrapper were not there. */
header .tools { display: contents; }
header .brand { font-weight: 700; color: var(--accent); }
header #branch { max-width: 28vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .tabs button { border-radius: 0; border: none; border-bottom: 2px solid transparent; background: none; }
header .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); }
.spacer { flex: 1; }
#back { font-size: 18px; line-height: 1; padding: 2px 10px; }
/* The views inside a tab: Code is files, changes and history; Review is comments, notes and
   the agent. One row under the header, the one shown lit. */
#subnav { display: flex; gap: 4px; padding: 4px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
#subnav[hidden] { display: none; }
#subnav button { border: none; background: none; border-radius: 14px; padding: 3px 12px; }
#subnav button.active { background: var(--cursor); color: var(--accent); }
/* The summary: a few cards that each answer a question and lead to the view that says more. */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-bottom: 18px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--panel); cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card h3 { margin: 0 0 6px; font-size: 14px; }
.card .big { font-size: 20px; font-weight: 600; }
.card.bad { border-left: 4px solid var(--del-fg); }
.card.bad h3, .card .bad { color: var(--del-fg); }
.card.good h3, .card .good { color: var(--ins-fg); }
.card.warn h3 { color: var(--moved); }
.card .row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
.card .more { margin-top: 6px; color: var(--accent); font-size: 12px; }
table.areas { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.areas th { font-weight: 600; font-size: 11px; color: var(--dim); text-align: right; padding: 2px 6px; }
table.areas th:first-child, table.areas td:first-child { text-align: left; }
table.areas td { text-align: right; padding: 4px 6px; border-top: 1px solid var(--border); }
table.areas tr.area { cursor: pointer; }
table.areas tr.area:hover td { background: var(--cursor); }
table.areas td.zero { color: var(--dim); }
table.areas td.gap { color: var(--moved); }
/* The tests: chips to narrow them to one area, then each level folded, a test a card. */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.chips button { border-radius: 14px; padding: 3px 12px; }
.chips button.on { border-color: var(--accent); color: var(--accent); background: var(--cursor); }
.spec details.fold > summary { cursor: pointer; padding: 6px; border-radius: 4px; list-style: none; display: flex; gap: 8px; align-items: baseline; }
.spec details.fold > summary:hover { background: var(--cursor); }
.spec details.fold > summary b { color: var(--accent); }
.spec details.fold .fold { margin-left: 14px; }
.spec .fold-empty { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; padding: 6px 6px 6px calc(6px + 1.1em); }
.spec .fold-empty b { color: var(--accent); }
.spec input.find { width: 100%; max-width: 40em; box-sizing: border-box; margin: 2px 0 8px; }
.spec .chips.kinds { margin: 8px 0 4px; }
.spec .chips.kinds .what { font-size: 12px; }
button.more-rows { margin: 6px 0 6px 22px; }
button.more-rows[hidden] { display: none; }
.spec details > summary::-webkit-details-marker { display: none; }
.spec details > summary::before { content: '▸'; display: inline-block; width: 1.1em; color: var(--dim); }
.spec details[open] > summary::before { content: '▾'; }
.spec .card-test { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px 6px 22px; border-radius: 4px; cursor: pointer; }
.spec .card-test:hover { background: var(--cursor); }
.spec .card-test .sub { font-size: 12px; margin-top: 1px; }
.spec .card-test .sub a { cursor: pointer; }
.spec .card-test.ignored .label { color: var(--dim); }
.dim { color: var(--dim); }
main { flex: 1; display: flex; min-height: 0; }
aside#tree { width: 280px; min-width: 180px; max-width: 50vw; overflow: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 6px 0; resize: horizontal; }
/* The tree is the explorer's, and beside the overview on a wide screen, a click from a file. */
body:not([data-view=explore]):not([data-view=overview]) #tree { display: none; }
aside#tree .row { padding: 1px 8px; cursor: pointer; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
aside#tree .row:hover { background: var(--cursor); }
aside#tree .row.selected { background: var(--visual); }
aside#tree .row .st { width: 1em; text-align: center; font-family: ui-monospace, monospace; }
aside#tree .row .st.M, aside#tree .name.M { color: var(--upd-fg); }
aside#tree .row .st.A, aside#tree .name.A { color: var(--ins-fg); }
aside#tree .row .st.D { color: var(--del-fg); }
aside#tree .row .st.q, aside#tree .name.q { color: var(--dim); }
aside#tree .dir { font-weight: 600; }
aside#tree .row.more { color: var(--dim); }
aside#tree .cnt { color: var(--exact); font-size: 11px; margin-left: auto; }
aside#tree .add { visibility: hidden; margin-left: 6px; padding: 0 4px; color: var(--dim); }
aside#tree .row.dir:hover .add { visibility: visible; }
aside#tree .add:hover { color: var(--fg); }
aside#tree input { width: calc(100% - 16px); margin: 0 8px 6px; }
section#content { flex: 1; overflow: auto; min-width: 0; }
.panelhead { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panelhead .path { font-weight: 600; font-family: ui-monospace, monospace; }
/* On a wide screen the file's other buttons sit in the header row as if the wrapper were not
   there; on a phone they are a menu, because seven buttons are three rows of a small screen. */
.panelhead .acts { display: contents; }
.badge { padding: 0 6px; border-radius: 8px; font-size: 11px; border: 1px solid var(--border); }
.badge.M { color: var(--upd-fg); } .badge.A, .badge.q { color: var(--ins-fg); } .badge.D { color: var(--del-fg); }
table.code { border-collapse: collapse; width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--code-bg); }
table.code td { padding: 0 6px; vertical-align: top; white-space: pre; }
table.code td.n { text-align: right; color: var(--dim); user-select: none; cursor: pointer; width: 1%; border-right: 1px solid var(--border); }
table.code td.n:hover { color: var(--fg); background: var(--cursor); }
table.code td.m { width: 1%; text-align: center; user-select: none; padding: 0 2px; }
table.code td.b { color: var(--dim); font-size: 11px; white-space: nowrap; user-select: none; }
table.code tr.op-insert td.c { background: var(--ins); }
table.code tr.op-delete td.c { background: var(--del); }
table.code tr.op-update td.c { background: var(--upd); }
table.code tr.op-move td.c { background: var(--mov); }
/* Wrapped: the continuation of a line is indented past the start of the code, so a line that
   takes three rows still reads as one line rather than three. */
body.wrap table.code td.c { white-space: pre-wrap; overflow-wrap: anywhere; text-indent: -3ch; padding-left: calc(6px + 3ch); }
table.code tr.op-insert td.m { color: var(--ins-fg); } table.code tr.op-delete td.m { color: var(--del-fg); }
table.code tr.op-update td.m { color: var(--upd-fg); } table.code tr.op-move td.m { color: var(--mov-fg); }
table.code tr.sel td.c { background: var(--visual); }
table.code tr.cur td { background: var(--cursor); }
table.code tr.empty td.c { background: var(--panel); }
span.s-insert { background: var(--ins-strong); } span.s-delete { background: var(--del-strong); }
span.s-update { background: var(--upd-strong); } span.s-move { background: var(--mov-strong); }
mark { background: var(--search); color: inherit; }
tr.comment td { background: var(--panel); padding: 4px 12px; white-space: normal; font-family: -apple-system, "Segoe UI", sans-serif; border-bottom: 1px solid var(--border); }
/* A comment row spans the table, which is as wide as the longest line of code. The comment
   itself stays as wide as the panel and sticks to its left edge, so the text and the buttons
   are in view however far the code has been scrolled sideways. `--panel-w` is measured. */
.cmt, tr.form .form { position: sticky; left: 12px; width: var(--panel-w, 100%); box-sizing: border-box; }
.cmt { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cmt .who { font-weight: 600; }
.cmt.exact .who { color: var(--exact); } .cmt.moved .who { color: var(--moved); } .cmt.stale .who { color: var(--stale); }
.cmt.done { opacity: .6; }
.cmt .text { flex: 1; white-space: pre-wrap; }
.cmt .actions { display: flex; gap: 4px; }
.cmt .st { font-size: 11px; color: var(--dim); }
tr.form td { background: var(--panel); padding: 6px 12px; white-space: normal; }
.form .row { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
.list { padding: 8px 12px; }
.list .item { padding: 4px 8px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.list .item:hover, .list .item.selected { background: var(--cursor); }
.list .item .mono { font-family: ui-monospace, monospace; }
/* The overview: what a repository opens on. Sections of plain prose and short lists, since
   the point is to be read rather than operated. */
.e2e { padding: 10px 14px 20px; overflow: auto; --term-bg: #101215; --term-fg: #d6d8de; }
.e2e h3 { margin: 18px 0 8px; font-size: 13px; color: var(--accent); }
.e2e .e2e-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.e2e .e2e-head .more { margin-left: auto; cursor: pointer; }
.e2e .bad, .e2e-test.failed .mark { color: var(--del-fg); }
.e2e .fresh, .e2e-test.passed .mark { color: var(--ins-fg); }
.e2e .stale { color: var(--moved); }
.e2e-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.e2e-test { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--panel); min-width: 0; }
.e2e-test.failed { border-color: var(--del-fg); }
.e2e-test .head { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.e2e-test .head .label { flex: 1; }
.e2e-test .mark { font-weight: bold; }
.e2e-test.norec .mark { color: var(--dim); }
.e2e-test .meta { font-size: 12px; margin: 2px 0 8px; overflow-wrap: anywhere; }
.e2e-test .meta a { cursor: pointer; }
.e2e-test .badge.sec { color: var(--moved); border-color: var(--moved); }
.e2e-test .media video { width: 100%; max-height: 70vh; background: #000; border-radius: 4px; display: block; }
.e2e-test .media .none { padding: 18px 8px; text-align: center; border: 1px dashed var(--border); border-radius: 4px; }
.e2e-test .cast pre.term { margin: 0; padding: 4px; background: var(--term-bg); color: var(--term-fg); border-radius: 4px; line-height: 1.2; overflow: hidden; white-space: pre; font-family: ui-monospace, Menlo, Consolas, monospace; max-width: 100%; box-sizing: content-box; }
.e2e-test .controls { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.e2e-test .controls input { flex: 1; min-width: 0; }
.e2e-test .fail { margin-top: 8px; color: var(--del-fg); font-size: 12px; }
.e2e-test .fail pre { margin: 4px 0 0; max-height: 10em; overflow: auto; color: var(--fg); background: var(--code-bg); padding: 4px 6px; border-radius: 4px; white-space: pre-wrap; }
.e2e-test details.steps { margin-top: 8px; font-size: 12px; }
.e2e-test details.steps summary { cursor: pointer; color: var(--dim); }
.e2e-test details.steps ol { list-style: none; margin: 4px 0 0; padding: 0; }
.e2e-test details.steps li { padding: 2px 4px; border-radius: 3px; cursor: pointer; }
.e2e-test details.steps li.check { color: var(--dim); }
.e2e-test details.steps li.failed { color: var(--del-fg); }
.e2e-test details.steps li.now { background: var(--cursor); color: var(--fg); }
.e2e-test details.steps .at { color: var(--dim); margin-right: 4px; }
.e2e.testview .meta { margin-bottom: 10px; }
.e2e.testview.failed .mark { color: var(--del-fg); } .e2e.testview.passed .mark { color: var(--ins-fg); }
.e2e.testview .watch { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start; }
@media (max-width: 800px) { .e2e.testview .watch { grid-template-columns: minmax(0, 1fr); } }
.e2e.testview .media video { width: 100%; max-height: 75vh; background: #000; border-radius: 4px; display: block; }
.e2e.testview .media .none { padding: 18px 8px; text-align: center; border: 1px dashed var(--border); border-radius: 4px; }
.e2e.testview .side h3 { margin-top: 0; }
.e2e.testview ol.steps { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow: auto; }
.e2e.testview ol.steps li { padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.e2e.testview ol.steps li.check { color: var(--dim); }
.e2e.testview ol.steps li.failed { color: var(--del-fg); }
.e2e.testview ol.steps li.now { background: var(--cursor); color: var(--fg); }
.e2e.testview ol.steps .at { color: var(--dim); margin-right: 4px; }
.e2e.testview ol.steps .src { display: block; font-size: 11px; color: var(--dim); padding-left: 4.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.e2e.testview ol.steps .src:hover { color: var(--accent); }
.e2e.testview section { margin-top: 18px; }
.e2e.testview .item { display: flex; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 4px; cursor: pointer; min-height: 32px; }
.e2e.testview .item:hover { background: var(--cursor); }
.e2e.testview .item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.e2e.testview .ranfile .bar { position: relative; width: 120px; height: 8px; background: var(--code-bg); border-radius: 4px; overflow: hidden; flex: none; }
.e2e.testview .ranfile .bar span { position: absolute; left: 0; top: 0; bottom: 0; }
.e2e.testview .ranfile .bar .all { background: var(--mov-strong); }
.e2e.testview .ranfile .bar .only { background: var(--ins-fg); }
.e2e.testview .ranfile .count { font-size: 12px; white-space: nowrap; }
.e2e.testview .badge.guess { color: var(--dim); border-style: dashed; }
.e2e-test .head a.label { color: inherit; cursor: pointer; }
.e2e-test .head a.label:hover { color: var(--accent); }
table.code tr.ran td.n { box-shadow: inset 3px 0 var(--ins-fg); }
.ranbanner { padding: 4px 10px; font-size: 12px; background: var(--cursor); display: flex; gap: 8px; align-items: center; }
.e2e .finding { max-width: 70ch; margin: 24px auto; border: 1px solid var(--moved); border-radius: 8px; padding: 14px 18px; background: var(--panel); }
.e2e .finding h2 { margin: 0 0 8px; color: var(--moved); font-size: 17px; }
.e2e .finding .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.overview { padding: 10px 14px 20px; overflow: auto; }
.overview section { margin-bottom: 18px; }
.overview h3 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
.overview .readme { margin: 0; white-space: pre-wrap; font-family: inherit; font-size: 13px; max-width: 80ch; }
.overview .item { display: flex; gap: 10px; align-items: baseline; padding: 3px 6px; cursor: pointer; border-radius: 4px; }
.overview .item:hover { background: var(--cursor); }
.overview .item .why { font-size: 12px; text-align: right; }
.overview .figures { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 6px; }
.overview .fig { font-size: 13px; }
.overview .fig b { font-size: 15px; }
.overview .fig.live { color: var(--accent); cursor: pointer; }
.overview .fig.warn { color: var(--moved); cursor: pointer; }
.overview .ins { color: var(--ins-fg); } .overview .del { color: var(--del-fg); }
.overview .state { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
/* The tests, at the end of the overview: how to run them, with what the last run said and
   whether the code has moved since; then what they say, a folded list per file. */
.overview h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--dim); }
.checks .check .stale { font-size: 12px; }
.checks .check .stale.fresh { color: var(--ins-fg); }
.checks .check .stale.old { color: var(--moved); }
.overview .suite details { margin: 1px 0; }
.overview .suite summary { cursor: pointer; padding: 3px 6px; border-radius: 4px; }
.overview .suite summary:hover { background: var(--cursor); }
.overview .suite .item.test { padding-left: 22px; }
.overview .suite .item.ignored .grow { color: var(--dim); }
.overview .suite .caveat { font-size: 12px; margin: 0 6px 4px; max-width: 80ch; }
.overview .asof { font-size: 12px; margin: 4px 6px; font-style: italic; }
/* The specification: the tests by level, and what a stretch of history did to them, the ones
   that now ask less leading in the colour of a deletion. */
.stretches { display: flex; gap: 4px; flex-wrap: wrap; }
.stretches button.on { border-color: var(--accent); color: var(--accent); }
.what { font-size: 11px; font-family: ui-monospace, monospace; min-width: 6.5em; text-transform: uppercase; letter-spacing: .03em; }
.what.removed, .what.skipped, .what.weakened { color: var(--del-fg); font-weight: 600; }
.what.added, .what.unskipped { color: var(--ins-fg); }
.what.changed { color: var(--upd-fg); }
.what.renamed { color: var(--mov-fg); }
.card .stale { font-size: 12px; }
.card .stale.fresh { color: var(--ins-fg); }
.card .stale.old { color: var(--moved); }
.spec .item .grow { flex: 1; }
.spec .item .where { font-size: 12px; white-space: nowrap; }
.spec .alarm h4 { color: var(--del-fg); }
.spec .item .was { font-size: 12px; }
.spec .empty { margin: 0 6px; max-width: 80ch; }
.spec .empty.finding { color: var(--moved); }
.checks .check { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; row-gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.checks .check .name { font-weight: 600; min-width: 6em; }
.checks .check .verdict { font-size: 12px; }
.checks .check.passed .verdict { color: var(--ins-fg); }
.checks .check.failed .verdict { color: var(--del-fg); }
.checks .check.running .verdict { color: var(--accent); }
.checks .check .figures { font-size: 12px; }
.checks .check .badge { font-size: 11px; }
.list .item .grow { flex: 1; }
.split { display: flex; height: 100%; min-height: 0; }
.split > div { flex: 1; overflow: auto; min-width: 0; }
.split > div:first-child { border-right: 1px solid var(--border); max-width: 50%; }
.details { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-family: ui-monospace, monospace; white-space: pre-wrap; }
/* A picture in the working tree, fitted to the pane, on a checkerboard so that transparency
   shows as transparency. */
.picture { padding: 16px; text-align: center; border-bottom: 1px solid var(--border); }
.picture img { max-width: 100%; max-height: 70vh; image-rendering: auto;
  background: repeating-conic-gradient(var(--panel) 0% 25%, var(--bg) 0% 50%) 50% / 16px 16px; }
.picture .caption { margin-top: 6px; font-size: 12px; }
.status-letter { display: inline-block; width: 1.2em; font-family: ui-monospace, monospace; }
.status-letter.A { color: var(--ins-fg); } .status-letter.D { color: var(--del-fg); } .status-letter.M { color: var(--upd-fg); } .status-letter.R { color: var(--mov-fg); } .status-letter.q { color: var(--dim); }
.sbs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.sbs table.code { width: 100%; }
.sbs > div { overflow-x: auto; min-width: 0; }
.sbs > div:first-child { border-right: 2px solid var(--border); }
footer { padding: 4px 12px; border-top: 1px solid var(--border); background: var(--panel); color: var(--dim); font-size: 12px; display: flex; gap: 16px; }
footer .msg.error { color: var(--del-fg); }
.center { padding: 40px; color: var(--dim); text-align: center; }
#help { position: fixed; inset: 10% 20%; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 16px 24px; overflow: auto; z-index: 10; }
#help h3 { margin: 8px 0 4px; color: var(--accent); }
#help table td { padding: 1px 12px 1px 0; }
#help kbd { font-family: ui-monospace, monospace; background: var(--bg); padding: 0 4px; border-radius: 3px; border: 1px solid var(--border); }
/* Zen: the file and nothing else. Everything that frames it goes, and one button stays to
   bring it back, at the bottom right, clear of the code, of the drawer's own close button and
   of a phone's notch; the tab bar that usually sits there is gone in zen too. The comment rows
   stay: they are part of the file, not of the frame. */
#zen { position: fixed; z-index: 8; opacity: .4; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  bottom: calc(10px + env(safe-area-inset-bottom)); right: calc(12px + env(safe-area-inset-right)); }
#zen:hover, #zen:focus { opacity: 1; }
body.zen header, body.zen footer, body.zen #tree, body.zen #content .panelhead { display: none; }
/* Without this an error would have nowhere to appear; it goes again with the message. */
body.zen.hasmsg footer { display: flex; }
/* The text editor: what used to be the browser's prompt(). A sheet on a phone. */
#editor { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
#editor .sheet { background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 16px; width: min(560px, calc(100vw - 32px)); }
#editor .title { font-weight: 600; margin-bottom: 6px; }
/* What a sheet is about, when a title is not enough: the files a commit would take. */
#editor .note { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin-bottom: 8px; max-height: 30vh; overflow: auto; }
#editor textarea { min-height: 5em; }
.hunknav { display: contents; }
#popover { position: fixed; z-index: 20; max-width: 90vw; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
#popover .word { font-family: ui-monospace, monospace; font-weight: 600; margin-right: 4px; }
#drawer { width: 380px; min-width: 200px; max-width: 60vw; border-left: 1px solid var(--border); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
#drawer .panelhead { position: static; }
/* The list scrolls, not the drawer, so the close button in its header stays put. */
#drawer .list { flex: 1; overflow: auto; }
#drawer .list .item { flex-direction: column; align-items: stretch; gap: 2px; }
#drawer .list .item .loc { color: var(--accent); font-family: ui-monospace, monospace; font-size: 12px; }
#drawer .list .item .label { font-weight: 600; }
#drawer .list .item .text { font-family: ui-monospace, monospace; font-size: 12px; color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#agent { display: flex; flex-direction: column; height: 100%; }
#agent .transcript { flex: 1; overflow: auto; padding: 12px 16px; }
#agent .entry { display: flex; gap: 10px; margin-bottom: 10px; }
#agent .entry .who { width: 56px; flex: none; font-weight: 600; color: var(--dim); font-size: 12px; padding-top: 2px; }
#agent .entry.user .who { color: var(--accent); }
#agent .entry .body { flex: 1; white-space: pre-wrap; word-break: break-word; }
#agent .entry.thought .body, #agent .entry.system .body { color: var(--dim); font-style: italic; }
#agent .entry.tool .body { color: var(--upd-fg); font-family: ui-monospace, monospace; font-size: 12px; }
#agent .entry.log { margin-bottom: 2px; }
#agent .entry.log .body { color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px; }
#agent .progress { color: var(--accent); font-size: 12px; }
#agent .permission pre.perm { margin: 6px 0 0; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; max-height: 12em; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
#agent .usage { color: var(--dim); font-size: 12px; }
#agent .compose { border-top: 1px solid var(--border); padding: 8px 12px; background: var(--panel); }
#agent .compose textarea { min-height: 2.6em; }
#agent .permission { padding: 8px 12px; background: var(--upd); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 800px) {
  #help { inset: 4%; padding: 12px; }
}
/* Touch: no hover, and a finger needs more room than a pointer. */
@media (hover: none) {
  aside#tree .add { visibility: visible; }
  input, textarea, select { font-size: 16px; }  /* below 16px iOS zooms the page into a focused field */
  button { padding: 8px 12px; }
  button.small { padding: 6px 10px; font-size: 13px; }
  header .tabs button { min-height: 44px; }
  aside#tree .row { min-height: 40px; }
  .list .item { min-height: 44px; }
  table.code { font-size: 13px; line-height: 1.7; }
  table.code td.n { min-width: 44px; padding: 0 8px; }
  #drawer .list .item { min-height: 48px; }
  aside#tree { resize: none; }
  #zen { opacity: .75; min-height: 44px; }
}
/* A phone, upright or on its side: one header row, the tabs along the bottom edge, and one
   pane at a time. */
@media (max-width: 700px), (max-height: 500px) {
  .phone { display: revert; }
  body { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  body.zen { padding-bottom: 0; }
  header { padding: 6px 10px; gap: 8px; }
  header #branch { max-width: 40vw; }
  header #more { padding: 4px 10px; font-size: 16px; line-height: 1; }
  header .tools { display: none; }
  header.open .tools { display: flex; flex-direction: column; gap: 8px; position: absolute; top: 100%; left: 0; right: 0; padding: 10px 12px 12px; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  header.open .tools input, header.open .tools select, header.open .tools button { width: 100%; }
  header .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--panel); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  header .tabs button { flex: 1; min-width: 0; padding: 6px 2px; font-size: 12px; border-bottom: none; border-top: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tabs button.active { border-top-color: var(--accent); }
  header .tabs .badge { padding: 0 4px; }
  /* One row, measured rather than hoped for: the path gives way before the buttons do, and
     the line count goes — the file it counts is directly underneath. */
  .panelhead .path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A file's header is one row whatever the file is called: its path gives way first. */
  .panelhead.file .path { flex: 1 1 0; }
  .panelhead .lines { display: none; }
  /* The file's other buttons, as a menu under the one that opens it. `.panelhead` is sticky,
     which already positions the menu; saying `relative` here instead would unstick every
     panel header on the one screen that can least afford to scroll one away. */
  .panelhead .acts { display: none; }
  .panelhead .acts.open { display: flex; flex-direction: column; gap: 8px; align-items: stretch;
    position: absolute; top: 100%; right: 0; min-width: 60vw; z-index: 3; padding: 10px 12px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 0 0 8px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .panelhead .acts.open button { width: 100%; }
  /* The header goes as you read down and comes back as you read up, as a phone browser's own
     does. `hidehead` is not set while its own menu is open. */
  header { transition: max-height .15s, padding .15s; overflow: hidden; max-height: 20em; }
  body.hidehead header { max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom: none; }
  /* The tools menu hangs below the header, and `overflow: hidden` — which is the only reason
     collapsing to `max-height: 0` hides anything — would cut it off there. The header is not
     collapsed while the menu is open, so nothing is left to clip. */
  header.open { overflow: visible; }
  /* The footer is a row of permanent instructions on a screen that has none to spare: it is
     there while it has something to say, and gone otherwise. */
  footer { display: none; }
  body.hasmsg footer { display: flex; }
  body.hasmsg footer #hint { display: none; }
  /* Sized for a finger: text a phone can be read at, and nothing to tap under 44 pixels. */
  body { font-size: 16px; }
  button.small { font-size: 13px; padding: 6px 10px; }
  header .tabs button { font-size: 14px; min-height: 56px; }
  #back { font-size: 24px; min-width: 44px; min-height: 40px; }
  #subnav { position: sticky; top: 0; z-index: 4; padding: 6px 10px; gap: 6px; overflow-x: auto; }
  #subnav button { flex: 1; min-height: 40px; font-size: 15px; border: 1px solid var(--border); }
  .overview { padding: 12px 12px 24px; }
  .overview h3 { font-size: 16px; }
  .overview h4 { font-size: 14px; }
  .overview .item { min-height: 44px; padding: 10px 8px; align-items: center; }
  .overview .suite summary, .spec details.fold > summary { min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 15px; }
  .spec details.fold .fold { margin-left: 8px; }
  .spec input.find { font-size: 16px; min-height: 44px; }
  button.more-rows { min-height: 44px; margin-left: 8px; }
  .overview .fig { font-size: 15px; } .overview .fig b { font-size: 19px; }
  .overview .item .why, .overview .suite .caveat, .overview .asof { font-size: 14px; }
  .summary { grid-template-columns: 1fr; }
  .card { padding: 14px; }
  .card h3 { font-size: 16px; }
  .card .more { font-size: 14px; }
  table.areas th { font-size: 13px; }
  table.areas td { padding: 12px 6px; }
  .chips button { min-height: 40px; font-size: 15px; padding: 6px 14px; }
  .spec .card-test { min-height: 44px; padding: 10px 8px; }
  .spec .card-test .sub { font-size: 14px; }
  .what { font-size: 13px; }
  .card .stale { font-size: 14px; }
  .spec .item .where, .spec .item .was { font-size: 14px; }
  .panelhead button { min-height: 40px; }
  .wide { display: none; }
  .list .item { min-height: 44px; padding: 10px 8px; }
  /* Explore is the tree, or the file, never both; the overview is neither and takes it all. */
  aside#tree { width: auto; min-width: 0; max-width: none; flex: 1; border-right: none; }
  body[data-view=explore]:not(.showfile) #content { display: none; }
  body[data-view=explore].showfile #tree { display: none; }
  body[data-view=overview] #tree { display: none; }
  .overview .item .why { flex-basis: 100%; text-align: left; }
  /* A change is a card: what happened and the test on top, where it is underneath. */
  .spec .item { flex-wrap: wrap; row-gap: 2px; }
  .spec .item .grow { flex-basis: 50%; }
  .spec .item .where { flex-basis: 100%; padding-left: calc(6.5em + 10px); white-space: normal; }
  .panelhead .stretches button { padding: 6px 10px; font-size: 14px; }
  /* Log: the commits, or one commit. */
  .split > div:first-child { max-width: none; border-right: none; }
  .split:not(.detail) > div:last-child { display: none; }
  .split.detail > div:first-child { display: none; }
  /* Lists become cards: the text on its own line, the buttons under it. */
  .list .item { flex-wrap: wrap; row-gap: 4px; }
  .list .item .grow:not(.mono) { flex-basis: 100%; order: 2; }
  .list .item .actions { flex-basis: 100%; order: 3; }
  .cmt .text { flex-basis: 100%; }
  #drawer { position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); height: 50vh; width: auto; min-width: 0; max-width: none; border-left: none; border-top: 1px solid var(--accent); z-index: 4; box-shadow: 0 -8px 24px rgba(0,0,0,.3); }
  .sbs { grid-template-columns: 1fr; }
  [data-act=layout] { display: none; }
  .hunknav { display: flex; flex-direction: column; gap: 6px; position: fixed; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 4; }
  .hunknav button { min-width: 44px; min-height: 44px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  footer { gap: 8px; }
  footer span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Writing a comment takes over the screen: a text box and four buttons do not fit between
     two lines of code on a phone, and the keyboard covers what little room there is. */
  tr.form td { padding: 0; }
  tr.form .form { position: fixed; top: 0; left: 0; right: 0; width: auto; height: var(--vvh, 100%);
    z-index: 30; background: var(--panel);
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  tr.form .form .where { font-size: 13px; word-break: break-all; }
  tr.form .form textarea { flex: 1; }
  tr.form .form .row { margin-top: 0; flex-wrap: wrap; }
  tr.form .form .row button { flex: 1 1 auto; min-height: 44px; white-space: nowrap; }
  /* Extending a range needs the code back, so the form waits, hidden, for the second line. */
  tr.form.picking .form { display: none; }
  #editor { align-items: flex-end; height: var(--vvh, 100%); }
  #editor .sheet { width: 100%; border-radius: 10px 10px 0 0; border-bottom: none; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #popover { max-width: calc(100vw - 16px); }
  #agent .transcript { padding: 10px 12px; }
  #agent .entry .who { width: 44px; }
}
</style>
</head>
<body data-view="explore">
<header>
  <button id="back" title="back to where you were" hidden>‹</button>
  <span class="brand">codereview</span>
  <select id="repo" title="which repository the page shows" hidden></select>
  <span id="branch" class="dim"></span>
  <nav class="tabs">
    <button data-view="e2e" data-group="tests" title="what it does: the end-to-end tests and their recordings, then every test">Tests</button>
    <button data-view="overview" data-group="overview" title="how the repository is doing">Summary</button>
    <button data-view="explore" data-group="code" class="active" title="files, changes and history">Code</button>
    <button data-view="review" data-group="review" title="comments, notes and the agent">Review <span id="pending" class="badge"></span><span id="agentdot" class="badge" hidden></span></button>
  </nav>
  <span class="spacer"></span>
  <button id="more" class="phone" title="search, colour scheme, and more">⋯</button>
  <div class="tools">
    <input id="symbol" placeholder="find symbol (#)" size="16" title="definitions whose name contains this">
    <input id="search" placeholder="search in file (/)" size="20">
    <select id="theme" title="colour scheme, saved to the config file"></select>
    <button id="refresh" title="re-read the repository and both Markdown files">Refresh</button>
    <button id="signout" title="end this session in this browser">Sign out</button>
    <button id="helpbtn">?</button>
  </div>
</header>
<nav id="subnav" hidden></nav>
<main>
  <aside id="tree"></aside>
  <section id="content"><div class="center">Pick a file from the tree.</div></section>
  <aside id="drawer" hidden></aside>
</main>
<button id="zen" hidden title="leave zen mode (z, or Esc)">✕ zen</button>
<div id="popover" hidden></div>
<div id="editor" hidden><div class="sheet"><div class="title"></div><div class="note" hidden></div><textarea></textarea>
  <div class="form"><div class="row"><button class="primary" data-act="ok">Save</button><button data-act="cancel">Cancel</button></div></div></div></div>
<footer><span id="hint" class="dim"></span><span id="msg" class="msg"></span></footer>
<div id="help" hidden></div>
<script>
'use strict';
const TOKEN = __TOKEN__;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// The fingerprint of the repository the page last drew, for the watcher at the bottom of the
// script; `null` means "take the next reading as the baseline".
const watch = { version: null, busy: false, every: 2000 };

const state = {
  repo: 0, repos: [],
  view: 'explore', files: [], zen: false, wrap: false,
  // path -> the one-letter change mark, which is not the same shape as a ChangedFile's
  // `status`, a word.
  statusLetters: {}, pending: 0, hasCommits: true,
  tree: { collapsed: new Set(), filter: '', shown: new Set() },
  file: null,      // { path, lines, text, comments, notes, line_ops, blame }
  diff: null,      // { params, data, unified, siblings, index, back }
  log: null,       // { path, commits, selected, files, exhausted }
  review: { showCompleted: false },
  search: '',
};

// Wires a panel button, named by `data-act`. Optional by design: several panels show a
// button only when it applies.
function on(root, act, fn) {
  root.querySelector(`[data-act=${act}]`)?.addEventListener('click', fn);
}

// The one-letter mark for a changed file: `?` for untracked, otherwise its status.
// `q` is the CSS class for `?`, which is not a name a class may have.
function statusClass(letter) {
  return letter === '?' ? 'q' : letter;
}

function statusLetter(f) {
  return f.status === 'untracked' ? '?' : f.status[0].toUpperCase();
}

// A query string from an object, leaving out what is not set.
function qs(params) {
  return Object.entries(params)
    .filter(([, v]) => v !== undefined && v !== null && v !== '')
    .map(([k, v]) => k + '=' + encodeURIComponent(v))
    .join('&');
}

async function api(path, opts = {}) {
  const init = { headers: { 'Authorization': 'Bearer ' + TOKEN } };
  if (opts.body !== undefined) {
    init.method = 'POST';
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  } else if (opts.post) {
    init.method = 'POST';
  }
  // Every call names the repository the page is on; the server defaults to the first.
  // A write of the page's own moves the fingerprint as well, and the page draws the result
  // itself, so the watcher takes its next reading as a new baseline rather than redrawing.
  if (init.method === 'POST') watch.version = null;
  const res = await fetch('/api' + path + (path.includes('?') ? '&' : '?') + 'repo=' + state.repo, init);
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

function msg(text, isError = false) {
  const el = $('#msg');
  el.textContent = text || '';
  el.className = 'msg' + (isError ? ' error' : '');
  // Zen hides the footer, so the class brings it back for as long as there is a message.
  document.body.classList.toggle('hasmsg', !!text);
  // Clear it later, unless something newer has been said in the meantime.
  if (text) setTimeout(() => {
    if (el.textContent !== text) return;
    el.textContent = '';
    document.body.classList.remove('hasmsg');
  }, 6000);
}
function fail(e) { console.error(e); msg(e.message || String(e), true); }

// A pointer that cannot hover is a finger: hints then say "tap", and never mention a key.
const TOUCH = window.matchMedia && window.matchMedia('(hover: none)').matches;
// A narrow or a short screen shows one pane at a time; the stylesheet draws the same line.
const phone = () => window.matchMedia && window.matchMedia('(max-width: 700px), (max-height: 500px)').matches;
// A phone's keyboard shrinks the visual viewport but leaves the layout one alone, so a panel
// fixed to the window would hide its buttons behind the keyboard. `--vvh` is what is left.
if (window.visualViewport) {
  const measure = () => document.documentElement.style.setProperty('--vvh', window.visualViewport.height + 'px');
  window.visualViewport.addEventListener('resize', measure);
  measure();
}
function hint(mouse, touch) { $('#hint').textContent = TOUCH ? (touch === undefined ? mouse : touch) : mouse; }

// Asks for a piece of text in a sheet of the page's own, with a real textarea: the
// browser's prompt() is one line and looks foreign on a phone. Resolves to null on cancel.
function askText(title, initial = '', okLabel = 'Save', note = '') {
  return new Promise(resolve => {
    const ed = $('#editor');
    const ta = ed.querySelector('textarea');
    ed.querySelector('.title').textContent = title;
    ed.querySelector('.note').textContent = note;
    ed.querySelector('.note').hidden = !note;
    ed.querySelector('[data-act=ok]').textContent = okLabel;
    ta.value = initial;
    ed.hidden = false;
    const done = value => { ed.hidden = true; ed.onclick = null; resolve(value); };
    ed.querySelector('[data-act=ok]').onclick = () => done(ta.value.trim() ? ta.value : null);
    ed.querySelector('[data-act=cancel]').onclick = () => done(null);
    ed.onclick = e => { if (e.target === ed) done(null); };
    ta.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); done(ta.value.trim() ? ta.value : null); }
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
    };
    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
  });
}

// The header gets out of the way as you read down and comes back as you read up. Only on a
// phone — the stylesheet ignores the class elsewhere — and never while its own menu is open,
// which would take the menu with it.
function watchHeaderScroll(el) {
  let last = el.scrollTop;
  el.addEventListener('scroll', () => {
    const now = el.scrollTop;
    const header = document.querySelector('header');
    // A few pixels of wobble is not a direction, and nothing hides at the very top.
    if (Math.abs(now - last) < 12 || header.classList.contains('open')) return;
    document.body.classList.toggle('hidehead', now > last && now > 48);
    last = now;
  }, { passive: true });
}
watchHeaderScroll($('#content'));

// The header's tools live behind one button on a phone.
$('#more').onclick = e => { e.stopPropagation(); document.querySelector('header').classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('header') || e.target.closest('header .tools button')) document.querySelector('header').classList.remove('open'); });
document.addEventListener('click', e => { if (!e.target.closest('.panelhead')) $('#content .acts')?.classList.remove('open'); });

// Comment rows are as wide as the panel that scrolls the code, not as wide as the code; the
// width is measured, since the tree and the drawer change it.
const panelWatcher = window.ResizeObserver && new ResizeObserver(entries => {
  for (const en of entries) en.target.style.setProperty('--panel-w', Math.max(0, en.target.clientWidth - 24) + 'px');
});
function watchPanel(el) { if (panelWatcher) panelWatcher.observe(el); }
watchPanel($('#content'));

// ----- state ----------------------------------------------------------------------------------

function applyTheme(t) {
  // A terminal-palette scheme has no browser colours: follow the browser's preference.
  if (!t || t.terminal) {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    t = state.themesByName && state.themesByName[dark ? 'Dark' : 'Light'];
    if (!t) return;
  }
  const r = document.documentElement.style;
  const alpha = (hex, a) => hex.startsWith('#') && hex.length === 7 ? `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})` : hex;
  r.setProperty('--bg', t.bg); r.setProperty('--code-bg', t.bg); r.setProperty('--fg', t.fg);
  r.setProperty('--panel', t.panel); r.setProperty('--border', t.border); r.setProperty('--dim', t.dim);
  r.setProperty('--accent', t.accent); r.setProperty('--cursor', t.cursor_bg);
  r.setProperty('--ins', t.insert_line); r.setProperty('--ins-strong', t.insert_span);
  r.setProperty('--del', t.delete_line); r.setProperty('--del-strong', t.delete_span);
  r.setProperty('--upd', t.update_line); r.setProperty('--upd-strong', t.update_span);
  r.setProperty('--mov', t.move_line); r.setProperty('--mov-strong', t.move_span);
  r.setProperty('--exact', t.exact); r.setProperty('--moved', t.moved); r.setProperty('--stale', t.stale);
  r.setProperty('--search', alpha(t.search_bg, .6)); r.setProperty('--visual', t.visual_bg);
  r.setProperty('--ins-fg', t.insert_fg); r.setProperty('--del-fg', t.delete_fg);
  r.setProperty('--upd-fg', t.update_fg); r.setProperty('--mov-fg', t.move_fg);
  document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
  // The browser's own chrome around a home-screen app follows the scheme too.
  $('#themecolor').setAttribute('content', t.panel);
}

async function loadState() {
  const s = await api('/state');
  state.files = s.files;
  state.theme = s.theme;
  const sel = $('#theme');
  // Only when the list itself changed: rebuilding it would close an open dropdown.
  if (sel.options.length !== s.themes.length + (s.theme.terminal ? 1 : 0)) {
    sel.innerHTML = (s.theme.terminal ? '<option value="Terminal">Terminal (browser default)</option>' : '') + s.themes.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  }
  sel.value = s.theme.name;
  applyTheme(s.theme);
  state.statusLetters = Object.fromEntries(s.status);
  state.pending = s.pending;
  state.hasCommits = s.has_commits;
  $('#branch').textContent = s.branch + ' · ' + s.root;
  $('#pending').textContent = s.pending;
  renderTree();
}

/// Moves the page to another served repository: everything shown belongs to one, so the
/// per-repository state starts over and the agent transcript is rebuilt from that

async function switchRepo(index) {
  state.repo = index;
  watch.version = null;
  state.file = null; state.diff = null; state.log = null; state.allComments = undefined;
  state.tree.collapsed = new Set(); state.tree.filter = ''; state.tree.shown = new Set();
  Object.assign(agent, { version: 0, entries: [], permission: null, running: false, name: '', status: 'not started',
    progress: '', usage: '', pollFailures: 0, startedAt: null });
