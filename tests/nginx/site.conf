# The site from docs/deploy.md, with the ports and certificate paths the integration test
# uses. Keep the two in step: tests/nginx_proxy.rs fails if a directive exercised here is no
# longer in the document.

# `$uri` and not `$request_uri`: the first is the path alone, the second would carry the
# query, and the query is where the token is on a first visit. The test asserts the log holds
# no token, and this is the line that makes that true.
log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=signin:1m rate=10r/m;
limit_req_status 429;
server_tokens off;

server {
    listen 18080;
    server_name review.test;
    return 301 https://$host:18443$request_uri;
}

server {
    listen 18443 ssl;
    http2 on;
    server_name review.test;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/review.access.log noquery;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # Sign-in is rate limited here as well as by codereview itself. It needs no more than
    # the host and the scheme: nginx refuses the extra requests before they are proxied.
    location = /login {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
