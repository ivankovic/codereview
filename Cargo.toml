[package]
name = "codereview"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Explore and review fast-changing codebases: comments in REVIEW.md, notes in NOTES.md, syntax-aware diffs, file and repository history"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ivankovic/codereview"
readme = "README.md"
keywords = ["code-review", "git", "tui", "diff", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
# Syntax-aware diffing. `default-features = false` drops its own TUI and its clap/ratatui
# dependencies; this crate only needs the diff engine and the language table.
codediff = { version = "0.0.12", default-features = false }
regex = "1.10"
# Same major as codediff's, so its grammars (reached through `codediff::code::language`) are
# usable here for symbol extraction without a second copy of tree-sitter.
tree-sitter = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
unicode-width = "0.2"
# Syntax highlighting. two-face adds the syntaxes syntect's own bundle lacks (Makefile among
# them), which is why it is here and not plain `load_defaults_newlines`.
syntect = { version = "5.2", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# TUI only.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

# Web only.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
rand = { version = "0.9", optional = true }
open = { version = "5", optional = true }
# Password hashing for the browser UI, and reading a password without echoing it.
argon2 = { version = "0.6", optional = true }
rpassword = { version = "7.5", optional = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
web = ["dep:axum", "dep:tokio", "dep:rand", "dep:open", "dep:argon2", "dep:rpassword"]

[[bin]]
name = "codereview"
path = "src/main.rs"
