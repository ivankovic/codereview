[package]
name = "codereview"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Explore and review fast-changing codebases: comments in REVIEW.md, notes in NOTES.md, syntax-aware diffs, file and repository history"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ivankovic/codereview"
readme = "README.md"
keywords = ["code-review", "git", "tui", "diff", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
# Syntax-aware diffing. `default-features = false` drops its own TUI and its clap/ratatui
# dependencies; this crate only needs the diff engine and the language table.
omnidiff = { version = "0.2", default-features = false }
regex = "1.10"
# Same major as omnidiff's, so its grammars (reached through `omnidiff::code::language`) are
# usable here for symbol extraction without a second copy of tree-sitter.
tree-sitter = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
unicode-width = "0.2"
# A terminal emulator, to play a terminal recording into frames both front ends can draw.
vt100 = "0.16"
# Syntax highlighting. two-face adds the syntaxes syntect's own bundle lacks (Makefile among
# them), which is why it is here and not plain `load_defaults_newlines`.
syntect = { version = "5.2", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }

# TUI only.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
# Pictures in the terminal, where it speaks a graphics protocol (kitty, sixel, iTerm2), and the
# decoders for the formats a repository keeps. Not chafa: that links a system library.
ratatui-image = { version = "11", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

# Web only.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
], optional = true }
rand = { version = "0.9", optional = true }
open = { version = "5", optional = true }
# Password hashing for the browser UI, and reading a password without echoing it.
argon2 = { version = "0.6", optional = true }
rpassword = { version = "7.5", optional = true }

# Signalling a process group, so an agent's children go when the agent does.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
# The integration test reads JSON answers from the API.
serde_json = "1"
# The terminal end-to-end tests run the binary in a pseudo-terminal; vt100, a dependency of
# the tool itself, reads the screen the way a terminal would draw it.
portable-pty = "0.9"

[lints.rust]
# `cargo llvm-cov` sets `--cfg coverage`; the browser tests' per-test coverage is built on it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:ratatui-image", "dep:image"]
web = ["dep:axum", "dep:tokio", "dep:rand", "dep:open", "dep:argon2", "dep:rpassword"]

[[bin]]
name = "codereview"
path = "src/main.rs"

# The terminal UI end to end, in a pseudo-terminal: there is no terminal UI to drive without it.
[[test]]
name = "terminal"
required-features = ["tui"]
